# Minimal Supabase CLI config for SILO's Edge Functions. It exists only to
# configure `supabase/functions/*`; the database is managed by
# scripts/apply_schema.py and scripts/apply_analytical.sh, not by the CLI.
#
# DO NOT run `supabase config push` or `supabase db push` with this file: every
# section it omits (auth, storage, api, ...) would be pushed as the CLI's
# defaults over the production project's settings. Deploy functions only:
#
#   supabase functions deploy silo-mcp --project-ref zcjbtpxuhdekpwcxmepn --no-verify-jwt

project_id = "SILO-BZ"

# The remote MCP server (docs: api-docs/mcp.mdx). Public and read-only: it has
# no JWT to verify, so the gateway check is off for this function only.
[functions.silo-mcp]
enabled = true
verify_jwt = false

# The v2 REST gateway (docs/planning/API_V2.md). Public and read-only like
# silo-mcp; a caller's own Bearer JWT is forwarded to PostgREST, which checks it.
# Not deployed: a deploy needs the owner's approval (#1052).
[functions.silo-api]
enabled = true
verify_jwt = false

# MCP v2: 14 tools, one per v2 resource, running the silo-api gateway in
# process (#1060). Public and read-only like silo-mcp, which stays beside it.
# Not deployed: a deploy needs the owner's approval (#1052).
[functions.silo-mcp-v2]
enabled = true
verify_jwt = false

# DJEN relay for the RJ collector (#846): runs in sa-east-1 because DJEN refuses
# non-Brazilian egress. Its own shared-token check replaces the JWT check.
[functions.djen-relay]
enabled = true
verify_jwt = false
