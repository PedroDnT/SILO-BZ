name: Apply schema + migrations
description: >-
  Bootstrap the Supabase Postgres schema idempotently: install psql, apply
  schema.sql + every migrations/*.sql in lexical order, then assert key tables
  exist. Used by EVERY workflow that ingests so no ingest path ever runs against
  a DB that is missing a migration — that drift is what left cvm_fund_registry
  without its admin/gestor columns (migration 11) and silently failed registry
  ingestion. The repository must already be checked out.

inputs:
  postgres-url:
    description: Postgres connection string (Supabase, sslmode=require).
    required: true

runs:
  using: composite
  steps:
    - name: Install PostgreSQL client
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    # Do NOT DROP etf_daily / etf_latest here. Migration 01 already drops them
    # inside the DO block that actually retypes cvm_fi_diario, and 06/10
    # recreate them. An unconditional pre-flight DROP is AccessExclusiveLock
    # on every ingest, and if schema.sql then fails the views stay gone —
    # Backfill #18 (run 33428561498) dropped them, died on `column "tp_fundo"
    # does not exist`, and Refresh ETF failed with relation "etf_daily" does
    # not exist.

    # Schema first, then migrations in lexical order. psql (not apply_schema.py)
    # parses SQL comments/statements correctly and ON_ERROR_STOP fails the job on
    # any real error. All DDL is IF NOT EXISTS / guarded, so this is safe to
    # replay. The closing ::regclass assertion fails the run if a base table OR a
    # migration-created table silently didn't take.
    - name: Apply schema + migrations
      shell: bash
      env:
        POSTGRES_URL: ${{ inputs.postgres-url }}
      run: |
        set -euo pipefail

        # lock_timeout is the difference between a blocked DDL that gives up and
        # one that takes the whole database down with it.
        #
        # 2026-08-26 22:41 UTC: migration 14's `ALTER TABLE cvm_fi_perfil ADD
        # COLUMN` — a metadata-only change that normally returns instantly — hung
        # for 4m20s and the server killed the connection, failing the run and
        # blocking every later migration and the whole analytical layer. Nothing
        # was wrong with the DDL. Four Vercel dashboard builds had started between
        # 22:26 and 22:37, and two of their source queries (fi_investor_mix,
        # fi_investor_split) scan cvm_fi_perfil for 4+ minutes each. They hold
        # AccessShareLock; ADD COLUMN needs AccessExclusiveLock, so it queued.
        #
        # Worse than waiting: a QUEUED AccessExclusiveLock blocks every reader
        # that arrives behind it, so the stuck DDL also stalls the very builds it
        # is waiting on. Failing fast is strictly better than holding that queue.
        #
        # lock_timeout only bounds the wait to ACQUIRE a lock — it never
        # interrupts DDL that is genuinely running — so a legitimately slow
        # migration is unaffected. statement_timeout=0 keeps it that way.
        # Retries give a concurrent build time to finish; three failures means a
        # real long-lived lock holder, which should fail the run loudly.
        #
        # 2026-08-27 02:45 UTC (Daily CVM Ingest #167 / run 33034222521): the
        # 15s lock_timeout then failed schema.sql:268 three times. The statement
        # was `ALTER TABLE cvm_fii_mensal ADD COLUMN IF NOT EXISTS ...` for
        # columns that already existed (the 22:23 run logged "already exists,
        # skipping"). Postgres takes AccessExclusiveLock *before* that check,
        # so a no-op ADD COLUMN still fights every concurrent SELECT. We rewrite
        # top-level ADD COLUMN IF NOT EXISTS through scripts/guard_noop_ddl.py
        # (pg_attribute probe, AccessShareLock) so the daily re-apply does not
        # take the exclusive lock at all when every named column is present.
        # Genuine missing-column DDL still ALTERs, still has lock_timeout, still
        # retries. python3 is stdlib-only — backfill's apply-schema job has no
        # setup-python, only the runner's python3.
        #
        # 2026-08-28 14:36 UTC (Daily CVM Ingest #184 / run 33180429771): the
        # ADD COLUMN guard held (logs are DO / CREATE INDEX through the FII
        # columns). schema.sql then failed three times at CREATE MATERIALIZED
        # VIEW mv_b3_isin_subtype with lock_timeout while inserting into
        # pg_type_typname_nsp_index. CREATE ... AS SELECT (implicit WITH DATA)
        # inserts the composite type and holds that insert uncommitted for the
        # whole b3_cotahist scan; a concurrent apply does not see the relation,
        # tries the same CREATE, and waits on the unique type name. The same
        # rewriter now appends WITH NO DATA so the type commits instantly.
        # Population is a later REFRESH (schema.sql refresh-if-empty, or
        # pg_cron CONCURRENTLY), which does not insert into pg_type.
        #
        # 2026-08-31 19:04 UTC (CVM Historical Backfill #18 / run 33428561498):
        # schema.sql failed three times with `column "tp_fundo" does not exist`
        # and the loop retried it as lock contention (90s of sleep, a
        # misleading annotation). Only lock_timeout is retryable.
        export PGOPTIONS="-c lock_timeout=15s -c statement_timeout=0"

        apply() {
          local file="$1" attempt guarded log
          guarded="$(mktemp)"
          log="$(mktemp)"
          python3 scripts/guard_noop_ddl.py "$file" > "$guarded"
          for attempt in 1 2 3; do
            if psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f "$guarded" >"$log" 2>&1; then
              cat "$log"
              rm -f "$guarded" "$log"
              return 0
            fi
            cat "$log"
            if ! grep -qi 'canceling statement due to lock timeout' "$log"; then
              rm -f "$guarded" "$log"
              echo "::error::$file failed with a SQL error that is not lock" \
                   "contention. Not retrying."
              return 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "== $file failed (attempt $attempt/3) — lock contention;" \
                   "retrying in $((attempt * 30))s =="
              sleep $((attempt * 30))
            fi
          done
          rm -f "$guarded" "$log"
          echo "::error::$file failed after 3 lock-timeout attempts. A" \
               "long-running query (a Vercel dashboard build?) is holding a" \
               "lock on the table."
          return 1
        }

        apply src/store/schema.sql
        for f in src/store/migrations/*.sql; do
          [ -e "$f" ] || continue   # glob stays literal when nothing matches
          echo "== applying $f =="
          apply "$f"
        done
        psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
          -c "SELECT 'cvm_ingest_log'::regclass, 'cvm_etf_registry'::regclass, 'cia_account'::regclass;"
