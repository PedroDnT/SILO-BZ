name: Deploy MCP

# target=silo-mcp (default) deploys supabase/functions/silo-mcp, below.
# target=v2 deploys the v2 gateway (silo-api) and MCP v2 (silo-mcp-v2, which
# bundles silo-api's code), then checks that /v2/ answers (#1182).
#
# Deploys supabase/functions/silo-mcp — the read-only remote MCP over schema
# api — from the dispatched ref, then proves the live endpoint serves every
# tool in tools.ts. Manual on purpose: an MCP tool calls an api.* function
# that is live only after the analytical layer is applied (the 06:00
# daily_ingest, or mode=analytics-only), so deploying on every merge would
# publish tools whose SQL is not there yet. Apply analytics first, then
# dispatch this.
#
# Functions only. Never `supabase config push` / `db push`: supabase/config.toml
# omits every other section, so a push would overwrite production settings with
# CLI defaults. verify_jwt is off for this function (public, read-only, anon key).
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token with access to the project).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "silo-mcp: the v1 MCP. v2: the v2 gateway (silo-api) and MCP v2 (silo-mcp-v2). Apply analytics first."
        type: choice
        default: silo-mcp
        options:
          - silo-mcp
          - v2

permissions:
  contents: read

concurrency:
  group: deploy-silo-mcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zcjbtpxuhdekpwcxmepn
    steps:
      - name: Refuse without a token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN repository secret (a Supabase personal access token)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: latest

      - name: Deploy silo-mcp
        if: ${{ inputs.target == 'silo-mcp' }}
        # --yes: the CLI (version latest) asks for confirmation and refuses
        # without a terminal; measured on run 43200655362, 2026-11-12.
        run: supabase functions deploy silo-mcp --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      # The deploy command succeeding says the bundle uploaded, not that the
      # endpoint answers with this commit's contract. Ask it: versions (REST
      # catalog, MCP server, MCP catalog tool), the tool list, every tool's
      # arguments and defaults, and the same quote_history call over REST and
      # through the MCP (scripts/check_live_contract.py). Retried while the new
      # bundle propagates.
      - name: Live contract matches this commit
        if: ${{ inputs.target == 'silo-mcp' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/check_live_contract.py; then
              exit 0
            fi
            echo "attempt $attempt: the live contract does not match yet; retrying"
            sleep 10
          done
          echo "::error::the published REST/MCP contract does not match this commit (see the FAIL lines above)"
          exit 1

      - name: Deploy silo-api and silo-mcp-v2
        if: ${{ inputs.target == 'v2' }}
        run: |
          supabase functions deploy silo-api --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          supabase functions deploy silo-mcp-v2 --project-ref "$PROJECT_REF" --no-verify-jwt --yes

      # The deploy succeeding says the bundle uploaded. Ask the gateway: an
      # anonymous GET /v2/ answers 200 once the new bundle serves.
      - name: v2 gateway answers
        if: ${{ inputs.target == 'v2' }}
        run: |
          set -euo pipefail
          url="https://$PROJECT_REF.supabase.co/functions/v1/silo-api/v2/"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then
              echo "ok    GET /v2/ answered 200"
              exit 0
            fi
            echo "attempt $attempt: GET /v2/ answered $code; retrying"
            sleep 10
          done
          echo "::error::the v2 gateway did not answer 200 at $url"
          exit 1
