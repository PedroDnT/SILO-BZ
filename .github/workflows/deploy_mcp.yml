name: Deploy MCP

# Deploys supabase/functions/silo-mcp — the read-only remote MCP over schema
# api — from the dispatched ref, then proves the live endpoint serves every
# tool in tools.ts. Manual on purpose: an MCP tool calls an api.* function
# that is live only after the analytical layer is applied (the 06:00
# daily_ingest, or mode=analytics-only), so deploying on every merge would
# publish tools whose SQL is not there yet. Apply analytics first, then
# dispatch this.
#
# Functions only. Never `supabase config push` / `db push`: supabase/config.toml
# omits every other section, so a push would overwrite production settings with
# CLI defaults. verify_jwt is off for this function (public, read-only, anon key).
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token with access to the project).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-silo-mcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy silo-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zcjbtpxuhdekpwcxmepn
    steps:
      - name: Refuse without a token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN repository secret (a Supabase personal access token)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy silo-mcp
        run: supabase functions deploy silo-mcp --project-ref "$PROJECT_REF" --no-verify-jwt

      # The deploy command succeeding says the bundle uploaded, not that the
      # endpoint answers with this commit's tool list. Ask it.
      - name: Live tools/list matches tools.ts
        run: |
          set -euo pipefail
          expected=$(grep -cE '^\s*t\("' supabase/functions/silo-mcp/tools.ts)
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -sS --fail-with-body -X POST \
              "https://${PROJECT_REF}.supabase.co/functions/v1/silo-mcp" \
              -H 'content-type: application/json' \
              -H 'accept: application/json, text/event-stream' \
              -H 'mcp-protocol-version: 2025-06-18' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}') || body=""
            got=$(printf '%s' "$body" | python3 -c '
          import json, sys
          t = sys.stdin.read().lstrip()
          p = t if t.startswith("{") else "".join(l[5:] for l in t.splitlines() if l.startswith("data:"))
          print(len(json.loads(p)["result"]["tools"]))' 2>/dev/null || echo "?")
            if [ "$got" = "$expected" ]; then
              echo "live silo-mcp serves $got tools, as tools.ts declares"
              exit 0
            fi
            echo "attempt $attempt: live endpoint reports $got tools, tools.ts has $expected; retrying"
            sleep 10
          done
          echo "::error::silo-mcp did not serve the deployed tool list (got $got, expected $expected)"
          exit 1
