name: Deploy MCP

# Deploys supabase/functions/silo-mcp — the read-only remote MCP over schema
# api — from the dispatched ref, then proves the live endpoint serves every
# tool in tools.ts. Manual on purpose: an MCP tool calls an api.* function
# that is live only after the analytical layer is applied (the 06:00
# daily_ingest, or mode=analytics-only), so deploying on every merge would
# publish tools whose SQL is not there yet. Apply analytics first, then
# dispatch this.
#
# Functions only. Never `supabase config push` / `db push`: supabase/config.toml
# omits every other section, so a push would overwrite production settings with
# CLI defaults. verify_jwt is off for this function (public, read-only, anon key).
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token with access to the project).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-silo-mcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy silo-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zcjbtpxuhdekpwcxmepn
    steps:
      - name: Refuse without a token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN repository secret (a Supabase personal access token)."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: latest

      - name: Deploy silo-mcp
        run: supabase functions deploy silo-mcp --project-ref "$PROJECT_REF" --no-verify-jwt

      # The deploy command succeeding says the bundle uploaded, not that the
      # endpoint answers with this commit's contract. Ask it: versions (REST
      # catalog, MCP server, MCP catalog tool), the tool list, every tool's
      # arguments and defaults, and the same quote_history call over REST and
      # through the MCP (scripts/check_live_contract.py). Retried while the new
      # bundle propagates.
      - name: Live contract matches this commit
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/check_live_contract.py; then
              exit 0
            fi
            echo "attempt $attempt: the live contract does not match yet; retrying"
            sleep 10
          done
          echo "::error::the published REST/MCP contract does not match this commit (see the FAIL lines above)"
          exit 1
