name: Ingest Watchdog

# Self-healing safety net for the daily ingest. Runs when "Daily CVM Ingest"
# completes, whatever its conclusion (#870), so it never reads a run mid-way;
# if the daily FI slice (or the monthly
# ANBIMA/ETF slice) is stale in cvm_ingest_log, OR if unhealed ingest errors
# remain in the 26h health-gate daily window, it re-runs the daily ingest.
# Historical backfill errors outside DAILY_LOOKBACK_MONTHS do not count —
# run_daily cannot heal 2010 (DB Health #14). Unhealed daily-window errors are
# not weekend-gated: a Saturday CVMHostUnreachable burst is a failed cron, not
# a quiet market day. Recovery probes CVM first: on a blocked runner IP it
# skips the CVM scope instead of writing another round of error rows, still
# heals the other sources, and ends red (#866).
#
# FNET and FNET diffs are not written by run_daily, so the staleness check
# judges each on its own (heal_fnet / heal_fnet_diff) and only a flagged one is
# re-run: the FNET register step in this job, the fnet-diff job below (#870).
# RJ is no longer collected, so it has no recovery job (#877).
#
# This lives entirely in GitHub Actions and reuses the existing POSTGRES_URL
# secret — no GitHub PAT in the database, no pg_net. See scripts/check_staleness.py.

on:
  workflow_run:
    workflows: ["Daily CVM Ingest"]
    types: [completed]
  schedule:
    # Fallback for a day the daily run never ran: 07:40 UTC-3 (10:40 UTC),
    # after the daily workflow's latest finish (~10:00 UTC: 180-min ingest job
    # plus 60-min fnet-diff) and before rj_collect at 11:07 UTC, which a pending
    # run in the shared concurrency group would otherwise cancel. On a normal
    # day it finds everything fresh and does nothing.
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force the recovery run regardless of staleness"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# The recovery path runs run_daily directly, which makes this a third writer
# against the shared Postgres — it joins the same group as daily_ingest.yml
# and backfill.yml so it queues behind them instead of writing on top of them.
concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  watchdog:
    name: Check staleness and self-heal
    runs-on: ubuntu-latest
    # Same cap as the daily job: recovery can now run run_daily, market data,
    # B3 events and FNET back to back (#870), and a job killed mid-step leaves
    # `running` rows behind.
    timeout-minutes: 180
    outputs:
      heal_fnet_diff: ${{ steps.staleness.outputs.heal_fnet_diff }}
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      CVM_DNS_NAMESERVERS: "1.1.1.1,8.8.8.8,9.9.9.9"
      # Optional repository variable: re-points the BACEN SGS host (issue #537). Empty means the default.
      BACEN_SGS_BASE_URL: "${{ vars.BACEN_SGS_BASE_URL }}"
      CVM_DAILY_SCOPE: "all"
      CVM_UPSERT_CHUNK_SIZE: "5000"
      CVM_INGEST_CONCURRENCY: "6"
      CVM_DAILY_CONCURRENCY: "8"
      TZ: "America/Sao_Paulo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check ingest staleness
        id: staleness
        run: |
          set +e
          PYTHONPATH=. python scripts/check_staleness.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "10" ] || [ "$code" = "11" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            # Unexpected failure (e.g. DB unreachable) — surface it, don't mask.
            echo "stale=error" >> "$GITHUB_OUTPUT"
            exit $code
          fi

      # Recovery path: ask CVM first (a blocked IP must not write another
      # round of unhealed error rows), then schema, then run_daily. Gated on
      # the same condition as recovery so a no-op day stays a true no-op.
      # As in daily_ingest.yml (#866), the probe gates the CVM scope only:
      # run_daily skips CVM when CVM_REACHABLE is false and still heals the
      # other sources; the last recovery step keeps the run red.
      - name: Probe dados.cvm.gov.br
        id: cvm_probe
        if: ${{ steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true' }}
        run: |
          if python scripts/check_cvm_reachable.py; then
            echo "cvm_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "cvm_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=CVM unreachable::the CVM scope is skipped; the other sources still run and the last step fails the job"
          fi

      # Bootstrap schema/migrations before the recovery run. The watchdog
      # previously ran run_daily directly, so a recovery against a DB missing a
      # migration (e.g. cvm_fund_registry without migration 11's admin/gestor
      # columns) failed silently — the exact drift this guards against.
      - name: Apply schema + migrations
        id: schema
        if: ${{ steps.staleness.outputs.stale == 'true' || steps.staleness.outputs.heal_fnet == 'true' || github.event.inputs.force == 'true' }}
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

      - name: Run daily ingest (recovery)
        if: ${{ !cancelled() && steps.schema.outcome == 'success' && (steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true') }}
        env:
          CVM_REACHABLE: ${{ steps.cvm_probe.outputs.cvm_ok }}
        run: python -m src.pipeline.run_daily

      # The market slices (DI1, B3 curves, UST, VIX, Brent) are written by their
      # own daily step, not by run_daily, so run_daily alone could never heal an
      # unhealed `market` error that tripped this watchdog. Its window re-fetches
      # the last 7 days, so this is the same idempotent re-run.
      - name: Refresh rates and market data (recovery)
        if: ${{ !cancelled() && (steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true') }}
        timeout-minutes: 30
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CBOE_VIX_LICENSED: ${{ vars.CBOE_VIX_LICENSED }}
        run: python -m src.pipeline.market_pipeline

      # Same reason for B3's corporate events and cash distributions: they left
      # run_daily for their own daily step on 2026-09-30, so without this an
      # unhealed `b3` corporate_events / cash_dividends error could never heal
      # here. Both re-fetch every traded issuer, so the re-run is idempotent.
      - name: Refresh B3 corporate events and cash dividends (recovery)
        if: ${{ !cancelled() && (steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true') }}
        timeout-minutes: 75
        env:
          B3_CREDIT_ENABLED: ${{ vars.B3_CREDIT_ENABLED }}
        run: python -m src.pipeline.run_b3_events

      # FNET is not run_daily's: an FNET error used to re-run run_daily, which
      # never touches FNET, so it could not heal (#870). Gated on its own flag.
      - name: Refresh FNET document register (recovery)
        if: ${{ !cancelled() && steps.schema.outcome == 'success' && (steps.staleness.outputs.heal_fnet == 'true' || github.event.inputs.force == 'true') }}
        timeout-minutes: 60
        run: python -m src.pipeline.fnet_pipeline

      # The ETF market snapshot left run_daily for its own daily job (#868), so
      # run_daily alone could no longer heal an unhealed `etf_market` error.
      # Same gate as the run_daily recovery above; the scrape is idempotent.
      # Unset, APIFY_TOKEN makes it a logged no-op, as in daily_ingest.yml.
      - name: Refresh ETF market snapshot (recovery)
        if: ${{ !cancelled() && steps.schema.outcome == 'success' && (steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true') }}
        timeout-minutes: 60
        env:
          APIFY_TOKEN: "${{ secrets.APIFY_TOKEN }}"
        run: python -m src.pipeline.run_etf_market

      - name: Fail the run when CVM was unreachable
        if: ${{ !cancelled() && steps.cvm_probe.outputs.cvm_ok == 'false' }}
        run: |
          echo "::error title=CVM unreachable::dados.cvm.gov.br refused this runner; the CVM scope was skipped (one skipped row per entity in cvm_ingest_log). Re-dispatch to draw a fresh runner IP."
          exit 1

      - name: Report no-op
        if: ${{ steps.staleness.outputs.stale == 'false' && steps.staleness.outputs.heal_fnet != 'true' && steps.staleness.outputs.heal_fnet_diff != 'true' && github.event.inputs.force != 'true' }}
        run: echo "All ingest slices are fresh — watchdog took no action."

  # FNET restatement diffs: the same job as daily_ingest.yml's fnet-diff, run
  # only when the staleness check flags it. !cancelled(): a red watchdog job
  # (CVM unreachable) must not hold it back.
  fnet-diff:
    name: FNET restatement diffs (recovery)
    needs: watchdog
    if: ${{ !cancelled() && (needs.watchdog.outputs.heal_fnet_diff == 'true' || github.event.inputs.force == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      TZ: "America/Sao_Paulo"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diff restated FIDC informes
        run: python -m src.pipeline.fnet_diff
