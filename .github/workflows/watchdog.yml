name: Ingest Watchdog

# Self-healing safety net for the daily ingest. Runs a couple of hours after the
# 06:00 UTC cron in daily_ingest.yml; if the daily FI slice (or the monthly
# ANBIMA/ETF slice) is stale in cvm_ingest_log, OR if unhealed ingest errors
# remain in the 26h health-gate daily window, it re-runs the daily ingest.
# Historical backfill errors outside DAILY_LOOKBACK_MONTHS do not count —
# run_daily cannot heal 2010 (DB Health #14). Unhealed daily-window errors are
# not weekend-gated: a Saturday CVMHostUnreachable burst is a failed cron, not
# a quiet market day. Recovery probes CVM first so a blocked runner IP fails
# in a second instead of writing another round of error rows.
#
# This lives entirely in GitHub Actions and reuses the existing POSTGRES_URL
# secret — no GitHub PAT in the database, no pg_net. See scripts/check_staleness.py.

on:
  schedule:
    # 08:00 UTC — after the 06:00 daily run's ~90-minute window.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force the recovery run regardless of staleness"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# The recovery path runs run_daily directly, which makes this a third writer
# against the shared Postgres — it joins the same group as daily_ingest.yml
# and backfill.yml so it queues behind them instead of writing on top of them.
concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  watchdog:
    name: Check staleness and self-heal
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      # Optional: enables the etfsbrasil ETF scrape in run_daily, as in
      # daily_ingest.yml. Unset, it is empty and the scrape self-skips (#689).
      APIFY_TOKEN: "${{ secrets.APIFY_TOKEN }}"
      CVM_DNS_NAMESERVERS: "1.1.1.1,8.8.8.8,9.9.9.9"
      # Optional repository variable: re-points the BACEN SGS host (issue #537). Empty means the default.
      BACEN_SGS_BASE_URL: "${{ vars.BACEN_SGS_BASE_URL }}"
      CVM_DAILY_SCOPE: "all"
      CVM_UPSERT_CHUNK_SIZE: "5000"
      CVM_INGEST_CONCURRENCY: "6"
      CVM_FI_CONCURRENCY: "3"
      CVM_DAILY_CONCURRENCY: "8"
      TZ: "America/Sao_Paulo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check ingest staleness
        id: staleness
        run: |
          set +e
          PYTHONPATH=. python scripts/check_staleness.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "10" ] || [ "$code" = "11" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            # Unexpected failure (e.g. DB unreachable) — surface it, don't mask.
            echo "stale=error" >> "$GITHUB_OUTPUT"
            exit $code
          fi

      # Recovery path: ask CVM first (a blocked IP must not write another
      # round of unhealed error rows), then schema, then run_daily. Gated on
      # the same condition as recovery so a no-op day stays a true no-op.
      - name: Probe dados.cvm.gov.br
        if: ${{ steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true' }}
        run: python scripts/check_cvm_reachable.py

      # Bootstrap schema/migrations before the recovery run. The watchdog
      # previously ran run_daily directly, so a recovery against a DB missing a
      # migration (e.g. cvm_fund_registry without migration 11's admin/gestor
      # columns) failed silently — the exact drift this guards against.
      - name: Apply schema + migrations
        if: ${{ steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true' }}
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

      - name: Run daily ingest (recovery)
        if: ${{ steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true' }}
        run: python -m src.pipeline.run_daily

      # The market slices (DI1, B3 curves, UST, VIX, Brent) are written by their
      # own daily step, not by run_daily, so run_daily alone could never heal an
      # unhealed `market` error that tripped this watchdog. Its window re-fetches
      # the last 7 days, so this is the same idempotent re-run.
      - name: Refresh rates and market data (recovery)
        if: ${{ !cancelled() && (steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true') }}
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          CBOE_VIX_LICENSED: ${{ vars.CBOE_VIX_LICENSED }}
        run: python -m src.pipeline.market_pipeline

      # Same reason for B3's corporate events and cash distributions: they left
      # run_daily for their own daily step on 2026-09-30, so without this an
      # unhealed `b3` corporate_events / cash_dividends error could never heal
      # here. Both re-fetch every traded issuer, so the re-run is idempotent.
      - name: Refresh B3 corporate events and cash dividends (recovery)
        if: ${{ !cancelled() && (steps.staleness.outputs.stale == 'true' || github.event.inputs.force == 'true') }}
        timeout-minutes: 75
        run: python -m src.pipeline.run_b3_events

      - name: Report no-op
        if: ${{ steps.staleness.outputs.stale == 'false' && github.event.inputs.force != 'true' }}
        run: echo "All ingest slices are fresh — watchdog took no action."
