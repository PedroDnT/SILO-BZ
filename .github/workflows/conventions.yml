# Copy this file to .github/workflows/conventions.yml in each repo.
# It calls the shared workflows in PedroDnT/agent-triage-conventions at tag v1.
name: Agent conventions

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  triage:
    if: github.event_name == 'issues'
    permissions:
      issues: write
    uses: PedroDnT/agent-triage-conventions/.github/workflows/triage.yml@v1

  agent:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: PedroDnT/agent-triage-conventions/.github/workflows/agent.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
