# Copy this file to .github/workflows/conventions.yml in each repo.
# It calls the shared workflows in PedroDnT/agent-triage-conventions at tag v1.
name: Agent conventions

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  triage:
    if: github.event_name == 'issues'
    permissions:
      issues: write
    uses: PedroDnT/agent-triage-conventions/.github/workflows/triage.yml@v1

  agent:
    # Only the owner, org members or collaborators start the agent. claude-code-action
    # checks write access too; this stops a stranger's comment from starting a job at all.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: PedroDnT/agent-triage-conventions/.github/workflows/agent.yml@v1
    with:
      # Set the repo variable CLAUDE_AGENT_DEBUG to true to see the full output of a failed run.
      debug: ${{ vars.CLAUDE_AGENT_DEBUG == 'true' }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
