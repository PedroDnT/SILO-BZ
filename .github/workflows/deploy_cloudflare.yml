name: Deploy Cloudflare demo

# The portfolio-diagnosis demo on Cloudflare (map #510, slice E step 2):
# deploys deploy/cloudflare/ (a Worker serving the upload page and POST
# /diagnose, and the engine Container built from deploy/cloudflare/engine/),
# then proves it end to end from the public *.workers.dev address with the
# synthetic statement template (docs/reference/portfolio/statement-template.xlsx,
# fictitious holder; never a real statement). Manual on purpose, like
# deploy_mcp.yml: a merge deploys nothing.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN (account-owned, "Edit
# Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID, DEMO_ACCESS_TOKEN and
# OPENAI_API_KEY, and the account on Workers Paid. The last two are copied into
# the Worker as secrets. Prints status codes, sizes, timings and the engine's
# cost header only: never a secret, never the PDF.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-health
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify the demo Worker and engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEMO_ACCESS_TOKEN: ${{ secrets.DEMO_ACCESS_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Refuse without the secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$DEMO_ACCESS_TOKEN" ] || missing="$missing DEMO_ACCESS_TOKEN"
          [ -n "$OPENAI_API_KEY" ] || missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Set the repository secret(s):$missing (issue #519)."
            exit 1
          fi

      # Wrangler builds the Container image with the local Docker CLI.
      - name: Docker on the runner
        run: docker version --format 'client {{.Client.Version}}, server {{.Server.Version}}'

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the pinned wrangler
        working-directory: deploy/cloudflare
        run: npm ci --no-audit --no-fund

      # The LLM key lives in this step's env only, so the smoke step never holds it.
      # Immediate rollout: no request may reach an instance of the previous image.
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/cloudflare
          command: deploy --containers-rollout=immediate
          secrets: |
            DEMO_ACCESS_TOKEN
            OPENAI_API_KEY

      - name: Image size
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -i healthcontainer || true

      # Status codes, sizes and timings only. A paid report is retried only while
      # the Worker itself says the Container is not up yet (503 from the Worker),
      # never after the engine answered, so each report is paid for once.
      - name: Verify the live Worker and engine end to end
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          if [ -z "$base" ]; then
            echo "::error::wrangler reported no deployment URL (is a workers.dev subdomain registered on the account?)"
            exit 1
          fi
          echo "Worker address: $base"
          tmp="$RUNNER_TEMP/smoke"
          mkdir -p "$tmp"
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$@" || true; }
          f=docs/reference/portfolio/statement-template.xlsx

          ok=""
          for attempt in $(seq 1 12); do
            c=$(code "$base/health")
            echo "GET /health (attempt $attempt): $c"
            if [ "$c" = 200 ]; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ] || { echo "::error::/health never answered 200"; exit 1; }

          c=$(curl -s -o "$tmp/page" -w '%{http_code} %{content_type}' --max-time 60 "$base/" || true)
          echo "GET / (upload page): $c, $(wc -c < "$tmp/page") bytes"
          case "$c" in "200 text/html"*) ;; *) echo "::error::expected the upload page"; exit 1 ;; esac

          c=$(code -X POST --data-binary "@$f" "$base/diagnose")
          echo "POST /diagnose without the token: $c"
          [ "$c" = 401 ] || { echo "::error::expected 401 without the token"; exit 1; }

          c=$(code -X POST -H "x-demo-token: wrong" --data-binary "@$f" "$base/diagnose")
          echo "POST /diagnose with a wrong token: $c"
          [ "$c" = 401 ] || { echo "::error::expected 401 with a wrong token"; exit 1; }

          c=$(code -X POST -H "Authorization: Bearer wrong" --data-binary "@$f" "$base/diagnose")
          echo "POST /diagnose with a wrong bearer token: $c"
          [ "$c" = 401 ] || { echo "::error::expected 401 with a wrong bearer token"; exit 1; }

          c=$(code "$base/anything-else")
          echo "GET /anything-else: $c"
          [ "$c" = 404 ] || { echo "::error::expected 404 for an unknown path"; exit 1; }

          hdr() { grep -i "^$1:" "$2" | tail -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true; }

          # One report. $1 label, then curl arguments for the body.
          report() {
            label="$1"; shift
            start=$(date +%s)
            for attempt in $(seq 1 40); do
              t0=$(date +%s)
              rm -f "$tmp/h" "$tmp/out"
              c=$(curl -s -D "$tmp/h" -o "$tmp/out" -w '%{http_code}' --max-time 900 \
                    -H "x-demo-token: $DEMO_ACCESS_TOKEN" "$@" "$base/diagnose" || true)
              t1=$(date +%s)
              origin=$(hdr x-silo-origin "$tmp/h")
              echo "$label (attempt $attempt): $c from ${origin:-?} in $((t1 - t0))s, $(cat "$tmp/out" 2>/dev/null | wc -c) bytes"
              # Only the Worker's own 503 (no instance yet) is retried: the rollout
              # probe above already waited for this commit's image, and any other
              # answer may follow paid LLM work.
              if [ "$c" = 503 ] && [ "$origin" = worker ]; then sleep 20; continue; fi
              break
            done
            echo "$label: answered after $(( $(date +%s) - start ))s since the first attempt; the answering request took $((t1 - t0))s"
            echo "  engine rev=$(hdr x-silo-engine-rev "$tmp/h") stage=$(hdr x-silo-stage "$tmp/h") error=$(hdr x-silo-error "$tmp/h") error_status=$(hdr x-silo-error-status "$tmp/h") error_code=$(hdr x-silo-error-code "$tmp/h") narrative=$(hdr x-silo-narrative "$tmp/h") provider=$(hdr x-silo-provider "$tmp/h") cost_usd=$(hdr x-silo-cost-usd "$tmp/h") engine_s=$(hdr x-silo-seconds "$tmp/h")"
            [ "$c" = 200 ] || { echo "::error::$label: expected 200, got $c"; return 1; }
            case "$(hdr content-type "$tmp/h")" in application/pdf*) ;; *) echo "::error::$label: not application/pdf"; return 1 ;; esac
            [ "$(head -c 5 "$tmp/out" 2>/dev/null)" = "%PDF-" ] || { echo "::error::$label: the body does not start with %PDF-"; return 1; }
            [ "$(hdr x-silo-provider "$tmp/h")" = openai ] || { echo "::error::$label: the report did not run on openai"; return 1; }
            [ "$(hdr x-silo-narrative "$tmp/h")" = complete ] || { echo "::error::$label: the narrative is not complete (LLM egress, key or cost cap)"; return 1; }
            rm -f "$tmp/out"
          }

          # Wait for the rollout: a deploy does not wait for instances to change
          # image. Each probe is a cheap 415 (no engine or LLM work) on a fresh
          # instance; the engine stamps every answer with a content hash of
          # src/portfolio (engine_rev in src/portfolio/server.py, repeated here).
          want=$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          base = Path("src/portfolio")
          h = hashlib.sha256()
          for f in sorted(p for p in base.rglob("*") if p.is_file()):
              rel = f.relative_to(base).as_posix()
              if "__pycache__" in rel.split("/") or rel.endswith(".pyc"):
                  continue
              h.update(rel.encode() + b"\0" + f.read_bytes() + b"\0")
          print(h.hexdigest()[:12])
          PY
          )
          echo "engine revision of this commit: $want"
          ok=""
          for attempt in $(seq 1 30); do
            t0=$(date +%s)
            c=$(curl -s -D "$tmp/h" -o /dev/null -w '%{http_code}' --max-time 300 \
                  -H "x-demo-token: $DEMO_ACCESS_TOKEN" --data-binary "not a statement" "$base/diagnose" || true)
            got=$(hdr x-silo-engine-rev "$tmp/h")
            echo "rollout probe (attempt $attempt): $c, engine revision ${got:-none}, $(( $(date +%s) - t0 ))s (new instance, cold start)"
            if [ "$c" = 415 ] && [ "$got" = "$want" ]; then ok=1; break; fi
            sleep 30
          done
          [ -n "$ok" ] || { echo "::error::no instance answered with this commit's engine revision"; exit 1; }

          report "POST /diagnose, first report (raw body)" -X POST --data-binary "@$f"

          # Privacy probe: the same synthetic statement with a marker in the holder
          # name and the upload filename, sent while wrangler tail listens. Only
          # the number of tail lines that carry the marker is printed.
          marker="SILO-PRIVACY-PROBE-$(openssl rand -hex 6)"
          python3 -m venv "$tmp/venv" && "$tmp/venv/bin/pip" install --quiet openpyxl
          "$tmp/venv/bin/python" - "$f" "$tmp/$marker.xlsx" "$marker" <<'PY'
          import sys
          from openpyxl import load_workbook
          src, dst, marker = sys.argv[1:]
          wb = load_workbook(src)
          for row in wb.worksheets[0].iter_rows():
              if row[0].value == "titular":
                  row[1].value = f"MARIA {marker}"
          wb.save(dst)
          PY
          (cd deploy/cloudflare && timeout 900 npx wrangler tail silo-demo-health --format json > "$tmp/tail.json" 2> "$tmp/tail.err") &
          tail_pid=$!
          sleep 15

          # Second request: a new Durable Object and a new instance (one per upload),
          # with the image already on Cloudflare.
          report "POST /diagnose, second (multipart, marked)" -X POST -F "file=@$tmp/$marker.xlsx"

          sleep 15
          pkill -f "wrangler tail" 2>/dev/null || true
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          lines=$(cat "$tmp/tail.json" 2>/dev/null | wc -l)
          echo "wrangler tail: $lines lines captured, $(grep -c "$marker" "$tmp/tail.json" 2>/dev/null || true) carry the marker"
          if grep -q "$marker" "$tmp/tail.json" 2>/dev/null; then echo "::error::the privacy marker reached the Worker's tail"; exit 1; fi
          # Zero lines or a tail error means tail never listened: not a pass.
          if [ "$lines" -eq 0 ] || grep -qiE "error|denied|forbidden|unauthori" "$tmp/tail.err" 2>/dev/null; then
            echo "::warning::privacy probe inconclusive: wrangler tail captured nothing or reported an error (first line: $(grep -m1 -iE 'error|denied|forbidden|unauthori' "$tmp/tail.err" 2>/dev/null | cut -c1-160))"
          fi
          rm -rf "$tmp"
