name: Lamina header probe

# THROWAWAY research branch (research/lamina-coverage, issue #514), never merged.
# On this branch the file runs .github/research/lamina_coverage.py instead of the
# header probe, because a workflow GitHub has not indexed on main cannot be
# dispatched from another ref. Read-only: public CVM files in, aggregates to the
# job log out. No secrets, no POSTGRES_URL, no deploy hook, contents: read only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lamina-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Fold every lamina to the latest per fund and print aggregates
        run: python -u .github/research/lamina_coverage.py
