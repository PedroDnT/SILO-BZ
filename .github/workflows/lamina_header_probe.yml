name: Lamina header probe

# THROWAWAY research branch (research/extrato-coverage, issue #524), never merged.
# On this branch the file runs .github/research/extrato_coverage.py instead of the
# lamina probe, because a workflow GitHub has not indexed on main cannot be
# dispatched from another ref. Read-only: public CVM files in, aggregates to the
# job log out. No secrets, no POSTGRES_URL, no deploy hook, contents: read only.
# workflow_dispatch only: no schedule, no push trigger.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extrato-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fold the Extrato to one row per fund and print aggregates
        run: python -u .github/research/extrato_coverage.py
