name: Lamina header probe

# THROWAWAY research branch (research/verify-420, issue #420), never merged.
# On this branch the file runs a read-only probe of the live public API,
# because a workflow GitHub has not indexed on main cannot be dispatched from
# another ref. The public SDK with the published anon key (its default),
# aggregates to the job log. No secrets, no POSTGRES_URL, no deploy hook,
# contents: read only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-420-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the SDK's dependencies
        run: pip install "httpx>=0.27" "pandas>=2.0" "polars>=1.0"
      - name: Probe the live API
        run: python -u .github/research/probe_420.py
