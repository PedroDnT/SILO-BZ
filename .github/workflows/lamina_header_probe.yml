name: Lamina header probe

# THROWAWAY research branch (research/indices-416, issue #416), never merged.
# On this branch the file runs .github/research/index_probe_416.py instead of the
# header probe, because a workflow GitHub has not indexed on main cannot be
# dispatched from another ref. Read-only: B3's public index statistics endpoint
# in, aggregates to the job log out. No secrets, no POSTGRES_URL, contents: read.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: index-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Probe B3 index levels
        run: python -u .github/research/index_probe_416.py
