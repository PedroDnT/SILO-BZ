name: RJ document links

# OFF since #877 (owner decision 2026-10-18): nothing reads rj_case / rj_document,
# so the schedule is removed and the watchdog no longer heals RJ. The tables and
# their rows stay; dispatch this workflow by hand to collect again.
#
# Daily collector for epic #841 / #845 / #846: reads the case pages of administrador
# judicial websites (src/fetchers/rj/sites.py) and stores the LINKS to each
# recuperação judicial case's documents in rj_case / rj_document. No file is
# downloaded. One cvm_ingest_log row per site (entity rj).
#
# 08:07 UTC-3 (11:07 UTC): after the 03:00 UTC-3 daily ingest window, in the
# same supabase-ingest group so it never writes beside another writer. Sites
# are read at most one request per second per host; robots.txt is obeyed.
# A site that fails, or that suddenly lists no case, turns the run red.

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Space-separated domains from sites.py; empty = every site"
        required: false
        default: ""
        type: string
      only:
        description: "Run one part only: sites, djen or resolve; empty = all three"
        required: false
        default: ""
        type: string
      djen_start:
        description: "DJEN: first day (YYYY-MM-DD); empty = the last RJ_DJEN_DAYS days"
        required: false
        default: ""
        type: string
      djen_end:
        description: "DJEN: last day (YYYY-MM-DD); empty = yesterday"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  collect:
    name: Collect RJ document links
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      TZ: "America/Sao_Paulo"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The same composite action as daily / watchdog / backfill, so this run
      # never writes to a database that is missing migration 75.
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

      - name: Collect
        if: ${{ !inputs.only || inputs.only == 'sites' }}
        env:
          SITES: ${{ inputs.sites }}
        run: |
          args=()
          for s in $SITES; do args+=(--site "$s"); done
          python -m src.pipeline.ingest_rj "${args[@]}"

      # DJEN (#846) answers 403 outside Brazil (#843), so it goes out from
      # Brazil: through supabase/functions/djen-relay (sa-east-1), or the
      # BR_PROXY_URL proxy as a fallback. With neither the client refuses to
      # start and this step is red: a missing egress is never an empty day. It
      # runs even when the AJ step failed.
      - name: Discover RJ cases on DJEN
        if: ${{ !cancelled() && (!inputs.only || inputs.only == 'djen') }}
        env:
          DJEN_RELAY_URL: https://zcjbtpxuhdekpwcxmepn.supabase.co/functions/v1/djen-relay
          DJEN_RELAY_TOKEN: ${{ secrets.DJEN_RELAY_TOKEN }}
          BR_PROXY_URL: ${{ secrets.BR_PROXY_URL }}
          DJEN_START: ${{ inputs.djen_start }}
          DJEN_END: ${{ inputs.djen_end }}
        run: |
          args=()
          [ -n "$DJEN_START" ] && args+=(--start "$DJEN_START")
          [ -n "$DJEN_END" ] && args+=(--end "$DJEN_END")
          python -m src.pipeline.ingest_rj_djen "${args[@]}"

      # Resolver (#846): a DJEN case whose acts name an inventoried AJ is searched
      # for on that AJ's own site; a page counts only if it prints the case number.
      - name: Resolve DJEN cases on their AJ sites
        if: ${{ !cancelled() && (!inputs.only || inputs.only == 'resolve') }}
        run: python -m src.pipeline.resolve_rj
