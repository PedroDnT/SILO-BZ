name: CVM Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (default: 2019)"
        default: "2019"
      end_year:
        description: "End year (default: current year)"
        default: "2026"
      bacen_only:
        description: "Skip CVM entities (FI/FIDC/FII/.../ETF), backfill only BACEN — fast, for re-fetching a full-history SGS/PTAX/Expectativas window"
        type: boolean
        default: false
      entity:
        description: "Which CVM entity to fill. Default fi (do not pick all while Postgres is recovering). Years in the form are now used."
        type: choice
        default: fi
        options:
          - fi
          - fidc
          - fii
          - fiagro
          - fip
          - securit
          - cia_aberta
          - etf
          - all
      fi_doc_type:
        description: "FI only: fill one document type, or all. Use balancete to repair the known balance-sheet gap without re-fetching diario/CDA/perfil; cda_acoes / cda_cotas / cda_debentures fill the holdings tables without touching the aggregate cda table."
        type: choice
        default: all
        options:
          - all
          - balancete
          - inf_diario
          - cda
          - cda_acoes
          - cda_cotas
          - cda_debentures
          - perfil_mensal
      fi_repair_gaps:
        description: "FI only: fetch ONLY the months missing from the fi_doc_type table (reads the table, not the audit log). Requires a specific fi_doc_type."
        type: boolean
        default: false
      fi_months:
        description: "FI only: fetch ONLY these competency months, comma-separated YYYY-MM (e.g. 2019-04,2023-01). Requires a specific fi_doc_type. Each year job takes the months belonging to its own year."
        type: string
        default: ""

# Shares the writer group with daily_ingest.yml so a backfill and the daily
# cron never write to the same tables at once. Jobs inside this workflow also
# run one at a time (max-parallel: 1) so a slice fill cannot 8-way lock the
# pooler. This workflow never POSTs the Vercel dashboard hook.
concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  # Apply the (idempotent) schema + migrations before any ingest so a fresh DB
  # is bootstrapped. Every ingest job gates on this via `needs:` so the CREATE
  # statements run exactly once instead of racing across the parallel matrix.
  apply-schema:
    name: "Apply schema"
    runs-on: ubuntu-latest
    # 25, not 15. The apply is one pass over schema.sql + 36 migrations with
    # every ADD COLUMN guarded to a catalog probe, and it has been getting
    # slower as the holdings tables grow: 10m41s, 12m36s, then 14m25s on
    # 2026-09-01 (run 33547870143). That last one SUCCEEDED at 14:25 and the
    # job was still cancelled — GitHub enforces timeout-minutes on the job,
    # the step finished one second before the limit, and job teardown crossed
    # it. `needs: apply-schema` then failed and every FI year job was
    # skipped, so the whole dispatch did nothing. Run 25 died the same way at
    # 15m18s. Neither was a stuck lock: apply() retries on lock_timeout and
    # neither log shows a retry. The apply is just long, and a limit inside
    # its normal range turns a slow success into a silent no-op.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Shared composite action — same schema bootstrap as daily/watchdog, so the
      # three paths can't drift. Runs once here and the ingest matrix gates on it
      # via `needs:`, so the CREATE statements don't race across parallel jobs.
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

  # Ask CVM once, in about a second, whether it is answering anyone at all.
  # Every CVM job below `needs:` this so a globally-down host fails the matrix
  # before 22 year-jobs spin up. That is not the same runner as the downloads:
  # GitHub-hosted jobs are different VMs with different IPs. Backfill #22
  # (run 33434522442) passed this probe at 20:10, FI 2024 landed 2.7M
  # cda_acoes rows, then FI 2025 and FI 2026 each spent ~7 minutes proving
  # `Connect call failed ('45.7.170.66', 443)` on new runners. Each ingest job
  # therefore also probes locally (same pattern as daily_ingest.yml) before it
  # fetches. bacen_only runs skip this job — they never touch CVM.
  cvm-preflight:
    name: "Can this runner reach CVM?"
    if: ${{ inputs.bacen_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Standard library only, so this cannot be the step that fails on a
      # dependency while trying to tell you the network is fine.
      - name: Probe dados.cvm.gov.br
        run: python scripts/check_cvm_reachable.py

  inspect-coverage:
    name: "What's already on Supabase (skip-if-complete uses this)"
    needs: apply-schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install coverage-query dependency
        run: pip install psycopg2-binary
      - name: Print ingest_log + coverage snapshot
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          python3 - <<'PY'
          import os, sys
          import psycopg2
          url = os.environ.get("POSTGRES_URL", "")
          if not url:
              print("POSTGRES_URL missing — cannot inspect coverage")
              sys.exit(0)
          conn = psycopg2.connect(url, connect_timeout=20)
          cur = conn.cursor()
          cur.execute("""
            UPDATE cvm_ingest_log
            SET status = 'error',
                finished_at = COALESCE(finished_at, NOW()),
                error_msg = CONCAT_WS(
                  '; ',
                  NULLIF(error_msg, ''),
                  'Marked stale by backfill coverage inspection after 24 hours'
                )
            WHERE status = 'running'
              AND started_at < NOW() - INTERVAL '24 hours'
            RETURNING run_id
          """)
          stale = cur.fetchall()
          conn.commit()
          print(f"Marked {len(stale)} stale running audit row(s) as error")
          print("=== cvm_ingest_log by entity / year / status ===")
          cur.execute("""
            SELECT entity, COALESCE(doc_type, ''), period_year,
                   status, COUNT(*), COALESCE(SUM(rows_upserted), 0)
            FROM cvm_ingest_log
            GROUP BY 1, 2, 3, 4
            ORDER BY 1, 2, 3, 4
          """)
          print("entity\tdoc_type\tyear\tstatus\tn_runs\trows")
          for row in cur.fetchall():
              print("\t".join(str(x) for x in row))
          print("=== data_coverage last 90 days (api) ===")
          try:
              cur.execute("SELECT * FROM data_coverage(NULL, CURRENT_DATE - 90, CURRENT_DATE)")
              cols = [d[0] for d in cur.description]
              print("\t".join(cols))
              for row in cur.fetchall():
                  print("\t".join(str(x) for x in row))
          except Exception as e:
              print("data_coverage unavailable:", e)
              conn.rollback()
          conn.close()
          PY

  # FI — one job per year, serialized, and skipped when that year is already complete.
  backfill-fi:
    name: "FI ${{ matrix.year }}"
    needs: [apply-schema, inspect-coverage, cvm-preflight]
    if: ${{ inputs.bacen_only != true && (inputs.entity == 'all' || inputs.entity == 'fi') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # 2005 is where the CDA yearly archives start. A year not listed here
        # cannot be dispatched at all; one outside the requested range exits 0
        # in seconds, so the unused entries cost a skipped job, not a fetch.
        year:
          [
            2005,
            2006,
            2007,
            2008,
            2009,
            2010,
            2011,
            2012,
            2013,
            2014,
            2015,
            2016,
            2017,
            2018,
            2019,
            2020,
            2021,
            2022,
            2023,
            2024,
            2025,
            2026,
          ]
    steps:
      - uses: actions/checkout@v5

      - name: Skip years outside start_year..end_year
        if: ${{ matrix.year < fromJSON(inputs.start_year) || matrix.year > fromJSON(inputs.end_year) }}
        run: |
          echo "Skipping FI ${{ matrix.year }} (requested ${{ inputs.start_year }}..${{ inputs.end_year }})"
          exit 0

      - uses: actions/setup-python@v6
        if: ${{ matrix.year >= fromJSON(inputs.start_year) && matrix.year <= fromJSON(inputs.end_year) }}
        with:
          python-version: "3.12"
          cache: pip

      # Same runner as the fetch below. The workflow-level cvm-preflight job
      # cannot see this VM's IP; without this step a blocked year grinds the
      # connect-retry loop (~7 min) and writes CVMHostUnreachable audit rows.
      - name: Probe dados.cvm.gov.br
        if: ${{ matrix.year >= fromJSON(inputs.start_year) && matrix.year <= fromJSON(inputs.end_year) }}
        run: python scripts/check_cvm_reachable.py

      - name: Install dependencies
        if: ${{ matrix.year >= fromJSON(inputs.start_year) && matrix.year <= fromJSON(inputs.end_year) }}
        run: pip install -r requirements.txt

      - name: Skip if year already complete
        id: check
        if: ${{ matrix.year >= fromJSON(inputs.start_year) && matrix.year <= fromJSON(inputs.end_year) }}
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          python - <<'EOF'
          import os, sys, traceback
          try:
              import psycopg2
          except ImportError:
              print("psycopg2 missing; running the year")
              sys.exit(0)

          def ok_months(cur, doc_type, year):
              cur.execute("""
                  SELECT COUNT(DISTINCT period_month)
                  FROM cvm_ingest_log
                  WHERE entity='fi' AND doc_type=%s
                    AND period_year=%s AND status='ok'
              """, (doc_type, year))
              return cur.fetchone()[0]

          url = os.environ.get("POSTGRES_URL", "").replace("\n", "").replace(" ", "")
          year = int("${{ matrix.year }}")
          if not url:
              print("POSTGRES_URL missing; running the year")
              sys.exit(0)

          try:
              conn = psycopg2.connect(url, connect_timeout=20)
              with conn.cursor() as cur:
                  # Gate skip on BOTH inf_diario AND perfil_mensal so a complete
                  # diario cannot skip the run that fills cvm_fi_perfil.
                  diario_months = ok_months(cur, "inf_diario", year)
                  perfil_months = ok_months(cur, "perfil_mensal", year)
                  balancete_months = ok_months(cur, "balancete", year)
                  cda_months = ok_months(cur, "cda", year)
                  cda_acoes_months = ok_months(cur, "cda_acoes", year)
                  cda_cotas_months = ok_months(cur, "cda_cotas", year)
                  cda_deb_months = ok_months(cur, "cda_debentures", year)
                  diario_rows = None
                  if year in (2019, 2020):
                      cur.execute(f"SELECT COUNT(*) FROM cvm_fi_diario_{year}")
                      diario_rows = cur.fetchone()[0]
              conn.close()
          except Exception:
              traceback.print_exc()
              print("Coverage query failed; running the year (fail-open)")
              sys.exit(0)

          skip = False
          requested_doc = "${{ inputs.fi_doc_type }}"
          # A repair run must never be gated on cvm_ingest_log: counting 'ok'
          # audit months is precisely the signal that was wrong. fi/balancete
          # 2026-06 carries a fresh 'error' row over 2,178,163 real rows, and
          # 32 other months carry no 'ok' row at all. --repair-gaps / --months
          # decide what to fetch by reading the table itself.
          # No pre-2023 exclusion for the holdings blocks: they come from blocks
          # 4 and 2 of the same yearly HIST archive as `cda`, so every year from
          # 2005 has a source. A month repair still cannot reach those years —
          # gaps.FI_MONTHLY_TABLES carries that cutoff and says so.
          if "${{ inputs.fi_repair_gaps }}" == "true" or "${{ inputs.fi_months }}".strip():
              print(f"RUN: {year} (repair mode — coverage is decided from the table, not the audit log)")
          elif requested_doc != "all":
              counts = {
                  "inf_diario": diario_months,
                  "perfil_mensal": perfil_months,
                  "balancete": balancete_months,
                  "cda": cda_months,
                  "cda_acoes": cda_acoes_months,
                  "cda_cotas": cda_cotas_months,
                  "cda_debentures": cda_deb_months,
              }
              # .get, not []: this runs outside the try/except above, so a doc
              # type the gate has not learned yet would abort the dispatch
              # instead of doing the work. Unknown means run the year.
              months = counts.get(requested_doc)
              if months is None:
                  print(f"RUN: {year} {requested_doc} (no coverage rule — not skipping)")
              elif months >= 11:
                  print(f"SKIP: {year} {requested_doc} complete ({months} ok months)")
                  skip = True
              else:
                  print(f"RUN: {year} {requested_doc} incomplete ({months} ok months)")
          elif year in (2019, 2020):
              diario_done = (diario_rows or 0) > 2_000_000
              perfil_done = perfil_months >= 11
              if diario_done and perfil_done:
                  print(f"SKIP: {year} hist complete ({diario_rows} diario rows, {perfil_months} perfil months)")
                  skip = True
              else:
                  print(f"RUN: {year} hist incomplete (diario rows={diario_rows}, perfil months={perfil_months})")
          else:
              if diario_months >= 11 and perfil_months >= 11:
                  print(f"SKIP: {year} complete ({diario_months} diario months, {perfil_months} perfil months)")
                  skip = True
              else:
                  print(f"RUN: {year} incomplete (diario months={diario_months}, perfil months={perfil_months})")
          if skip:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("skip=true\n")
          EOF

      - name: Run FI backfill for ${{ matrix.year }}
        if: ${{ matrix.year >= fromJSON(inputs.start_year) && matrix.year <= fromJSON(inputs.end_year) && steps.check.outputs.skip != 'true' }}
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
          CVM_UPSERT_CHUNK_SIZE: "5000"
          CVM_INGEST_CONCURRENCY: "6"
          CVM_FI_CONCURRENCY: "3"
          # Parallel jobs don't each refresh the ETF matviews; the refresh-etf
          # job below does it once after the whole matrix completes.
          CVM_SKIP_ETF_REFRESH: "1"
        run: |
          args=(
            --entity fi
            --start-year ${{ matrix.year }}
            --end-year ${{ matrix.year }}
            --cvm-only
          )
          if [[ "${{ inputs.fi_doc_type }}" != "all" ]]; then
            args+=(--doc-type "${{ inputs.fi_doc_type }}")
          fi
          if [[ "${{ inputs.fi_repair_gaps }}" == "true" ]]; then
            args+=(--repair-gaps)
          fi
          if [[ -n "${{ inputs.fi_months }}" ]]; then
            # This job owns one matrix year, so hand it only the requested
            # months that fall inside that year. A year with none exits 0
            # rather than running an unscoped backfill.
            # tr -d ' ' (not '[:space:]') — the latter would eat the newlines
            # the split just created. grep exits 1 on no match, which would
            # abort the step under bash -e, so tolerate it and let the -z
            # check below decide.
            months=$(printf '%s' "${{ inputs.fi_months }}" | tr ',' '\n' \
              | tr -d ' \t' | grep "^${{ matrix.year }}-" | paste -sd, - || true)
            if [[ -z "$months" ]]; then
              echo "No requested months fall in ${{ matrix.year }} — nothing to do."
              exit 0
            fi
            echo "Repairing ${{ matrix.year }}: $months"
            args+=(--months "$months")
          fi
          python -m src.pipeline.run_backfill "${args[@]}"

  # Other entities — one selected entity at a time by default.
  backfill-other:
    name: "${{ matrix.entity }} ${{ inputs.start_year }}-${{ inputs.end_year }}"
    needs: [apply-schema, inspect-coverage, cvm-preflight]
    if: ${{ inputs.bacen_only != true && (inputs.entity == 'all' || contains(fromJSON('["fidc","fii","fiagro","fip","securit","cia_aberta"]'), inputs.entity)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entity: [fidc, fii, fiagro, fip, securit, cia_aberta]
    steps:
      - uses: actions/checkout@v5
        if: ${{ inputs.entity == 'all' || inputs.entity == matrix.entity }}

      - uses: actions/setup-python@v6
        if: ${{ inputs.entity == 'all' || inputs.entity == matrix.entity }}
        with:
          python-version: "3.12"
          cache: pip

      - name: Probe dados.cvm.gov.br
        if: ${{ inputs.entity == 'all' || inputs.entity == matrix.entity }}
        run: python scripts/check_cvm_reachable.py

      - name: Install dependencies
        if: ${{ inputs.entity == 'all' || inputs.entity == matrix.entity }}
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.entity }} backfill
        if: ${{ inputs.entity == 'all' || inputs.entity == matrix.entity }}
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
          CVM_UPSERT_CHUNK_SIZE: "5000"
          CVM_INGEST_CONCURRENCY: "6"
          CVM_FI_CONCURRENCY: "3"
          CVM_SKIP_ETF_REFRESH: "1"
        run: |
          python -m src.pipeline.run_backfill \
            --entity ${{ matrix.entity }} \
            --start-year ${{ inputs.start_year }} \
            --end-year ${{ inputs.end_year }} \
            --cvm-only

  # ETF registry — distinct entity (curated ticker->CNPJ seed enriched from
  # cad_fi). Not year-ranged: it's a single current-universe snapshot, so it runs
  # once in its own job rather than riding along with the FI year-matrix.
  backfill-etf:
    name: "ETF registry"
    needs: [apply-schema, inspect-coverage, cvm-preflight]
    if: ${{ inputs.bacen_only != true && (inputs.entity == 'all' || inputs.entity == 'etf') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Probe dados.cvm.gov.br
        run: python scripts/check_cvm_reachable.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETF registry backfill
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
          CVM_UPSERT_CHUNK_SIZE: "5000"
          CVM_INGEST_CONCURRENCY: "6"
          CVM_SKIP_ETF_REFRESH: "1"
        run: |
          python -m src.pipeline.run_backfill \
            --entity etf \
            --cvm-only

  # Refresh the materialized ETF metrics once, after all ingest jobs complete.
  # etf_daily / etf_latest are matviews over cvm_etf_registry + cvm_fi_diario, so
  # they must be rebuilt after both the FI matrix and the ETF registry have
  # landed. The ingest jobs set CVM_SKIP_ETF_REFRESH so only this job refreshes.
  # `always()` so a failed *slice* still surfaces whatever landed. apply-schema
  # must have succeeded: Backfill #18 ran this job after a failed schema apply
  # (ingest jobs skipped) and failed a second time because etf_daily was gone.
  refresh-etf:
    name: "Refresh ETF metrics"
    needs: [apply-schema, backfill-fi, backfill-other, backfill-etf]
    if: ${{ always() && !cancelled() && needs.apply-schema.result == 'success' && inputs.bacen_only != true && (inputs.entity == 'all' || inputs.entity == 'fi' || inputs.entity == 'etf') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify etf_daily + etf_latest views exist
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          set -euo pipefail
          # etf_daily and etf_latest are plain views (not materialized) — they
          # auto-reflect the latest data and require no REFRESH. This step just
          # asserts they exist after backfill completes.
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT 'etf_daily'::regclass, 'etf_latest'::regclass;"

  # BACEN macro data
  backfill-bacen:
    name: "BACEN"
    needs: apply-schema
    if: ${{ inputs.bacen_only == true || inputs.entity == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BACEN backfill
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
        run: |
          python -m src.pipeline.run_backfill \
            --bacen-only \
            --bacen-start 2019-01-01

  # Build the analytical layer (dims, fact matviews, rankings, fraud screens)
  # once the full backfill has populated the base tables — several analytical
  # files smoke-check for data and RAISE on an empty DB, so this must run AFTER
  # ingest. continue-on-error so a single analytical hiccup doesn't mark an
  # otherwise-successful multi-hour backfill as failed; the step output stays
  # visible. Run regardless of individual slice failures (if: always()) so a
  # partial-but-useful dataset still gets its analytics.
  apply-analytical:
    name: "Apply analytical layer"
    needs: [backfill-fi, backfill-other, backfill-etf, backfill-bacen]
    if: ${{ always() && (inputs.bacen_only == true || inputs.entity == 'all') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build analytical layer
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: bash scripts/apply_analytical.sh
