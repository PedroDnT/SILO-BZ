name: CVM Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year (default: 2019)"
        default: "2019"
      end_year:
        description: "End year (default: current year)"
        default: "2026"
      bacen_only:
        description: "Skip CVM entities (FI/FIDC/FII/.../ETF), backfill only BACEN — fast, for re-fetching a full-history SGS/PTAX/Expectativas window"
        type: boolean
        default: false

jobs:
  # Apply the (idempotent) schema + migrations before any ingest so a fresh DB
  # is bootstrapped. Every ingest job gates on this via `needs:` so the CREATE
  # statements run exactly once instead of racing across the parallel matrix.
  apply-schema:
    name: "Apply schema"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Shared composite action — same schema bootstrap as daily/watchdog, so the
      # three paths can't drift. Runs once here and the ingest matrix gates on it
      # via `needs:`, so the CREATE statements don't race across parallel jobs.
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

  # FI is the largest entity — one job per year so they run in parallel
  backfill-fi:
    name: "FI ${{ matrix.year }}"
    needs: apply-schema
    if: ${{ inputs.bacen_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        year: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if year already complete
        id: check
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          python - <<'EOF'
          import os, sys, psycopg2

          def ok_months(cur, doc_type, year):
              cur.execute("""
                  SELECT COUNT(DISTINCT period_month)
                  FROM cvm_ingest_log
                  WHERE entity='fi' AND doc_type=%s
                    AND period_year=%s AND status='ok'
              """, (doc_type, year))
              return cur.fetchone()[0]

          url = "".join(os.environ["POSTGRES_URL"].split())
          year = int("${{ matrix.year }}")

          conn = psycopg2.connect(url)
          with conn.cursor() as cur:
              # The FI job runs inf_diario AND perfil_mensal (and refreshes the FI
              # registry).  Gate the skip on BOTH so that a year is only skipped when
              # diario AND perfil are complete — otherwise an up-to-date diario would
              # wrongly skip the run that populates cvm_fi_perfil / cvm_fund_registry.
              diario_months = ok_months(cur, "inf_diario", year)
              perfil_months = ok_months(cur, "perfil_mensal", year)
              if year in (2019, 2020):
                  # Hist ZIPs: diario is a single yearly file, so check partition rows.
                  cur.execute(f"SELECT COUNT(*) FROM cvm_fi_diario_{year}")
                  diario_rows = cur.fetchone()[0]
              else:
                  diario_rows = None
          conn.close()

          if year in (2019, 2020):
              # ~250k rows/month × 12 months = ~3M expected; treat diario as complete
              # at > 2M rows.  Still require perfil months before skipping.
              diario_done = diario_rows > 2_000_000
              perfil_done = perfil_months >= 11
              if diario_done and perfil_done:
                  print(f"SKIP: {year} hist complete ({diario_rows} diario rows, {perfil_months} perfil months)")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("skip=true\n")
              else:
                  print(f"RUN: {year} hist incomplete (diario rows={diario_rows}, perfil months={perfil_months})")
          else:
              if diario_months >= 11 and perfil_months >= 11:
                  print(f"SKIP: {year} complete ({diario_months} diario months, {perfil_months} perfil months)")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("skip=true\n")
              else:
                  print(f"RUN: {year} incomplete (diario months={diario_months}, perfil months={perfil_months})")
          EOF

      - name: Run FI backfill for ${{ matrix.year }}
        if: steps.check.outputs.skip != 'true'
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
          CVM_UPSERT_CHUNK_SIZE: "5000"
          CVM_INGEST_CONCURRENCY: "6"
          CVM_FI_CONCURRENCY: "3"
          # Parallel jobs don't each refresh the ETF matviews; the refresh-etf
          # job below does it once after the whole matrix completes.
          CVM_SKIP_ETF_REFRESH: "1"
        run: |
          python -m src.pipeline.run_backfill \
            --entity fi \
            --start-year ${{ matrix.year }} \
            --end-year ${{ matrix.year }} \
            --cvm-only

  # Other entities — each runs full year range in its own job
  backfill-other:
    name: "${{ matrix.entity }} 2019-2026"
    needs: apply-schema
    if: ${{ inputs.bacen_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        entity: [fidc, fii, fiagro, fip, securit, cia_aberta]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.entity }} backfill
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
          CVM_UPSERT_CHUNK_SIZE: "5000"
          CVM_INGEST_CONCURRENCY: "6"
          CVM_FI_CONCURRENCY: "3"
          CVM_SKIP_ETF_REFRESH: "1"
        run: |
          python -m src.pipeline.run_backfill \
            --entity ${{ matrix.entity }} \
            --start-year 2019 \
            --end-year 2026 \
            --cvm-only

  # ETF registry — distinct entity (curated ticker->CNPJ seed enriched from
  # cad_fi). Not year-ranged: it's a single current-universe snapshot, so it runs
  # once in its own job rather than riding along with the FI year-matrix.
  backfill-etf:
    name: "ETF registry"
    needs: apply-schema
    if: ${{ inputs.bacen_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETF registry backfill
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
          CVM_UPSERT_CHUNK_SIZE: "5000"
          CVM_INGEST_CONCURRENCY: "6"
          CVM_SKIP_ETF_REFRESH: "1"
        run: |
          python -m src.pipeline.run_backfill \
            --entity etf \
            --cvm-only

  # Refresh the materialized ETF metrics once, after all ingest jobs complete.
  # etf_daily / etf_latest are matviews over cvm_etf_registry + cvm_fi_diario, so
  # they must be rebuilt after both the FI matrix and the ETF registry have
  # landed. The ingest jobs set CVM_SKIP_ETF_REFRESH so only this job refreshes.
  # `if: always()` so partial-but-useful data is still surfaced if a slice failed.
  refresh-etf:
    name: "Refresh ETF metrics"
    needs: [backfill-fi, backfill-other, backfill-etf]
    if: ${{ always() && inputs.bacen_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify etf_daily + etf_latest views exist
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          set -euo pipefail
          # etf_daily and etf_latest are plain views (not materialized) — they
          # auto-reflect the latest data and require no REFRESH. This step just
          # asserts they exist after backfill completes.
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT 'etf_daily'::regclass, 'etf_latest'::regclass;"

  # BACEN macro data
  backfill-bacen:
    name: "BACEN"
    needs: apply-schema
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run BACEN backfill
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
        run: |
          python -m src.pipeline.run_backfill \
            --bacen-only \
            --bacen-start 2019-01-01

  # Build the analytical layer (dims, fact matviews, rankings, fraud screens)
  # once the full backfill has populated the base tables — several analytical
  # files smoke-check for data and RAISE on an empty DB, so this must run AFTER
  # ingest. continue-on-error so a single analytical hiccup doesn't mark an
  # otherwise-successful multi-hour backfill as failed; the step output stays
  # visible. Run regardless of individual slice failures (if: always()) so a
  # partial-but-useful dataset still gets its analytics.
  apply-analytical:
    name: "Apply analytical layer"
    needs: [backfill-fi, backfill-other, backfill-etf, backfill-bacen]
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Build analytical layer
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: bash scripts/apply_analytical.sh
