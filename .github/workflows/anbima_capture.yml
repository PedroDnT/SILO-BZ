name: ANBIMA Capture

# A capture of ANBIMA's public debenture or CRI/CRA pages for a list of codes,
# or for every code ANBIMA prices that day (#1006, #1014): characteristics, event agenda and the 5-session
# indicative rates, into the private anbima_debenture* or anbima_cri_cra*
# tables. One cvm_ingest_log row (anbima/<asset>); any failed page turns the
# run red with the rows that did land. The rows are never served.
# Weekly by owner decision (2026-10-23): every priced code, all pages, both
# assets. The 5 sessions on each price page cover the week.
on:
  schedule:
    # Saturdays 09:00 UTC-3 (12:00 UTC), after the daily run.
    - cron: "0 12 * * 6"
  workflow_dispatch:
    inputs:
      asset:
        description: "debentures or cri_cra"
        type: choice
        default: debentures
        options:
          - debentures
          - cri_cra
      codes:
        description: "Comma-separated ANBIMA codes, e.g. CGOSA2,AESLA8 or CRA019001E7,22F0315398. Blank: every code with an indicative PU on ANBIMA's search list today (about 1,250 debentures or 330 CRI/CRA)."
        required: false
        default: ""
      pages:
        description: "Pages to read: caracteristicas,agenda,precos (all) or a subset, e.g. precos"
        required: false
        default: "caracteristicas,agenda,precos"

# Same writer group as daily_ingest.yml and backfill.yml: one writer at a time.
concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  # Applies migrations 80 and 82 when the daily run has not yet done so.
  apply-schema:
    name: "Apply schema"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

  capture:
    name: "Capture ${{ matrix.asset }}"
    needs: [apply-schema]
    # One asset at a time; a red debenture run still lets CRI/CRA run.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        asset: ${{ github.event_name == 'schedule' && fromJSON('["debentures","cri_cra"]') || fromJSON(format('["{0}"]', inputs.asset)) }}
    runs-on: ubuntu-latest
    # All pages of every priced code take about 1h45 (about 1.3 s a page).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Capture
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ASSET: ${{ matrix.asset }}
          CODES: ${{ inputs.codes }}
          PAGES: ${{ inputs.pages || 'caracteristicas,agenda,precos' }}
        # The CLI rejects any code that is not alphanumeric.
        run: |
          if [ -n "$CODES" ]; then which=(--codes "$CODES"); else which=(--all-priced); fi
          python -m src.pipeline.anbima_debenture_pipeline --asset "$ASSET" "${which[@]}" --pages "$PAGES"
