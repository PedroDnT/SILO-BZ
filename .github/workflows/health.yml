name: DB Health

# Read-only health and quality gate over the Supabase warehouse, plus an
# on-demand diagnostics mode.
#
# WHY IT EXISTS: the daily ingest tells you a run finished, not whether the
# warehouse is still healthy — a family can silently stop filing, an ingest can
# log errors nobody reads, and disk can fill until writes fail. This job asserts
# those out loud: a red run is the alarm. Everything here runs with
# default_transaction_read_only = on, so a health check can never mutate data.
#
# Modes (workflow_dispatch):
#   checks       — the gate (default; also what the schedule runs)
#   diagnostics  — prints one-off investigation queries from
#                  scripts/health_diagnostics/*.sql; a missing relation
#                  skips that file and the rest still run. Never fails the
#                  step on a single bad SELECT.
#   both
#
# Concurrency group is deliberately NOT the ingest group: this is read-only and
# may safely overlap an ingest run.

on:
  schedule:
    - cron: "30 7 * * *" # 07:30 UTC — after the 06:00 daily ingest settles
  workflow_dispatch:
    inputs:
      mode:
        description: "checks | diagnostics | both"
        required: false
        default: "checks"
        type: choice
        options: [checks, diagnostics, both]

concurrency:
  group: silo-health
  cancel-in-progress: false

jobs:
  health:
    name: Warehouse health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      MODE: ${{ github.event.inputs.mode || 'checks' }}
      # Thresholds. Deliberately loose: this must fire on real breakage, not on
      # CVM's normal 1-2 month publication lag.
      MAX_COMPLETE_AGE_DAYS: "75" # a monthly family with no complete period in this window is stalled
      MAX_INGEST_ERROR_HOURS: "26" # unhealed error slices in this window fail the run
      # Same bound as CVM_DAILY_LOOKBACK_MONTHS (src/pipeline/cvm_pipeline.py).
      # Unhealed errors outside this window are historical backfill; daily_update
      # will never retry them, so they must not fail warehouse health.
      DAILY_LOOKBACK_MONTHS: "4"
      DISK_WARN_PCT: "85" # warn past this share of PLAN_DISK_GB, when that is set
      # The plan allowance, which Postgres cannot see. This is the PROVISIONED
      # disk reported by the Supabase dashboard on 2026-08-29: 135 GB, of which
      # 82.5 GB was in use (database 80, WAL 2, system 0.6). An earlier
      # placeholder of 8 — the Pro plan's *included* quota, not what is
      # provisioned — printed "899%" against a 71.9 GB database and trained
      # everyone to ignore the line; a made-up denominator is worse than none,
      # so only ever set this to a real purchased total, and re-check it when
      # storage is resized.
      #
      # Note the units do not line up exactly and that is deliberate: the check
      # measures pg_database_size (the 80 GB database) against 135 GB of disk,
      # which also carries WAL and system files. Slightly understated on
      # purpose — the 85% warning then fires near 115 GB of database, leaving
      # real headroom for WAL instead of alarming at a number nobody can act on.
      PLAN_DISK_GB: "135"

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Guard — secret present
        run: |
          if [ -z "${POSTGRES_URL:-}" ]; then
            echo "POSTGRES_URL secret is missing" >&2
            exit 1
          fi

      # ---------------------------------------------------------------- checks
      # Each check prints its evidence and appends a line to $GITHUB_STEP_SUMMARY.
      # A failing check writes to $failures and the final step exits non-zero, so
      # ALL checks run even when the first one fails (one red run, full picture).
      - name: Health checks
        if: env.MODE == 'checks' || env.MODE == 'both'
        run: |
          # GitHub runs steps as `bash -e {0}`, so WITHOUT this +e the first
          # failing check aborts the step and the remaining checks never run —
          # defeating the whole point of collecting every failure into one red
          # run. Turn it off explicitly and gate on $fail at the end.
          set +e
          set -uo pipefail
          fail=0
          q() { psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -qAt \
                  -c "SET default_transaction_read_only = on" -c "$1" | tr -d '[:space:]'; }

          echo "## Warehouse health $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"

          # 1. UNHEALED ingest errors in the last MAX_INGEST_ERROR_HOURS,
          #    but only for slices daily_update is responsible for.
          #
          # Counting every error row fired on its first run: 29 rows, all
          # `fi/balancete TimeoutError` from a backfill whose slices then
          # succeeded on retry (that backfill finished 91/91 months). A slice
          # that failed and was later re-fetched is not a broken slice, and an
          # alarm that goes off after every backfill is an alarm people learn
          # to ignore.
          #
          # `skipped` is also a heal. `_log_finish` records a 404 as skipped
          # (unpublished month on the trailing daily window). Run 33164105326
          # stayed red after the ok-only fix because the one remaining error was
          # fidc/mensal_tab_x2 2026-08 TimeoutError at 2026-08-27 09:00Z — the
          # same slice 404'd as skipped on every later daily (CVM has not
          # published August yet; completeness is through 2026-07-31). A
          # timeout on a month that does not exist yet is not a broken warehouse.
          #
          # IS NOT DISTINCT FROM is required: NULL entity/period keys must match.
          # Fail only on slices whose latest attempt is still error.
          #
          # DB Health #14 (33507857471): 31 unhealed fi/cda_cotas 2010-2022
          # yearly + fi/cda_acoes 2025-12..2026-08 rows from a historical
          # backfill that hit CVMHostUnreachable. Completeness, catalog, disk,
          # and the anon API check all passed. Daily CVM Ingest #203 on the
          # same SHA was analytics-only (skipped run_daily) and could not have
          # healed those years anyway — daily_update only probes the trailing
          # CVM_DAILY_LOOKBACK_MONTHS window plus current-year yearly docs.
          # The backfill workflow already went red; duplicating that as a
          # 26h warehouse alarm (which watchdog then "heals" by re-running
          # daily, which never touches 2010) is the false positive. Restrict
          # the fail set to slices daily would retry: undated (registry,
          # b3/corporate_events), current-year yearly, and monthly periods
          # inside DAILY_LOOKBACK_MONTHS. Deep history stays a backfill
          # problem; check 3 (completeness) already alarms if a family stalls.
          attempts=$(q "SELECT count(*) FROM cvm_ingest_log
                         WHERE status = 'error'
                           AND started_at > now() - interval '${MAX_INGEST_ERROR_HOURS} hours'")
          errs=$(q "SELECT count(*) FROM (
                      SELECT DISTINCT entity, doc_type, period_year, period_month
                        FROM cvm_ingest_log e
                       WHERE e.status = 'error'
                         AND e.started_at > now() - interval '${MAX_INGEST_ERROR_HOURS} hours'
                         AND NOT EXISTS (
                               SELECT 1 FROM cvm_ingest_log s
                                WHERE s.status IN ('ok', 'skipped')
                                  AND s.entity       IS NOT DISTINCT FROM e.entity
                                  AND s.doc_type     IS NOT DISTINCT FROM e.doc_type
                                  AND s.period_year  IS NOT DISTINCT FROM e.period_year
                                  AND s.period_month IS NOT DISTINCT FROM e.period_month
                                  AND s.started_at   > e.started_at)
                         AND (
                               e.period_year IS NULL
                            OR (e.period_month IS NULL
                                AND e.period_year = EXTRACT(YEAR FROM CURRENT_DATE)::int)
                            OR (e.period_month IS NOT NULL
                                AND make_date(e.period_year, e.period_month, 1)
                                    >= (date_trunc('month', CURRENT_DATE)
                                        - (${DAILY_LOOKBACK_MONTHS}::int - 1)
                                          * INTERVAL '1 month')::date)
                         )
                    ) unhealed")
          echo "unhealed ingest errors (${MAX_INGEST_ERROR_HOURS}h, daily window): $errs (of ${attempts:-0} error rows)"
          # A non-numeric $errs (psql error text after tr -d space) must not
          # fall through to the success branch. Zeroing it and continuing used
          # to print both ❌ query failed and ✅ recovered on the same run.
          if ! [ "${errs:-}" -ge 0 ] 2>/dev/null; then
            echo "FAIL: ingest-error query did not return a count ('$errs')" >&2
            echo "- ❌ ingest-error query failed" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          elif [ "${errs:-0}" -gt 0 ]; then
            echo "FAIL: $errs UNHEALED ingest error slices in the daily window (${attempts:-0} error rows in ${MAX_INGEST_ERROR_HOURS}h)" >&2
            psql "$POSTGRES_URL" -c "SET default_transaction_read_only = on" -c \
              "SELECT e.started_at, e.entity, e.doc_type, e.period_year, e.period_month,
                      left(coalesce(e.error_msg,''),200) AS error
                 FROM cvm_ingest_log e
                WHERE e.status='error'
                  AND e.started_at > now() - interval '${MAX_INGEST_ERROR_HOURS} hours'
                  AND NOT EXISTS (
                        SELECT 1 FROM cvm_ingest_log s
                         WHERE s.status IN ('ok', 'skipped')
                           AND s.entity       IS NOT DISTINCT FROM e.entity
                           AND s.doc_type     IS NOT DISTINCT FROM e.doc_type
                           AND s.period_year  IS NOT DISTINCT FROM e.period_year
                           AND s.period_month IS NOT DISTINCT FROM e.period_month
                           AND s.started_at   > e.started_at)
                  AND (
                        e.period_year IS NULL
                     OR (e.period_month IS NULL
                         AND e.period_year = EXTRACT(YEAR FROM CURRENT_DATE)::int)
                     OR (e.period_month IS NOT NULL
                         AND make_date(e.period_year, e.period_month, 1)
                             >= (date_trunc('month', CURRENT_DATE)
                                 - (${DAILY_LOOKBACK_MONTHS}::int - 1)
                                   * INTERVAL '1 month')::date)
                  )
                ORDER BY e.started_at DESC LIMIT 20"
            echo "- ❌ unhealed ingest errors: $errs (daily window)" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            echo "- ✅ no unhealed ingest errors in ${MAX_INGEST_ERROR_HOURS}h daily window (${attempts:-0} error rows; historical/backfill slices outside lookback are ignored)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 2. Ingest ran at all yesterday (a workflow that never fires is invisible otherwise).
          recent=$(q "SELECT count(*) FROM cvm_ingest_log WHERE started_at > now() - interval '26 hours'")
          echo "ingest log rows (26h): $recent"
          if [ "${recent:-0}" -eq 0 ]; then
            echo "FAIL: no ingest activity in 26h — did the daily cron fire?" >&2
            echo "- ❌ no ingest activity in 26h" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            echo "- ✅ ingest active ($recent log rows / 26h)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 3. Completeness drift: every MONTHLY family must have a complete period
          #    inside MAX_COMPLETE_AGE_DAYS. fip files yearly and is excluded by design.
          echo "--- completeness by family ---"
          psql "$POSTGRES_URL" -c "SET default_transaction_read_only = on" -c \
            "SELECT entity_type, public.latest_complete_period(entity_type) AS complete_through,
                    (CURRENT_DATE - public.latest_complete_period(entity_type)) AS days_behind
               FROM (SELECT DISTINCT entity_type FROM mv_period_completeness) f
              ORDER BY entity_type"
          stalled=$(q "SELECT count(*) FROM (SELECT DISTINCT entity_type FROM mv_period_completeness) f
                        WHERE entity_type <> 'fip'
                          AND (CURRENT_DATE - public.latest_complete_period(entity_type)) > ${MAX_COMPLETE_AGE_DAYS}")
          if [ "${stalled:-0}" -gt 0 ]; then
            echo "FAIL: $stalled monthly families stalled beyond ${MAX_COMPLETE_AGE_DAYS}d" >&2
            echo "- ❌ $stalled stalled families" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            echo "- ✅ completeness current for all monthly families" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 4. api.* contract still answers.
          #
          # This was commented "catches a broken analytical apply". It does not,
          # and did not: 04_fact_fund_monthly.sql failed on every apply from at
          # least 2026-08-30 while this check stayed green, because neither
          # api.catalog() nor api.coverage() reads fact_fund_monthly. Check 4b
          # below is the one that covers it.
          cat=$(q "SELECT api.catalog()->>'version'")
          cov=$(q "SELECT count(*) FROM api.coverage()")
          echo "catalog_version=$cat coverage_rows=$cov"
          if [ -z "$cat" ] || [ "${cov:-0}" -eq 0 ]; then
            echo "FAIL: api contract not answering (catalog='$cat', coverage rows=$cov)" >&2
            echo "- ❌ api contract broken" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          else
            echo "- ✅ api contract OK (catalog v$cat, $cov coverage rows)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 4b. The fund fact table is REFRESHED, not merely present.
          #
          # fact_fund_monthly is rebuilt by 04_fact_fund_monthly.sql, whose whole
          # file is one transaction. When that build dies the DROP rolls back with
          # it, so the matview keeps serving its previous contents — present,
          # queryable, and silently frozen. Every existence check passes; the
          # dashboards just quietly stop moving. That is what happened from
          # 2026-08-30 until it was found by reading an apply log.
          #
          # The honest invariant is that the fact table must not trail the data
          # that has actually been ingested. Both sides are month-granular, so a
          # healthy pair is equal and a stalled matview drifts a whole month
          # behind within weeks — which is the failure worth alarming on. This
          # deliberately does not try to detect "refreshed yesterday rather than
          # today": the source is monthly, so that would be noise.
          #
          # A missing or unpopulated matview makes the query error, $lag comes
          # back non-numeric, and the guard below fails rather than passing.
          lag=$(q "SELECT (public.latest_complete_period('fi') - max(period))::int
                     FROM fact_fund_monthly WHERE entity_type = 'fi'")
          echo "fact_fund_monthly lag behind ingested fi completeness: ${lag:-<none>} days"
          # A NEGATIVE lag is normal and this check used to fail on it. The fact
          # table aggregates cvm_fi_diario, which the daily run fills through the
          # CURRENT month; latest_complete_period('fi') only counts months that
          # are complete. So a freshly rebuilt matview sits one calendar month
          # ahead — lag between -28 and -31 — and `[ "$lag" -ge 0 ]` sent that
          # into the not-queryable branch. Run 33666142198 reported
          # "fact_fund_monthly did not answer (missing, unpopulated, or empty)"
          # about a matview rebuilt 44 minutes earlier that answered -31. A gate
          # that cries missing-data at a healthy warehouse is the false alarm
          # this file exists to avoid.
          #
          # Numeric-ness is now tested on its own, because conflating it with
          # the range test is what produced the wrong diagnosis: a genuinely
          # absent answer and an out-of-range one need different messages.
          #   > 31   stale — the analytical apply is failing (the 2026-08-30 bug)
          #   < -31  more than one calendar month ahead: periods that have not
          #          happened, i.e. bad DT_COMPTC in the source
          #   else   healthy, in-progress month included
          if ! printf '%s' "${lag:-}" | grep -Eq '^-?[0-9]+$'; then
            echo "FAIL: fact_fund_monthly did not answer (missing, unpopulated, or empty)" >&2
            echo "- ❌ fact_fund_monthly not queryable" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          elif [ "$lag" -gt 31 ]; then
            echo "FAIL: fact_fund_monthly is $lag days behind ingested fi data —" \
                 "the analytical apply is failing; check 04_fact_fund_monthly.sql" >&2
            echo "- ❌ fact_fund_monthly stale by $lag days" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          elif [ "$lag" -lt -31 ]; then
            echo "FAIL: fact_fund_monthly holds periods $((0 - lag)) days AHEAD of the" \
                 "latest complete fi period — more than the in-progress month, so the" \
                 "source dates are wrong; check DT_COMPTC in cvm_fi_diario" >&2
            echo "- ❌ fact_fund_monthly $((0 - lag)) days ahead (future-dated periods)" \
              >> "$GITHUB_STEP_SUMMARY"
            fail=1
          elif [ "$lag" -lt 0 ]; then
            echo "- ✅ fact_fund_monthly fresh ($((0 - lag)) days ahead — in-progress month)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ✅ fact_fund_monthly fresh ($lag days behind ingest)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 5. Disk. Supabase bills on database size; the plan allowance is a
          #    workflow input because Postgres cannot see it.
          bytes=$(q "SELECT pg_database_size(current_database())")
          gb=$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1024/1024/1024}')
          if [ -n "${PLAN_DISK_GB:-}" ]; then
            pct=$(awk -v g="$gb" -v p="$PLAN_DISK_GB" 'BEGIN{printf "%.0f", 100*g/p}')
            echo "database size: ${gb}GB of ${PLAN_DISK_GB}GB (${pct}%)"
            echo "- 💾 database ${gb}GB / ${PLAN_DISK_GB}GB (${pct}%)" >> "$GITHUB_STEP_SUMMARY"
          else
            pct=0
            echo "database size: ${gb}GB (plan allowance not configured — set PLAN_DISK_GB for a threshold)"
            echo "- 💾 database ${gb}GB (no plan allowance configured)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "--- 12 largest relations ---"
          psql "$POSTGRES_URL" -c "SET default_transaction_read_only = on" -c \
            "SELECT relname, pg_size_pretty(pg_total_relation_size(c.oid)) AS total
               FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind IN ('r','m','p')
              ORDER BY pg_total_relation_size(c.oid) DESC LIMIT 12"
          if [ -n "${PLAN_DISK_GB:-}" ] && [ "${pct:-0}" -ge "$DISK_WARN_PCT" ]; then
            echo "::warning::database at ${pct}% of the ${PLAN_DISK_GB}GB plan allowance (${gb}GB used). Do not drop landing tables to clear this. See docs/DATABASE_MAINTENANCE.md §9."
          fi

          echo
          if [ "$fail" -ne 0 ]; then
            echo "HEALTH: FAIL"; exit 1
          fi
          echo "HEALTH: PASS"

      # ------------------------------------------------- the public surface
      # Every other check in this file reaches the database as the OWNER over
      # psql, which bypasses grants entirely. That is a real blind spot, and it
      # cost us: on 2026-08-29 the entire anonymous surface returned
      # 42501 permission denied for hours while `SELECT * FROM api.coverage()`
      # kept passing from CI. Owner-path SQL cannot see a privilege
      # regression — only an anonymous HTTPS request can.
      #
      # So this step calls the API the way a caller actually does, and checks
      # both halves of the contract:
      #   1. every documented object answers anonymously, and
      #   2. no landing table does.
      # The second half is the standing rule (never GRANT anon on landing
      # tables) verified against production instead of assumed from the SQL.
      #
      # The key is read out of skill.md rather than copied here. It is already
      # published there and throughout api-docs/, it is read-only by design,
      # and keeping one source means a rotation cannot leave this check
      # silently probing a dead credential.
      #
      # always(): a DB-side failure above must not mask the public surface, and
      # this needs no secret, so it runs even when POSTGRES_URL is absent.
      - name: Public API reachable as anon
        if: always()
        env:
          SILO_REST: "https://zcjbtpxuhdekpwcxmepn.supabase.co/rest/v1"
        run: |
          set -uo pipefail
          key=$(grep -oE 'sb_publishable_[A-Za-z0-9_]+' skill.md | head -1)
          if [ -z "$key" ]; then
            echo "::error::no publishable key found in skill.md — this check cannot run"
            exit 1
          fi
          echo "probing $SILO_REST as anon with the published key"
          pfail=0

          probe() {   # name method path expected-status
            local name="$1" method="$2" path="$3" expect="$4" code
            if [ "$method" = POST ]; then
              code=$(curl -s -o /tmp/probe -w '%{http_code}' -X POST "$SILO_REST/$path" \
                -H "apikey: $key" -H 'Content-Type: application/json' \
                -d '{}' --max-time 25)
            else
              code=$(curl -s -o /tmp/probe -w '%{http_code}' "$SILO_REST/$path" \
                -H "apikey: $key" --max-time 25)
            fi
            if [ "$code" = "$expect" ]; then
              echo "  ok   $name ($code)"
            else
              echo "  FAIL $name — got $code, expected $expect: $(head -c 160 /tmp/probe)"
              pfail=1
            fi
          }

          echo "--- the documented surface must answer anonymously ---"
          probe "rpc/coverage"    POST rpc/coverage      200
          probe "rpc/catalog"     POST rpc/catalog       200
          probe "api.quotes"      GET  "quotes?limit=1"  200
          probe "api.funds"       GET  "funds?limit=1"   200

          # A landing table reachable with the publishable key is the one
          # failure here that is a data-exposure incident rather than an
          # outage. Anything other than 200 is fine — the point is that the
          # row does not come back.
          echo "--- landing tables must stay closed to anon ---"
          for t in cvm_fi_diario b3_cotahist cia_account bacen_sgs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SILO_REST/$t?limit=1" \
              -H "apikey: $key" -H 'Accept-Profile: public' --max-time 25)
            if [ "$code" = "200" ]; then
              echo "  FAIL $t is READABLE by anon — landing data is exposed"
              echo "::error::$t is readable with the publishable key. See docs/DATABASE_MAINTENANCE.md and the sweep in 12_grants_and_rls.sql."
              pfail=1
            else
              echo "  ok   $t closed ($code)"
            fi
          done

          echo
          if [ "$pfail" -ne 0 ]; then
            echo "- 🔴 public API check FAILED" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "PUBLIC API: FAIL"; exit 1
          fi
          echo "- 🟢 public API answers anonymously; landing tables closed" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "PUBLIC API: PASS"

      # ----------------------------------------------------------- diagnostics
      # Investigation queries. Never fails on data: it exists to SHOW numbers.
      # Everything is bounded (LIMIT / narrow windows) so it cannot hammer prod.
      - name: Diagnostics
        # always(): a failing gate is precisely when the diagnostics output is
        # needed. Without it, the step that explains the failure is skipped
        # because of the failure.
        if: always() && (env.MODE == 'diagnostics' || env.MODE == 'both')
        run: |
          # One psql session per query file, each with its own timeout, and a
          # failure prints and moves on.
          #
          # The first version ran all eleven in a single heredoc under
          # ON_ERROR_STOP. Two things went wrong: a missing view aborted every
          # query after it (so the cheap answers were hostage to the newest
          # one), and the heredoc terminators broke the YAML block scalar. The
          # queries now live in scripts/health_diagnostics/*.sql, which also
          # makes them runnable by hand and reviewable as SQL rather than as
          # strings inside YAML.
          set -uo pipefail
          shopt -s nullglob
          for f in scripts/health_diagnostics/*.sql; do
            label=$(head -1 "$f" | sed 's/^-- *//')
            echo
            echo "=== $label ==="
            if ! psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
                   -c "SET default_transaction_read_only = on" \
                   -c "SET statement_timeout = '${DIAG_TIMEOUT:-90s}'" \
                   -f "$f"; then
              echo "(skipped: failed or exceeded ${DIAG_TIMEOUT:-90s} — see $f)"
            fi
          done
