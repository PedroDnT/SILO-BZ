name: Tests

# Offline pytest on every PR and push to main (pip + .pytest_cache).
# Read-only api.* smoke against Silo is dispatch-only — not on PRs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache pytest
        uses: actions/cache@v5
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('requirements.txt', 'tests/**', 'serve/**', 'src/**') }}
          restore-keys: |
            pytest-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  # Prove every piece of SQL in the repo actually compiles — schema.sql, all
  # migrations, the whole analytical layer, and every Evidence source query —
  # against a throwaway Postgres, on every PR. Before this job existed the only
  # thing that executed the SQL was a human dispatching api-smoke or the nightly
  # ingest itself, so a typo in 19_api_contract.sql could merge green and only
  # fail in production. Empty tables are fine: 0-row matviews still validate
  # every view, function, index and grant. The data-emptiness smoke guards in
  # 01_dim_fund / 04_fact_fund_monthly are downgraded to warnings via the
  # silo.ci_smoke_bypass GUC (production applies never set it).
  sql-compile:
    name: SQL compile (ephemeral Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: silo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://postgres:ci@localhost:5432/silo_ci
    steps:
      - uses: actions/checkout@v5

      # Supabase provides anon/authenticated; a vanilla postgres:15 does not.
      # silo_api is created by 12_grants_and_rls.sql itself (guarded).
      - name: Create Supabase client roles
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;"

      # Same composite action as daily/backfill/watchdog, so the CI bootstrap
      # can never drift from the production one.
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ env.POSTGRES_URL }}

      # An empty database is the one state production is never in. Applying
      # schema.sql to a fresh DB proved nothing about the upgrade, and twice in
      # one evening that gap shipped a broken schema gate:
      #   1. an index over a column only the migration adds (CREATE TABLE
      #      IF NOT EXISTS is a no-op on an existing table), and
      #   2. a widened key that DROPS a column, so legacy rows distinguished
      #      only by the dropped column collided once the new ones were NULL
      #      (NULLS NOT DISTINCT makes NULL equal to NULL).
      # Neither is visible without pre-existing rows.
      #
      # The old shape is built by removing the new columns from a current
      # database rather than by checking out an old schema.sql: actions/checkout
      # is a shallow clone, so git history is not available here, and naming the
      # columns explicitly says what "before" means instead of leaving it to
      # whatever a commit offset happens to point at.
      - name: Upgrade path — an EXISTING database with rows in it
        run: |
          set -euo pipefail
          OLD_URL="postgresql://postgres:ci@localhost:5432/silo_upgrade"
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE silo_upgrade;"

          psql "$OLD_URL" -v ON_ERROR_STOP=1 -q -f src/store/schema.sql > /dev/null
          for f in $(ls src/store/migrations/*.sql | sort); do
            psql "$OLD_URL" -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null
          done

          echo "--- rewind to the pre-change shape ---"
          psql "$OLD_URL" -v ON_ERROR_STOP=1 <<'REWIND'
          DROP INDEX IF EXISTS uq_fip_periodic;
          ALTER TABLE cvm_fip_periodic
              DROP COLUMN IF EXISTS period,
              DROP COLUMN IF EXISTS classe_cota,
              DROP COLUMN IF EXISTS row_hash;
          ALTER TABLE cvm_fip_periodic
              ADD CONSTRAINT uq_fip_periodic
              UNIQUE NULLS NOT DISTINCT (cnpj, doc_type, period_year);

          DROP INDEX IF EXISTS uq_fi_cda_acoes;
          ALTER TABLE cvm_fi_cda_acoes DROP COLUMN IF EXISTS tp_fundo;
          CREATE UNIQUE INDEX uq_fi_cda_acoes
              ON cvm_fi_cda_acoes (cnpj, period, tp_aplic, cd_ativo, tp_negoc)
              NULLS NOT DISTINCT;

          DROP INDEX IF EXISTS uq_fi_cda_cotas;
          ALTER TABLE cvm_fi_cda_cotas
              DROP COLUMN IF EXISTS tp_fundo,
              DROP COLUMN IF EXISTS tp_negoc;
          ALTER TABLE cvm_fi_cda_cotas
              ADD CONSTRAINT uq_fi_cda_cotas UNIQUE (cnpj, period, cnpj_cota);
          REWIND

          echo "--- rows in that shape (this is what production holds) ---"
          psql "$OLD_URL" -v ON_ERROR_STOP=1 <<'SEED'
          -- FIP is the sharp case: many years of ONE fund, distinguished only
          -- by period_year, and a raw payload with no recoverable date. These
          -- are the exact rows that made the index build fail in production.
          INSERT INTO cvm_fip_periodic (cnpj, doc_type, period_year, vl_patrim_liq, raw)
          SELECT '34964435000178', 'inf_trimestral', y, 1000 + y,
                 '{"DENOM_SOCIAL":"LEGACY"}'::jsonb
          FROM generate_series(2010, 2023) AS y;

          -- One row that DOES carry a recoverable date, to prove the recovery
          -- reads `raw` rather than only marking rows.
          INSERT INTO cvm_fip_periodic (cnpj, doc_type, period_year, vl_patrim_liq, raw)
          VALUES ('11111111111111', 'inf_trimestral', 2022, 5,
                  '{"DT_COMPTC":"2022-06-30","CLASSE_COTA":"A"}'::jsonb);

          INSERT INTO cvm_fi_cda_acoes
              (cnpj, period, tp_aplic, tp_ativo, cd_ativo, tp_negoc, raw)
          VALUES ('00102322000141','2022-05-01','Ações','BDR nível I','NFLX34',
                  'Para negociação','{"TP_FUNDO":"FI"}'::jsonb);

          INSERT INTO cvm_fi_cda_cotas
              (cnpj, period, cnpj_cota, tp_aplic, raw)
          VALUES ('00068305000135','2022-03-01','01165780000192','Cotas de Fundos',
                  '{"TP_FUNDO":"FI"}'::jsonb);
          SEED

          echo "--- the upgrade: current schema.sql, every migration, then again ---"
          psql "$OLD_URL" -v ON_ERROR_STOP=1 -f src/store/schema.sql > /dev/null
          for f in $(ls src/store/migrations/*.sql | sort); do
            psql "$OLD_URL" -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done
          psql "$OLD_URL" -v ON_ERROR_STOP=1 -f src/store/schema.sql > /dev/null

          kept=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM cvm_fip_periodic;")
          uniq=$(psql "$OLD_URL" -tAc "SELECT count(DISTINCT row_hash) FROM cvm_fip_periodic;")
          recovered=$(psql "$OLD_URL" -tAc "SELECT coalesce(period::text,'-')||'/'||coalesce(classe_cota,'-') FROM cvm_fip_periodic WHERE cnpj='11111111111111';")
          acoes=$(psql "$OLD_URL" -tAc "SELECT coalesce(tp_fundo,'-') FROM cvm_fi_cda_acoes;")
          cotas=$(psql "$OLD_URL" -tAc "SELECT coalesce(tp_fundo,'-') FROM cvm_fi_cda_cotas WHERE cnpj='00068305000135';")
          echo "fip rows kept=$kept distinct row_hash=$uniq recovered=$recovered | cda tp_fundo=$acoes cotas=$cotas"

          test "$kept" = "15"  || { echo "FAIL: legacy rows lost by the upgrade"; exit 1; }
          test "$uniq" = "15"  || { echo "FAIL: legacy rows not distinguishable under the new key"; exit 1; }
          test "$recovered" = "2022-06-30/A" || { echo "FAIL: recovery did not read raw"; exit 1; }
          test "$acoes" = "FI" || { echo "FAIL: cda tp_fundo not recovered from raw"; exit 1; }
          test "$cotas" = "FI" || { echo "FAIL: cda cotas tp_fundo not recovered from raw"; exit 1; }

          echo "--- re-apply 33 on the live-shaped unique (Backfill #24) ---"
          # Two rows unique under the wide key: one already has tp_fundo='FI'
          # and tp_negoc NULL, raw stripped (what ingest writes today); the
          # other is the narrow-key remnant (both key columns NULL). The old
          # UPDATE reset the FI row to (NULL, NULL) because WHERE matched on
          # tp_negoc IS NULL and raw no longer carried TP_FUNDO.
          psql "$OLD_URL" -v ON_ERROR_STOP=1 <<'LIVE'
          INSERT INTO cvm_fi_cda_cotas
              (cnpj, period, cnpj_cota, tp_fundo, tp_aplic, tp_negoc, raw)
          VALUES
              ('32300050000180','2023-10-01','43809974000123','FI',
               'Cotas de Fundos',NULL,'{}'::jsonb),
              ('32300050000180','2023-10-01','43809974000123',NULL,
               'Cotas de Fundos',NULL,'{"TP_FUNDO":"FI"}'::jsonb);
          LIVE
          psql "$OLD_URL" -v ON_ERROR_STOP=1 -f src/store/migrations/33_cda_holdings_key_widening.sql > /dev/null
          live_keys=$(psql "$OLD_URL" -tAc "SELECT string_agg(coalesce(tp_fundo,'-'), ',' ORDER BY tp_fundo NULLS LAST) FROM cvm_fi_cda_cotas WHERE cnpj='32300050000180';")
          live_n=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM cvm_fi_cda_cotas WHERE cnpj='32300050000180';")
          echo "backfill24 keys=$live_keys n=$live_n"
          test "$live_n" = "2" || { echo "FAIL: Backfill #24 replay lost a cotas row"; exit 1; }
          test "$live_keys" = "FI,-" || { echo "FAIL: Backfill #24 replay wiped tp_fundo (got $live_keys)"; exit 1; }

      - name: Apply analytical layer (empty-DB bypass)
        run: PGOPTIONS="-c silo.ci_smoke_bypass=on" bash scripts/apply_analytical.sh

      # The tier helpers decide how much an anonymous caller may pull. Regex
      # tests over the SQL text prove the code says the right thing; only
      # executing it proves it DOES the right thing — in particular that
      # request.jwt.claims survives the SECURITY DEFINER switch, which is the
      # single assumption the whole tier design rests on.
      - name: Caller tiers behave (executed, not just compiled)
        run: |
          set -euo pipefail
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n INT;
          BEGIN
            -- Fail closed: anything short of a well-formed authenticated
            -- claim must resolve to the anonymous tier.
            PERFORM set_config('request.jwt.claims', '', true);
            ASSERT api.caller_tier() = 'anon', 'empty claims must be anon';
            PERFORM set_config('request.jwt.claims', 'not json', true);
            ASSERT api.caller_tier() = 'anon', 'malformed claims must be anon';
            PERFORM set_config('request.jwt.claims', '{"nope":1}', true);
            ASSERT api.caller_tier() = 'anon', 'claims without a role must be anon';
            PERFORM set_config('request.jwt.claims', '{"role":"service_role"}', true);
            ASSERT api.caller_tier() = 'anon', 'only authenticated is the raised tier';
            PERFORM set_config('request.jwt.claims', '{"role":"authenticated"}', true);
            ASSERT api.caller_tier() = 'authenticated', 'a signed-in caller must be recognised';

            -- Anonymous ceiling: 3 ids.
            PERFORM set_config('request.jwt.claims', '{"role":"anon"}', true);
            SELECT array_length(api.assert_panel_ids('{A,B,C}'::text[]), 1) INTO n;
            ASSERT n = 3, 'anon must be allowed 3 ids';
            BEGIN
              PERFORM api.assert_panel_ids('{A,B,C,D}'::text[]);
              RAISE EXCEPTION 'anon was allowed 4 ids';
            EXCEPTION WHEN sqlstate '22023' THEN NULL;
            END;

            -- Signed-in ceiling: 50 ids.
            PERFORM set_config('request.jwt.claims', '{"role":"authenticated"}', true);
            SELECT array_length(
              api.assert_panel_ids(ARRAY(SELECT 'T' || g FROM generate_series(1,50) g)), 1
            ) INTO n;
            ASSERT n = 50, 'authenticated must be allowed 50 ids';
            BEGIN
              PERFORM api.assert_panel_ids(ARRAY(SELECT 'T' || g FROM generate_series(1,51) g));
              RAISE EXCEPTION 'authenticated was allowed 51 ids';
            EXCEPTION WHEN sqlstate '22023' THEN NULL;
            END;

            -- An empty panel is a legitimate request, not a violation.
            PERFORM api.assert_panel_ids('{}'::text[]);

            RAISE NOTICE 'caller tiers OK';
          END $$;
          SQL

      - name: Compile every dashboard source query
        run: |
          set -uo pipefail
          failed=()
          for f in dashboard/sources/supabase/*.sql; do
            if ! out=$(psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -q -f "$f" 2>&1 >/dev/null); then
              failed+=("$f")
              echo "FAIL $f"
              sed 's/^/       /' <<<"$out" | tail -4
            fi
          done
          echo "checked $(ls dashboard/sources/supabase/*.sql | wc -l) sources, ${#failed[@]} failed"
          [ ${#failed[@]} -eq 0 ]

  api-smoke:
    name: api.* smoke (read-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Smoke api.coverage / quote_latest / panel
        run: |
          set -euo pipefail
          if [ -z "${POSTGRES_URL:-}" ]; then
            echo "POSTGRES_URL secret is missing" >&2
            exit 1
          fi
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SET default_transaction_read_only = on;

          \echo === api.coverage ===
          SELECT * FROM api.coverage();

          \echo === api.quote_latest(PETR4) ===
          SELECT ticker, trade_date, close, source
          FROM api.quote_latest('PETR4');

          \echo === api.panel PETR4 close month ===
          SELECT id, date, metric, value, source
          FROM api.panel(
            ARRAY['PETR4']::text[],
            ARRAY['close']::text[],
            CURRENT_DATE - 365,
            CURRENT_DATE,
            'month'
          )
          LIMIT 5;
          SQL

          n=$(psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -qAt \
            -c "SET default_transaction_read_only = on" \
            -c "SELECT COUNT(*) FROM api.quote_latest('PETR4')")
          n=$(echo "$n" | tr -d '[:space:]')
          if [ "$n" = "0" ]; then
            echo "notice: quote_latest(PETR4) returned 0 rows (daily-only COTAHIST until b3-backfill). SQL succeeded."
          fi
