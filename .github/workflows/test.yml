name: Tests

# Offline pytest on every PR and push to main (pip + .pytest_cache).
# Read-only api.* smoke against Silo is dispatch-only — not on PRs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sql_compile_only:
        description: Run only the ephemeral PostgreSQL SQL compile job
        required: false
        type: boolean
        default: false
      run_api_smoke:
        description: Run the read-only smoke against the configured production API database
        required: false
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (offline)
    if: github.event_name != 'workflow_dispatch' || !inputs.sql_compile_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The pre-push hook's dropped-row check (.claude/hooks/pre-push-docs.sh),
      # for the merges it never sees. On 2026-09-26 an update of #322's branch
      # from main in GitHub's web UI (be050dd) kept #322's CHANGELOG row, dropped
      # #324's and #325's that main had just added, and the PR merged green;
      # #327 put them back.
      # GitHub's merges ignore .gitattributes' merge=union, which covers local
      # ones only. HEAD is GitHub's merge of the PR into its base, fetched one
      # commit deep, so fetch the history the merge base and the PR's commit
      # messages need. This holds a merge only while this job is a required
      # check, or if it fails before someone merges.
      - name: No CHANGELOG row dropped against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet --unshallow origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base=$(git merge-base HEAD "origin/$BASE_REF")
          at=$(git rev-parse --short "$base")
          messages=$(git log --format=%B "$base..HEAD")
          if grep -qiE '^Changelog-removes:[[:space:]]*[^[:space:]]' <<<"$messages"; then
            echo "A Changelog-removes: trailer lets this PR remove or rewrite CHANGELOG rows."
            exit 0
          fi
          # The fragments, the live file and the frozen archive files hold the rows
          # together (scripts/roll_changelog.py folds and rolls them), so a row moved
          # between them is not a drop.
          rows() {
            git ls-tree -r --name-only "$1" -- docs/planning/changelog.d docs/planning/CHANGELOG.md docs/archive/changelog 2>/dev/null |
              while IFS= read -r f; do git show "$1:$f"; done | grep '^| 20'
          }
          rc=0
          dropped=$(grep -vxFf <(rows HEAD) <(rows "$base")) || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "Every CHANGELOG row $BASE_REF had at $at is still here, word for word."
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "::error file=docs/planning/CHANGELOG.md::$(grep -c . <<<"$dropped") CHANGELOG row(s) that $BASE_REF had at $at are gone or changed. Restore them word for word from 'git show $at:docs/planning/CHANGELOG.md', or put a 'Changelog-removes: <reason>' trailer in a commit if that is deliberate."
          printf '%s\n' "$dropped" | cut -c1-200
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache pytest
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'tests/**', 'serve/**', 'src/**') }}
          restore-keys: |
            pytest-${{ runner.os }}-

      # requirements-dev.txt = requirements.txt + what only the tests import
      # (pydantic, openai, openai-agents). One file, the same one AGENTS.md
      # tells a contributor to install, so a fresh venv collects every test.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  # Prove every piece of SQL in the repo actually compiles — schema.sql, all
  # migrations, the whole analytical layer, and every Evidence source query —
  # against a throwaway Postgres, on every PR. Before this job existed the only
  # thing that executed the SQL was a human dispatching api-smoke or the nightly
  # ingest itself, so a typo in 19_api_contract.sql could merge green and only
  # fail in production. Empty tables are fine: 0-row matviews still validate
  # every view, function, index and grant. The data-emptiness smoke guards in
  # 01_dim_fund / 04_fact_fund_monthly are downgraded to warnings via the
  # silo.ci_smoke_bypass GUC (production applies never set it).
  sql-compile:
    name: SQL compile (ephemeral Postgres)
    if: github.event_name != 'workflow_dispatch' || inputs.sql_compile_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: silo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://postgres:ci@localhost:5432/silo_ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Supabase provides anon/authenticated; a vanilla postgres:15 does not.
      # silo_api is created by 12_grants_and_rls.sql itself (guarded).
      - name: Create Supabase client roles
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anon NOLOGIN;" \
            -c "CREATE ROLE authenticated NOLOGIN;"

      # Reproduce the live-warehouse replay that empty-DB compile cannot catch.
      # Migration 32 created cvm_fi_cda_acoes / cvm_fi_cda_cotas; schema.sql
      # later widened their unique indexes with tp_fundo. CREATE TABLE IF NOT
      # EXISTS is a no-op on those tables, so schema.sql (applied BEFORE
      # migrations, including 33) must ADD COLUMN first. Backfill #18
      # (run 33428561498) died on `column "tp_fundo" does not exist`.
      - name: Seed migration-32 holdings tables (existing-DB replay)
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 \
            -f src/store/migrations/32_cda_holdings.sql

      # Same composite action as daily/backfill/watchdog, so the CI bootstrap
      # can never drift from the production one.
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ env.POSTGRES_URL }}

      # An empty database is the one state production is never in. Applying
      # schema.sql to a fresh DB proved nothing about the upgrade, and twice in
      # one evening that gap shipped a broken schema gate:
      #   1. an index over a column only the migration adds (CREATE TABLE
      #      IF NOT EXISTS is a no-op on an existing table), and
      #   2. a widened key that DROPS a column, so legacy rows distinguished
      #      only by the dropped column collided once the new ones were NULL
      #      (NULLS NOT DISTINCT makes NULL equal to NULL).
      # Neither is visible without pre-existing rows.
      #
      # The old shape is built by removing the new columns from a current
      # database rather than by checking out an old schema.sql: actions/checkout
      # is a shallow clone, so git history is not available here, and naming the
      # columns explicitly says what "before" means instead of leaving it to
      # whatever a commit offset happens to point at.
      - name: Upgrade path — an EXISTING database with rows in it
        run: |
          set -euo pipefail
          OLD_URL="postgresql://postgres:ci@localhost:5432/silo_upgrade"
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE silo_upgrade;"

          psql "$OLD_URL" -v ON_ERROR_STOP=1 -q -f src/store/schema.sql > /dev/null
          for f in $(ls src/store/migrations/*.sql | sort); do
            psql "$OLD_URL" -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null
          done

          echo "--- rewind to the pre-change shape ---"
          psql "$OLD_URL" -v ON_ERROR_STOP=1 <<'REWIND'
          DROP INDEX IF EXISTS uq_fip_periodic;
          ALTER TABLE cvm_fip_periodic
              DROP COLUMN IF EXISTS period,
              DROP COLUMN IF EXISTS classe_cota,
              DROP COLUMN IF EXISTS row_hash;
          ALTER TABLE cvm_fip_periodic
              ADD CONSTRAINT uq_fip_periodic
              UNIQUE NULLS NOT DISTINCT (cnpj, doc_type, period_year);

          DROP INDEX IF EXISTS uq_fi_cda_acoes;
          ALTER TABLE cvm_fi_cda_acoes DROP COLUMN IF EXISTS tp_fundo;
          CREATE UNIQUE INDEX uq_fi_cda_acoes
              ON cvm_fi_cda_acoes (cnpj, period, tp_aplic, cd_ativo, tp_negoc)
              NULLS NOT DISTINCT;

          DROP INDEX IF EXISTS uq_fi_cda_cotas;
          ALTER TABLE cvm_fi_cda_cotas
              DROP COLUMN IF EXISTS tp_fundo,
              DROP COLUMN IF EXISTS tp_negoc;
          ALTER TABLE cvm_fi_cda_cotas
              ADD CONSTRAINT uq_fi_cda_cotas UNIQUE (cnpj, period, cnpj_cota);

          -- FII before migration 43: no versao on cvm_fii_mensal, neither key
          -- names it, and the backfill marker (the column comment) is unset.
          -- CASCADE takes instrument_activity, which 07 + 43 re-create.
          DROP VIEW IF EXISTS vw_fii_mensal_latest CASCADE;
          DROP VIEW IF EXISTS vw_fii_periodic_latest;
          ALTER TABLE cvm_fii_mensal DROP CONSTRAINT IF EXISTS uq_fii_mensal;
          ALTER TABLE cvm_fii_mensal DROP COLUMN IF EXISTS versao;
          ALTER TABLE cvm_fii_mensal
              ADD CONSTRAINT uq_fii_mensal UNIQUE (cnpj, period, doc_subtype);
          ALTER TABLE cvm_fii_periodic DROP CONSTRAINT IF EXISTS uq_fii_periodic;
          ALTER TABLE cvm_fii_periodic
              ADD CONSTRAINT uq_fii_periodic UNIQUE NULLS NOT DISTINCT
              (cnpj, doc_type, period_year, data_referencia);
          COMMENT ON COLUMN cvm_fii_periodic.versao IS NULL;

          -- CDA block 1 before migration 49: keyed per fund, not per bond, the
          -- bond still only in raw. Dropping cd_isin also drops the backfill
          -- marker (its column comment).
          ALTER TABLE cvm_fi_cda DROP CONSTRAINT IF EXISTS uq_fi_cda;
          ALTER TABLE cvm_fi_cda
              DROP COLUMN IF EXISTS tp_fundo,
              DROP COLUMN IF EXISTS tp_negoc,
              DROP COLUMN IF EXISTS cd_isin,
              DROP COLUMN IF EXISTS cd_selic,
              DROP COLUMN IF EXISTS tp_titpub,
              DROP COLUMN IF EXISTS dt_venc,
              DROP COLUMN IF EXISTS qt_pos_final;
          ALTER TABLE cvm_fi_cda
              ADD CONSTRAINT uq_fi_cda UNIQUE (cnpj, period, tp_aplic, tp_ativo);

          -- SECURIT before migration 52: the old keys, and none of the columns
          -- 52 adds. Dropping occurrence also drops the backfill marker (its
          -- column comment).
          ALTER TABLE cvm_securit_mensal DROP CONSTRAINT IF EXISTS uq_securit_mensal;
          ALTER TABLE cvm_securit_mensal
              DROP COLUMN IF EXISTS codigo_identificacao,
              DROP COLUMN IF EXISTS versao,
              DROP COLUMN IF EXISTS occurrence;
          ALTER TABLE cvm_securit_mensal ADD CONSTRAINT uq_securit_mensal
              UNIQUE NULLS NOT DISTINCT
              (instrument_type, period_year, cnpj_securit, dt_emissao, dt_vencto, vl_emissao);
          ALTER TABLE cvm_securit_serie DROP CONSTRAINT IF EXISTS uq_securit_serie;
          ALTER TABLE cvm_securit_serie
              DROP COLUMN IF EXISTS versao,
              DROP COLUMN IF EXISTS occurrence;
          ALTER TABLE cvm_securit_serie ADD CONSTRAINT uq_securit_serie
              UNIQUE NULLS NOT DISTINCT
              (instrument_type, cnpj_securit, codigo_identificacao, data_referencia, numero_serie);
          ALTER TABLE cvm_securit_dfin DROP CONSTRAINT IF EXISTS uq_securit_dfin;
          ALTER TABLE cvm_securit_dfin
              DROP COLUMN IF EXISTS codigo_identificacao,
              DROP COLUMN IF EXISTS data_referencia,
              DROP COLUMN IF EXISTS versao,
              DROP COLUMN IF EXISTS occurrence;
          ALTER TABLE cvm_securit_dfin ADD CONSTRAINT uq_securit_dfin
              UNIQUE NULLS NOT DISTINCT (instrument_type, period_year, cnpj_securit);
          REWIND

          echo "--- rows in that shape (this is what production holds) ---"
          psql "$OLD_URL" -v ON_ERROR_STOP=1 <<'SEED'
          -- FIP is the sharp case: many years of ONE fund, distinguished only
          -- by period_year, and a raw payload with no recoverable date. These
          -- are the exact rows that made the index build fail in production.
          INSERT INTO cvm_fip_periodic (cnpj, doc_type, period_year, vl_patrim_liq, raw)
          SELECT '34964435000178', 'inf_trimestral', y, 1000 + y,
                 '{"DENOM_SOCIAL":"LEGACY"}'::jsonb
          FROM generate_series(2010, 2023) AS y;

          -- One row that DOES carry a recoverable date, to prove the recovery
          -- reads `raw` rather than only marking rows.
          INSERT INTO cvm_fip_periodic (cnpj, doc_type, period_year, vl_patrim_liq, raw)
          VALUES ('11111111111111', 'inf_trimestral', 2022, 5,
                  '{"DT_COMPTC":"2022-06-30","CLASSE_COTA":"A"}'::jsonb);

          INSERT INTO cvm_fi_cda_acoes
              (cnpj, period, tp_aplic, tp_ativo, cd_ativo, tp_negoc, raw)
          VALUES ('00102322000141','2022-05-01','Ações','BDR nível I','NFLX34',
                  'Para negociação','{"TP_FUNDO":"FI"}'::jsonb);

          INSERT INTO cvm_fi_cda_cotas
              (cnpj, period, cnpj_cota, tp_aplic, raw)
          VALUES ('00068305000135','2022-03-01','01165780000192','Cotas de Fundos',
                  '{"TP_FUNDO":"FI"}'::jsonb);

          -- FII as production holds it: one version per filing, Versao still
          -- in raw. One row has none (must stay NULL) and one a malformed
          -- value (must stay NULL, left in raw — never guessed).
          INSERT INTO cvm_fii_mensal (cnpj, period, doc_subtype, vl_patrim_liq, raw)
          VALUES ('33333333000191','2024-01-01','complemento',100,
                  '{"Versao":"2","Outro":"x"}'::jsonb),
                 ('33333333000191','2024-01-01','geral',NULL,
                  '{"Nome_Fundo_Classe":"LEGACY"}'::jsonb),
                 ('33333333000191','2024-02-01','complemento',110,
                  '{"Versao":"abc"}'::jsonb);
          INSERT INTO cvm_fii_periodic (cnpj, doc_type, period_year, data_referencia, raw)
          VALUES ('33333333000191','dfin',2024,'2024-12-31','{"Versao":"3"}'::jsonb);

          -- Block 1 as production holds it: the ONE bond the old key kept for
          -- this fund-month, the rest of the bond only in raw. One malformed
          -- maturity must stay NULL, never guessed, and the row still survives.
          INSERT INTO cvm_fi_cda (cnpj, period, tp_aplic, tp_ativo, vl_merc_pos_final, raw)
          VALUES ('44444444000191','2026-08-01','Títulos Públicos','Título público federal',
                  318932.00,
                  '{"TP_FUNDO_CLASSE":"CLASSES - FIF","TP_NEGOC":"Para negociação","CD_ISIN":"BRSTNCNTB3D4","CD_SELIC":"760199","TP_TITPUB":"NOTAS DO TESOURO NACIONAL SERIE B","DT_VENC":"2050-08-15","QT_POS_FINAL":"80.000000"}'::jsonb),
                 ('44444444000191','2015-06-01','Títulos Públicos','Título público federal',
                  10.00,
                  '{"TP_FUNDO":"FI","TP_NEGOC":"Para negociação","CD_ISIN":"BRSTNCLTN4X1","DT_VENC":"2017-02-30"}'::jsonb);

          -- What broke the first production apply of 49: FIIM rows an old
          -- member-selection bug put here, tp_ativo NULL and no CD_ISIN,
          -- repeated because the old NULLS DISTINCT key never matched them.
          -- Both must survive the key swap (nothing is deleted).
          INSERT INTO cvm_fi_cda (cnpj, period, tp_aplic, tp_ativo, vl_merc_pos_final, raw)
          VALUES ('10406600000108','2020-01-01','VALORES A RECEBER',NULL,1.00,
                  '{"TP_FUNDO":"FIIM","CD_ATIVO":"VALORES A RECEBER","TP_NEGOC":"Para negociação"}'::jsonb),
                 ('10406600000108','2020-01-01','VALORES A RECEBER',NULL,1.00,
                  '{"TP_FUNDO":"FIIM","CD_ATIVO":"VALORES A RECEBER","TP_NEGOC":"Para negociação"}'::jsonb);

          -- SECURIT as production holds it before 52. CRA/CRI rows have a NULL
          -- CNPJ and CNPJ_Emissora is NOT in raw (ingest stripped it), so the
          -- CNPJ can only come back from the re-ingest. The certificate and
          -- Versao are in raw. The OTS pair is one certificate-month filed
          -- twice with different values (real, 2026-03), which the old key
          -- kept apart by vl_emissao. One Versao is malformed (must stay NULL).
          INSERT INTO cvm_securit_mensal
              (instrument_type, period_year, cnpj_securit, dt_emissao, vl_emissao, vl_total, raw)
          VALUES ('cra_mensal',2026,NULL,'2026-01-01',604555695.63,604600612.97,
                  '{"Codigo_Identificacao_Certificado":"BRAPCSCRA0M6","Versao":"2"}'::jsonb),
                 ('cri_mensal',2026,NULL,'2026-01-01',1000.00,1000.00,
                  '{"Codigo_Identificacao_Certificado":"BRRBRACRI0K7","Versao":"abc"}'::jsonb),
                 ('ots_mensal',2026,'38042694000100','2026-03-31',1307676002.16,1310149686.28,
                  '{"Codigo_Identificacao_Certificado":"BRPCHSDBS131","Versao":"1"}'::jsonb),
                 ('ots_mensal',2026,'38042694000100','2026-03-31',1630849431.59,1626124050.89,
                  '{"Codigo_Identificacao_Certificado":"BRPCHSDBS131","Versao":"1"}'::jsonb);
          -- The old serie key had no Classe: one class per series survived.
          INSERT INTO cvm_securit_serie
              (instrument_type, cnpj_securit, codigo_identificacao, data_referencia,
               classe, numero_serie, valor_certificados, raw)
          VALUES ('cri_mensal',NULL,'BRAPCSCRIK26','2026-03-01','Sênior',1,25506706.26,
                  '{"Versao":"1"}'::jsonb),
                 ('cri_mensal',NULL,'BRAPCSCRIK26','2026-03-01','Subordinada',2,100.00,
                  '{"Versao":"1"}'::jsonb);
          -- The old dfin key kept ONE filing per year of each type.
          INSERT INTO cvm_securit_dfin (instrument_type, period_year, cnpj_securit, raw)
          VALUES ('dfin_cra',2026,NULL,
                  '{"Codigo_Identificacao_Certificado":"BRAPCSCRA0M6","Data_Referencia":"2026-06-30","Versao":"1"}'::jsonb),
                 ('dfin_cri',2026,NULL,
                  '{"Codigo_Identificacao_Certificado":"BRRBRACRI0K7","Data_Referencia":"2026-06-30","Versao":"2"}'::jsonb),
                 ('dfin_cri',2025,NULL,
                  '{"Codigo_Identificacao_Certificado":"BRRBRACRI0K7","Data_Referencia":"2025-02-30","Versao":"1"}'::jsonb);
          SEED

          echo "--- the upgrade: current schema.sql, every migration, then again ---"
          psql "$OLD_URL" -v ON_ERROR_STOP=1 -f src/store/schema.sql > /dev/null
          for f in $(ls src/store/migrations/*.sql | sort); do
            psql "$OLD_URL" -v ON_ERROR_STOP=1 -f "$f" > /dev/null
          done
          psql "$OLD_URL" -v ON_ERROR_STOP=1 -f src/store/schema.sql > /dev/null

          kept=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM cvm_fip_periodic;")
          uniq=$(psql "$OLD_URL" -tAc "SELECT count(DISTINCT row_hash) FROM cvm_fip_periodic;")
          recovered=$(psql "$OLD_URL" -tAc "SELECT coalesce(period::text,'-')||'/'||coalesce(classe_cota,'-') FROM cvm_fip_periodic WHERE cnpj='11111111111111';")
          acoes=$(psql "$OLD_URL" -tAc "SELECT coalesce(tp_fundo,'-') FROM cvm_fi_cda_acoes;")
          cotas=$(psql "$OLD_URL" -tAc "SELECT coalesce(tp_fundo,'-') FROM cvm_fi_cda_cotas WHERE cnpj='00068305000135';")
          echo "fip rows kept=$kept distinct row_hash=$uniq recovered=$recovered | cda tp_fundo=$acoes cotas=$cotas"

          test "$kept" = "15"  || { echo "FAIL: legacy rows lost by the upgrade"; exit 1; }
          test "$uniq" = "15"  || { echo "FAIL: legacy rows not distinguishable under the new key"; exit 1; }
          test "$recovered" = "2022-06-30/A" || { echo "FAIL: recovery did not read raw"; exit 1; }
          test "$acoes" = "FI" || { echo "FAIL: cda tp_fundo not recovered from raw"; exit 1; }
          test "$cotas" = "FI" || { echo "FAIL: cda cotas tp_fundo not recovered from raw"; exit 1; }

          echo "--- FII: versao backfilled from raw, then a restatement is KEPT (migration 43) ---"
          fii=$(psql "$OLD_URL" -tAc "SELECT string_agg(doc_subtype||'@'||period||'='||coalesce(versao::text,'-')||'/'||(raw ? 'Versao')::text, ',' ORDER BY period, doc_subtype) FROM cvm_fii_mensal WHERE cnpj='33333333000191';")
          per=$(psql "$OLD_URL" -tAc "SELECT coalesce(versao::text,'-') FROM cvm_fii_periodic WHERE cnpj='33333333000191';")
          echo "fii mensal=$fii periodic=$per"
          test "$fii" = "complemento@2024-01-01=2/false,geral@2024-01-01=-/false,complemento@2024-02-01=-/true" \
            || { echo "FAIL: cvm_fii_mensal versao backfill"; exit 1; }
          test "$per" = "3" || { echo "FAIL: cvm_fii_periodic versao backfill"; exit 1; }

          echo "--- CDA block 1: bond backfilled from raw, then the refill MERGES (migration 49) ---"
          cda=$(psql "$OLD_URL" -tAc "SELECT string_agg(period||'='||coalesce(cd_isin,'-')||'/'||coalesce(tp_fundo,'-')||'/'||coalesce(dt_venc::text,'-')||'/'||coalesce(qt_pos_final::text,'-'), ',' ORDER BY period) FROM cvm_fi_cda WHERE cnpj='44444444000191';")
          echo "cda block1=$cda"
          test "$cda" = "2015-06-01=BRSTNCLTN4X1/FI/-/-,2026-08-01=BRSTNCNTB3D4/CLASSES - FIF/2050-08-15/80.000000" \
            || { echo "FAIL: cvm_fi_cda bond backfill"; exit 1; }
          # The refill: the surviving NTN-B again (must merge) plus the LFT the
          # old key had dropped (must be added). Twice, so it is idempotent.
          for _ in 1 2; do
            psql "$OLD_URL" -v ON_ERROR_STOP=1 -q <<'UPSERT'
          INSERT INTO cvm_fi_cda (cnpj, period, tp_fundo, tp_aplic, tp_ativo, cd_isin, tp_negoc, vl_merc_pos_final, raw)
          VALUES ('44444444000191','2026-08-01','CLASSES - FIF','Títulos Públicos','Título público federal','BRSTNCNTB3D4','Para negociação',318932.00,'{}'::jsonb),
                 ('44444444000191','2026-08-01','CLASSES - FIF','Títulos Públicos','Título público federal','BRSTNCLF1RK7','Para negociação',3024098.48,'{}'::jsonb)
          ON CONFLICT (cnpj, period, tp_fundo, tp_aplic, tp_ativo, cd_isin, tp_negoc)
          DO UPDATE SET vl_merc_pos_final = EXCLUDED.vl_merc_pos_final, raw = EXCLUDED.raw;
          UPSERT
          done
          cda_n=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM cvm_fi_cda WHERE cnpj='44444444000191' AND period='2026-08-01';")
          echo "cda block1 rows after refill=$cda_n"
          test "$cda_n" = "2" || { echo "FAIL: refill duplicated or dropped a bond (got $cda_n, want 2)"; exit 1; }
          fiim_n=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM cvm_fi_cda WHERE cnpj='10406600000108';")
          test "$fiim_n" = "2" || { echo "FAIL: legacy FIIM rows lost by the key swap (got $fiim_n)"; exit 1; }
          # The pipeline's upsert, twice (idempotent), for a restatement (v3)
          # and for the first versioned write of a legacy NULL-versao filing.
          for _ in 1 2; do
            psql "$OLD_URL" -v ON_ERROR_STOP=1 -q <<'UPSERT'
          INSERT INTO cvm_fii_mensal (cnpj, period, doc_subtype, versao, vl_patrim_liq, raw)
          VALUES ('33333333000191','2024-01-01','complemento',3,120,'{}'::jsonb),
                 ('33333333000191','2024-01-01','geral',1,NULL,'{}'::jsonb)
          ON CONFLICT (cnpj, period, doc_subtype, versao)
          DO UPDATE SET vl_patrim_liq = EXCLUDED.vl_patrim_liq, raw = EXCLUDED.raw;
          UPSERT
          done
          stored=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM cvm_fii_mensal WHERE cnpj='33333333000191';")
          latest=$(psql "$OLD_URL" -tAc "SELECT string_agg(doc_subtype||'@'||period||'='||coalesce(versao::text,'-'), ',' ORDER BY period, doc_subtype) FROM vw_fii_mensal_latest WHERE cnpj='33333333000191';")
          nobs=$(psql "$OLD_URL" -tAc "SELECT n_obs FROM instrument_activity WHERE entity_type='fii' AND cnpj='33333333000191';")
          echo "fii stored=$stored latest=$latest instrument_activity.n_obs=$nobs"
          test "$stored" = "5" || { echo "FAIL: a version was overwritten or duplicated"; exit 1; }
          test "$latest" = "complemento@2024-01-01=3,geral@2024-01-01=1,complemento@2024-02-01=-" \
            || { echo "FAIL: vw_fii_mensal_latest is not one row per filing, latest version"; exit 1; }
          test "$nobs" = "3" || { echo "FAIL: instrument_activity counts versions, not filings"; exit 1; }

          echo "--- SECURIT: keys backfilled from raw, then the re-ingest MERGES (migration 52) ---"
          sm=$(psql "$OLD_URL" -tAc "SELECT string_agg(instrument_type||':'||coalesce(codigo_identificacao,'-')||'/'||coalesce(versao::text,'-')||'#'||occurrence, ',' ORDER BY instrument_type, vl_emissao) FROM cvm_securit_mensal;")
          ss=$(psql "$OLD_URL" -tAc "SELECT string_agg(classe||'#'||occurrence||'/'||coalesce(versao::text,'-'), ',' ORDER BY numero_serie) FROM cvm_securit_serie;")
          sd=$(psql "$OLD_URL" -tAc "SELECT string_agg(instrument_type||':'||coalesce(codigo_identificacao,'-')||'@'||coalesce(data_referencia::text,'-')||'/'||coalesce(versao::text,'-')||'#'||occurrence, ',' ORDER BY instrument_type, period_year) FROM cvm_securit_dfin;")
          keys=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM pg_constraint WHERE conname IN ('uq_securit_mensal','uq_securit_serie','uq_securit_dfin') AND pg_get_constraintdef(oid) ILIKE '%occurrence%' AND pg_get_constraintdef(oid) NOT ILIKE '%cnpj_securit%';")
          echo "securit mensal=$sm serie=$ss dfin=$sd new_keys=$keys"
          test "$sm" = "cra_mensal:BRAPCSCRA0M6/2#1,cri_mensal:BRRBRACRI0K7/-#1,ots_mensal:BRPCHSDBS131/1#1,ots_mensal:BRPCHSDBS131/1#2" \
            || { echo "FAIL: cvm_securit_mensal backfill or numbering"; exit 1; }
          test "$ss" = "Sênior#1/-,Subordinada#1/-" || { echo "FAIL: cvm_securit_serie rows changed by the upgrade"; exit 1; }
          test "$sd" = "dfin_cra:BRAPCSCRA0M6@2026-06-30/1#1,dfin_cri:BRRBRACRI0K7@-/1#1,dfin_cri:BRRBRACRI0K7@2026-06-30/2#1" \
            || { echo "FAIL: cvm_securit_dfin backfill"; exit 1; }
          test "$keys" = "3" || { echo "FAIL: a securit key was not swapped"; exit 1; }
          # The re-ingest, as upsert_rows sends it, twice (idempotent): each
          # existing row gets its CNPJ in place, and the rows the old keys had
          # dropped are added. Nothing may land beside a NULL-CNPJ twin.
          for _ in 1 2; do
            psql "$OLD_URL" -v ON_ERROR_STOP=1 -q <<'UPSERT'
          INSERT INTO cvm_securit_mensal (instrument_type, period_year, cnpj_securit, codigo_identificacao, versao, dt_emissao, vl_emissao, occurrence, raw)
          VALUES ('cra_mensal',2026,'02773542000122','BRAPCSCRA0M6',2,'2026-01-01',604555695.63,1,'{}'::jsonb),
                 ('cra_mensal',2026,'02773542000122','BRAPCSCRA0N4',1,'2026-01-01',604555695.63,1,'{}'::jsonb)
          ON CONFLICT (instrument_type, codigo_identificacao, dt_emissao, occurrence)
          DO UPDATE SET cnpj_securit = EXCLUDED.cnpj_securit, versao = EXCLUDED.versao, raw = EXCLUDED.raw;
          INSERT INTO cvm_securit_serie (instrument_type, cnpj_securit, codigo_identificacao, data_referencia, numero_serie, classe, versao, occurrence, raw)
          VALUES ('cri_mensal','12130744000100','BRAPCSCRIK26','2026-03-01',1,'Sênior',1,1,'{}'::jsonb),
                 ('cri_mensal','12130744000100','BRAPCSCRIK26','2026-03-01',1,'Sênior',1,2,'{}'::jsonb),
                 ('cri_mensal','12130744000100','BRAPCSCRIK26','2026-03-01',1,'Subordinada',1,1,'{}'::jsonb),
                 ('cri_mensal','12130744000100','BRAPCSCRIK26','2026-03-01',2,'Subordinada',1,1,'{}'::jsonb)
          ON CONFLICT (instrument_type, codigo_identificacao, data_referencia, numero_serie, classe, occurrence)
          DO UPDATE SET cnpj_securit = EXCLUDED.cnpj_securit, versao = EXCLUDED.versao, raw = EXCLUDED.raw;
          INSERT INTO cvm_securit_dfin (instrument_type, period_year, cnpj_securit, codigo_identificacao, data_referencia, versao, occurrence, raw)
          VALUES ('dfin_cri',2026,'02773542000122','BRRBRACRI0K7','2026-06-30',2,1,'{}'::jsonb),
                 ('dfin_cri',2026,'02773542000122','BRRBRACRI0K8','2026-06-30',1,1,'{}'::jsonb)
          ON CONFLICT (instrument_type, codigo_identificacao, data_referencia, occurrence)
          DO UPDATE SET cnpj_securit = EXCLUDED.cnpj_securit, versao = EXCLUDED.versao, raw = EXCLUDED.raw;
          UPSERT
          done
          n=$(psql "$OLD_URL" -tAc "SELECT (SELECT count(*) FROM cvm_securit_mensal)||'/'||(SELECT count(*) FROM cvm_securit_serie)||'/'||(SELECT count(*) FROM cvm_securit_dfin);")
          nulls=$(psql "$OLD_URL" -tAc "SELECT (SELECT count(*) FROM cvm_securit_mensal WHERE instrument_type='cra_mensal' AND cnpj_securit IS NULL)+(SELECT count(*) FROM cvm_securit_serie WHERE cnpj_securit IS NULL)+(SELECT count(*) FROM cvm_securit_dfin WHERE period_year=2026 AND instrument_type='dfin_cri' AND cnpj_securit IS NULL);")
          echo "securit rows after re-ingest mensal/serie/dfin=$n null-CNPJ twins=$nulls"
          test "$n" = "5/4/4" || { echo "FAIL: the securit re-ingest duplicated or dropped a row (got $n, want 5/4/4)"; exit 1; }
          test "$nulls" = "0" || { echo "FAIL: a re-ingested securit row kept a NULL-CNPJ twin"; exit 1; }

          echo "--- re-apply 33 on the live-shaped unique (Backfill #24) ---"
          # Two rows unique under the wide key: one already has tp_fundo='FI'
          # and tp_negoc NULL, raw stripped (what ingest writes today); the
          # other is already (NULL, NULL). The pre-#173 UPDATE matched the FI
          # row on tp_negoc IS NULL and reset it to (NULL, NULL). Both rows
          # use empty raw so this is the wipe, not a remnant-fill-into-sibling.
          psql "$OLD_URL" -v ON_ERROR_STOP=1 <<'LIVE'
          INSERT INTO cvm_fi_cda_cotas
              (cnpj, period, cnpj_cota, tp_fundo, tp_aplic, tp_negoc, raw)
          VALUES
              ('32300050000180','2023-10-01','43809974000123','FI',
               'Cotas de Fundos',NULL,'{}'::jsonb),
              ('32300050000180','2023-10-01','43809974000123',NULL,
               'Cotas de Fundos',NULL,'{}'::jsonb);
          LIVE
          psql "$OLD_URL" -v ON_ERROR_STOP=1 -f src/store/migrations/33_cda_holdings_key_widening.sql > /dev/null
          live_keys=$(psql "$OLD_URL" -tAc "SELECT string_agg(coalesce(tp_fundo,'-'), ',' ORDER BY tp_fundo NULLS LAST) FROM cvm_fi_cda_cotas WHERE cnpj='32300050000180';")
          live_n=$(psql "$OLD_URL" -tAc "SELECT count(*) FROM cvm_fi_cda_cotas WHERE cnpj='32300050000180';")
          echo "backfill24 keys=$live_keys n=$live_n"
          test "$live_n" = "2" || { echo "FAIL: Backfill #24 replay lost a cotas row"; exit 1; }
          test "$live_keys" = "FI,-" || { echo "FAIL: Backfill #24 replay wiped tp_fundo (got $live_keys)"; exit 1; }

      # fact_fund_monthly's FIP branch is keyed (cnpj, period, entity_type) with
      # period forced to Dec-31, and it used to select cvm_fip_periodic straight.
      # That was unique per fund-year only because the OLD key discarded the rest
      # of each yearly file. Once migration 34 rekeyed the table and the backfill
      # restored those rows, production got:
      #
      #     ERROR: could not create unique index "ix_fact_fund_monthly_pk"
      #     DETAIL: Key (cnpj, period, entity_type)
      #             = (49930492000103, 2024-12-31, fip) is duplicated.
      #
      # The analytical apply below runs against an empty database, so it could
      # not have caught that. Seeding the shape first makes the apply itself the
      # test: several periods in one year (only the latest belongs at an annual
      # grain), several classes at that period (additive — they are parts of one
      # fund), a second doc_type at the same period (must not double count), and
      # a row migration 34 left undated (must not win the pick).
      - name: Seed the FIP shape that broke fact_fund_monthly
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO cvm_fip_periodic
              (cnpj, doc_type, period_year, period, classe_cota, vl_patrim_liq, raw)
          VALUES
              ('49930492000103','informe',2024,'2024-06-30','A',100,'{}'::jsonb),
              ('49930492000103','informe',2024,'2024-06-30','B', 10,'{}'::jsonb),
              ('49930492000103','informe',2024,'2024-12-31','A',200,'{}'::jsonb),
              ('49930492000103','informe',2024,'2024-12-31','B', 20,'{}'::jsonb),
              ('49930492000103','anual',  2024,'2024-12-31','A',200,'{}'::jsonb),
              ('49930492000103','informe',2024, NULL,       'A',999,'{}'::jsonb);
          SQL

      # Daily CVM Ingest #207 (run 33535880218) died during CREATE of
      # fact_fund_monthly with `connection to server was lost` at the
      # statement's closing semicolon — not the FIP unique-index error #177
      # fixed. The expensive shape is FI daily: several subclasses, several
      # days, a null-PL day that still has flow, and an ETF CNPJ that must
      # not leak into the fund fact. An empty database cannot catch a rewrite
      # that double-counts subclass flows or drops the null-PL day.
      - name: Seed the FI daily shape that #207 was aggregating
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO cvm_etf_registry (ticker, cnpj, fund_name)
          VALUES ('FAKE11', '22222222000182', 'carved-out ETF');

          INSERT INTO cvm_fi_diario
              (cnpj, id_subclasse, dt_comptc, vl_patrim_liq, vl_quota, nr_cotst,
               captc_dia, resg_dia, raw)
          VALUES
              -- subclass A, three days; 16th has PL, 15th has flow but no PL
              ('11111111000191','A','2024-12-02',100, 1.0, 10, 5, 1, '{}'::jsonb),
              ('11111111000191','A','2024-12-15',NULL,1.05,10, 7, 0, '{}'::jsonb),
              ('11111111000191','A','2024-12-16',110, 1.1, 11, 3, 0, '{}'::jsonb),
              ('11111111000191','A','2024-12-31',200, 2.0, 20, 0, 2, '{}'::jsonb),
              -- subclass B, two days; smaller than A in the latest month
              ('11111111000191','B','2024-12-02', 50,10.0,  2, 1, 0, '{}'::jsonb),
              ('11111111000191','B','2024-12-31', 80,16.0,  3, 0, 1, '{}'::jsonb),
              -- ETF: same month, must not appear in fact_fund_monthly
              ('22222222000182','','2024-12-31',9999,1, 1, 0, 0, '{}'::jsonb);
          SQL

      - name: Apply analytical layer (empty-DB bypass)
        run: PGOPTIONS="-c silo.ci_smoke_bypass=on" bash scripts/apply_analytical.sh

      # The apply above already fails if the branch emits duplicates. This also
      # pins the VALUE, because the two ways of getting one row are not equally
      # correct: summing across periods would report Q2+Q4 as year-end AUM, and
      # picking one class would report a share class as the whole fund.
      - name: FIP collapses to one row per fund-year, with classes summed
        run: |
          set -euo pipefail
          got=$(psql "$POSTGRES_URL" -tAc "SELECT count(*)||'/'||coalesce(sum(vl_patrim_liq)::text,'-')
                                             FROM fact_fund_monthly
                                            WHERE entity_type='fip'
                                              AND cnpj='49930492000103';")
          echo "fip rows/PL = $got (expected 1/220.00 — latest period 200+20)"
          test "$got" = "1/220.00" || {
            echo "FAIL: the FIP branch no longer yields one summed row per fund-year"; exit 1; }

      # Pins the FI rewrite that #207 forced: one scan must still (a) sum last-
      # day PL across subclasses, (b) follow the larger subclass's quota,
      # (c) include flow from a null-PL day, (d) exclude the ETF CNPJ.
      # Expected: PL 200+80=280, quota 2.0 (A is larger), cotistas 20+3=23,
      # captc 5+7+3+1=16, resg 1+0+2+0+1=4, period = first of month.
      - name: FI daily collapses to one row per fund-month, flows include null-PL days
        run: |
          set -euo pipefail
          ok=$(psql "$POSTGRES_URL" -tAc "
            SELECT COUNT(*) = 1
               AND SUM(vl_patrim_liq) = 280
               AND MAX(vl_quota) = 2
               AND SUM(nr_cotst) = 23
               AND SUM(captc_mes) = 16
               AND SUM(resg_mes) = 4
               AND MIN(period) = DATE '2024-12-01'
              FROM fact_fund_monthly
             WHERE entity_type = 'fi'
               AND cnpj = '11111111000191';")
          echo "fi aggregate match = $ok (expected t)"
          test "$ok" = "t" || {
            psql "$POSTGRES_URL" -c "SELECT cnpj, period, vl_patrim_liq, vl_quota,
                   nr_cotst, captc_mes, resg_mes, quota_subclass_id
              FROM fact_fund_monthly WHERE cnpj='11111111000191';"
            echo "FAIL: the FI branch no longer aggregates subclasses + null-PL flows"; exit 1; }
          etf=$(psql "$POSTGRES_URL" -tAc "SELECT count(*) FROM fact_fund_monthly
                                            WHERE cnpj='22222222000182';")
          test "$etf" = "0" || {
            echo "FAIL: ETF CNPJ leaked into fact_fund_monthly"; exit 1; }

      # The tier helpers decide how much an anonymous caller may pull. Regex
      # tests over the SQL text prove the code says the right thing; only
      # executing it proves it DOES the right thing — in particular that
      # request.jwt.claims survives the SECURITY DEFINER switch, which is the
      # single assumption the whole tier design rests on.
      - name: Caller tiers behave (executed, not just compiled)
        run: |
          set -euo pipefail
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n INT;
          BEGIN
            -- Fail closed: anything short of a well-formed authenticated
            -- claim must resolve to the anonymous tier.
            PERFORM set_config('request.jwt.claims', '', true);
            ASSERT api.caller_tier() = 'anon', 'empty claims must be anon';
            PERFORM set_config('request.jwt.claims', 'not json', true);
            ASSERT api.caller_tier() = 'anon', 'malformed claims must be anon';
            PERFORM set_config('request.jwt.claims', '{"nope":1}', true);
            ASSERT api.caller_tier() = 'anon', 'claims without a role must be anon';
            PERFORM set_config('request.jwt.claims', '{"role":"service_role"}', true);
            ASSERT api.caller_tier() = 'anon', 'only authenticated is the raised tier';
            PERFORM set_config('request.jwt.claims', '{"role":"authenticated"}', true);
            ASSERT api.caller_tier() = 'authenticated', 'a signed-in caller must be recognised';

            -- Anonymous ceiling: 3 ids.
            PERFORM set_config('request.jwt.claims', '{"role":"anon"}', true);
            SELECT array_length(api.assert_panel_ids('{A,B,C}'::text[]), 1) INTO n;
            ASSERT n = 3, 'anon must be allowed 3 ids';
            BEGIN
              PERFORM api.assert_panel_ids('{A,B,C,D}'::text[]);
              RAISE EXCEPTION 'anon was allowed 4 ids';
            EXCEPTION WHEN sqlstate '22023' THEN NULL;
            END;

            -- Signed-in ceiling: 50 ids.
            PERFORM set_config('request.jwt.claims', '{"role":"authenticated"}', true);
            SELECT array_length(
              api.assert_panel_ids(ARRAY(SELECT 'T' || g FROM generate_series(1,50) g)), 1
            ) INTO n;
            ASSERT n = 50, 'authenticated must be allowed 50 ids';
            BEGIN
              PERFORM api.assert_panel_ids(ARRAY(SELECT 'T' || g FROM generate_series(1,51) g));
              RAISE EXCEPTION 'authenticated was allowed 51 ids';
            EXCEPTION WHEN sqlstate '22023' THEN NULL;
            END;

            -- An empty panel is a legitimate request, not a violation.
            PERFORM api.assert_panel_ids('{}'::text[]);

            RAISE NOTICE 'caller tiers OK';
          END $$;
          SQL

      # The /fi CDA anchor (#476), executed: the two dashboard sources run over
      # a temp cvm_fi_cda whose newest months are filed thin, and must stop at
      # the last complete month, move up when CVM completes one, and still emit
      # their safety row on an empty table. Rolled back.
      - name: /fi CDA anchor behaves (executed, not just compiled)
        run: psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f tests/sql/fi_cda_anchor_behaviour.sql

      # The research price contract (#410), executed on synthetic tickers:
      # the series crosses boards, close_adj adjusts splits / groupings /
      # bonuses and is the same in any window, every refusal carries its
      # reason, and the 1000-row page edge pages without a gap. The file seeds
      # and asserts inside one transaction and rolls back.
      - name: quote_history behaves (executed, not just compiled)
        run: psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f tests/sql/quote_history_behaviour.sql

      # vw_company_ticker.is_active (migration 63, #381): a ticker absent from
      # the company's newest FCA filing is inactive. Synthetic CNPJs inside a
      # transaction that is rolled back.
      - name: vw_company_ticker.is_active behaves (executed, not just compiled)
        run: psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f tests/sql/company_ticker_active_behaviour.sql

      # The portfolio-diagnosis reads (31_api_portfolio.sql, catalog v51),
      # executed on synthetic funds: the resolver picks by quota and flags what
      # it cannot separate, the fee estimate handles the fiscal-year reset and
      # stays apart from the disclosed fee, the look-through recurses with a
      # cycle guard and a depth cap, every call refuses at its page edge, and
      # anon can call all three. Rolled back.
      - name: portfolio reads behave (executed, not just compiled)
        run: psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f tests/sql/portfolio_behaviour.sql

      # B3's FORWARD segment (32_api_trade_consolidated.sql, catalog v65),
      # executed on a synthetic ticker: an unknown ticker and a NULL window
      # refuse, an untraded session carries only ref_price, the page edge
      # refuses and the cursor walks every row once. Rolled back.
      - name: trade_consolidated_history behaves (executed, not just compiled)
        run: psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f tests/sql/trade_consolidated_history_behaviour.sql

      # Credit retrieval vintages: as-of reads keep revisions and removals,
      # incomplete captures refuse, and raw observations stay private.
      - name: credit capture vintages behave (executed, not just compiled)
        run: psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f tests/sql/b3_credit_behaviour.sql

      # Own Python, not the runner's system one: Ubuntu's /usr/bin/python3 is
      # PEP 668 externally-managed, so a bare `pip install` there is one image
      # bump away from failing.
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # openapi.json is GENERATED from this very catalog — scripts/gen_openapi.py
      # reads pg_get_function_arguments, information_schema.columns and the
      # granted-to-anon privilege set, so the published API reference cannot
      # describe an endpoint the SQL does not grant. Regenerating here and
      # diffing closes the last manual step: before this, bumping
      # CATALOG_VERSION or editing a COMMENT meant owning a database, and a
      # contributor who had none simply shipped a stale spec.
      #
      # This is the SECOND of two guards, and it catches strictly more.
      # tests/test_openapi_spec.py runs offline against the SQL *text*: it sees
      # a granted object missing from the spec, a spec path the SQL no longer
      # grants, and RPC argument-name drift. It cannot see anything that only
      # the built catalog knows — a changed view column list, a re-typed
      # argument, a rewritten COMMENT, a new DEFAULT. Those land here.
      #
      # Placed after the tier checks so a spec is only compared once the api
      # schema it describes has been proven to build AND behave. gen_openapi.py
      # imports only psycopg2, so that is all this installs.
      #
      # Version-independent: the spec generated on postgres:15 (this job's
      # image) was verified byte-identical to the committed one, generated on
      # 16. pg_get_function_arguments and information_schema render the same.
      - name: openapi.json still matches the catalog
        run: |
          set -euo pipefail
          pip install --quiet --disable-pip-version-check "psycopg2-binary>=2.9"
          python3 scripts/gen_openapi.py > /tmp/openapi.generated.json
          if ! diff -u openapi.json /tmp/openapi.generated.json; then
            echo
            echo "FAIL: openapi.json is stale — the catalog and the published spec disagree."
            echo "The diff above is what changed. Regenerate, never hand-edit:"
            echo "    POSTGRES_URL=... python scripts/gen_openapi.py > openapi.json"
            exit 1
          fi
          echo "openapi.json matches the catalog ($(python3 -c "import json;print(len(json.load(open('openapi.json'))['paths']))") paths)"

      # Both Evidence sites, not just dashboard/. webapp/ was uncovered until
      # 2026-09-17: its source queries run against this same Postgres at
      # `evidence sources` time, so a typo in one failed the site build with
      # nothing in CI having executed it. The glob is per-site rather than a
      # recursive find so a new Evidence project has to be added here
      # deliberately, with its connection reviewed.
      - name: Compile every Evidence source query (dashboard + webapp)
        run: |
          set -uo pipefail
          failed=()
          shopt -s nullglob
          files=(dashboard/sources/supabase/*.sql webapp/sources/supabase/*.sql)
          for f in "${files[@]}"; do
            if ! out=$(psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -q -f "$f" 2>&1 >/dev/null); then
              failed+=("$f")
              echo "FAIL $f"
              sed 's/^/       /' <<<"$out" | tail -4
            fi
          done
          echo "checked ${#files[@]} sources, ${#failed[@]} failed"
          [ ${#failed[@]} -eq 0 ]

  api-smoke:
    name: api.* smoke (read-only)
    if: github.event_name == 'workflow_dispatch' && inputs.run_api_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Smoke api.coverage / quote_latest / panel
        run: |
          set -euo pipefail
          if [ -z "${POSTGRES_URL:-}" ]; then
            echo "POSTGRES_URL secret is missing" >&2
            exit 1
          fi
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SET default_transaction_read_only = on;

          \echo === api.coverage ===
          SELECT * FROM api.coverage();

          \echo === api.quote_latest(PETR4) ===
          SELECT ticker, trade_date, close, source
          FROM api.quote_latest('PETR4');

          \echo === api.panel PETR4 close month ===
          SELECT id, date, metric, value, source
          FROM api.panel(
            ARRAY['PETR4']::text[],
            ARRAY['close']::text[],
            CURRENT_DATE - 365,
            CURRENT_DATE,
            'month'
          )
          LIMIT 5;
          SQL

          n=$(psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -qAt \
            -c "SET default_transaction_read_only = on" \
            -c "SELECT COUNT(*) FROM api.quote_latest('PETR4')")
          n=$(echo "$n" | tr -d '[:space:]')
          if [ "$n" = "0" ]; then
            echo "notice: quote_latest(PETR4) returned 0 rows (daily-only COTAHIST until b3-backfill). SQL succeeded."
          fi
