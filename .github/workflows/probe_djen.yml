name: Probe DJEN

# Read-only spike for issue #843 (epic #841): can a GitHub-hosted runner reach
# DJEN, CNJ's Diário de Justiça Eletrônico Nacional, and can it isolate RJ
# editais? DJEN answered CloudFront 403 "blocked from your country" to a cloud
# session on 2026-10-12; a GitHub runner was not tested.
#
# scripts/probe_djen.py prints the HTTP status, counts and field names only,
# never party names or texts, because this log is public. Nothing is stored.
# No secrets, no POSTGRES_URL, no database, contents: read. Dispatch only;
# nothing schedules it. A blocked runner fails the job with the status code.
# mode=proxies tries published free Brazilian proxies (TLS verified end to end)
# and fails the job when none answers HTTP 200 in every round.
# mode=urls fetches the state RJ list pages of #846 (or `urls`) and prints the
# status and counts (CNJ numbers, PDF links) only; it fails when one is not 200.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "reach = one small query; sample = counts per tribunal over a window; proxies = try free BR proxies; urls = state RJ list pages"
        required: true
        default: reach
        type: choice
        options: [reach, sample, proxies, urls]
      start:
        description: "sample: first day (YYYY-MM-DD)"
        required: false
        default: "2026-09-01"
        type: string
      end:
        description: "sample: last day (YYYY-MM-DD)"
        required: false
        default: "2026-09-30"
        type: string
      tribunals:
        description: "sample: space-separated siglas"
        required: false
        default: "TJSP TJRJ TJMG TJRS TJPR TJSC"
        type: string
      urls:
        description: "urls: space-separated pages (empty = the state RJ lists of #846)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: probe-djen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Runner egress
        run: curl -sS --max-time 20 https://ipinfo.io/country || echo "(country lookup unavailable)"
      - name: Probe DJEN
        env:
          MODE: ${{ inputs.mode }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TRIBUNALS: ${{ inputs.tribunals }}
          URLS: ${{ inputs.urls }}
        run: |
          if [ "$MODE" = "urls" ]; then
            # shellcheck disable=SC2086  # URLS is a word list on purpose
            python -u scripts/probe_djen.py urls $URLS
          elif [ "$MODE" = "proxies" ]; then
            python -u scripts/probe_djen.py proxies --rounds 3
          elif [ "$MODE" = "sample" ]; then
            # shellcheck disable=SC2086  # TRIBUNALS is a word list on purpose
            python -u scripts/probe_djen.py sample --start "$START" --end "$END" --tribunals $TRIBUNALS
          else
            python -u scripts/probe_djen.py reach
          fi
