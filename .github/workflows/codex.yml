name: Codex issue responder and Builder

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the eligible Builder queue without claiming or calling Codex
        type: boolean
        default: true
  schedule:
    - cron: '0 13 * * 3' # Wednesday 10:00 UTC-3 (13:00 UTC); gated until validated.

permissions:
  contents: read

# Serialize Codex claims. Other agents still use the cooperative GitHub claim.
concurrency:
  group: codex-issue-worker
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'schedule' && vars.CODEX_BUILDER_ENABLED == 'true') ||
      (github.event_name == 'issues' && github.event.issue.user.type == 'User' &&
       (contains(github.event.issue.body, '@codex') || contains(github.event.issue.title, '@codex'))) ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type == 'User' && contains(github.event.comment.body, '@codex'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      run: ${{ steps.prepare.outputs.run }}
      mode: ${{ steps.prepare.outputs.mode }}
      number: ${{ steps.prepare.outputs.number }}
      branch: ${{ steps.prepare.outputs.branch }}
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check access, select queue and prepare context
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/codex/runner.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.run == 'true'
        with:
          name: codex-context
          path: |
            prompt.md
            context.json
          retention-days: 1

  model:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: codex-context
          path: ${{ runner.temp }}/codex-context
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: needs.prepare.outputs.mode == 'builder'
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        if: needs.prepare.outputs.mode == 'builder'
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare trusted Codex configuration and response directory
        run: |
          mkdir -p "$RUNNER_TEMP/codex-result" "$RUNNER_TEMP/codex-home"
          cp .github/codex/config.toml "$RUNNER_TEMP/codex-home/config.toml"
      - name: Run Codex without GitHub write credentials
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          prompt-file: ${{ runner.temp }}/codex-context/prompt.md
          output-file: ${{ runner.temp }}/codex-result/response.md
          sandbox: ${{ needs.prepare.outputs.mode == 'respond' && 'read-only' || 'workspace-write' }}
          safety-strategy: drop-sudo
      - name: Collect Builder patch
        if: needs.prepare.outputs.mode == 'builder'
        env:
          PATCH_PATH: ${{ runner.temp }}/codex-result/changes.patch
        run: |
          git add --intent-to-add -- .
          git diff --binary HEAD > "$PATCH_PATH"
      - name: Verify Builder offline suite
        if: needs.prepare.outputs.mode == 'builder'
        run: python -m pytest tests/ -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-result
          path: ${{ runner.temp }}/codex-result/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, model]
    if: always() && needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.model.result == 'success'
        with:
          name: codex-result
          path: result
      - name: Publish response or guarded draft PR; release failed claims
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.number }}
          MODE: ${{ needs.prepare.outputs.mode }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          MODEL_RESULT: ${{ needs.model.result }}
          BASE_SHA: ${{ needs.prepare.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/codex/runner.py publish
