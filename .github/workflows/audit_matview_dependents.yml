name: Audit Matview Dependents

# On-demand, read-only. apply_analytical.sh CASCADE-drops dim_fund,
# fact_fund_monthly, fact_security_monthly and mv_savings_flow_monthly
# before recreating them. A CASCADE is only safe when every dependent is
# also recreated in the same apply pass (or is disposable). This workflow
# discovers every matview in public/api at runtime and prints each
# dependent's full DDL so a new ad-hoc production object is visible
# before anyone writes another CASCADE.
#
# Read-only by construction — the script opens the connection with
# set_session(readonly=True) and only ever SELECTs.

on:
  workflow_dispatch:

jobs:
  audit:
    name: Audit matview dependents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Audit matview dependents
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: python scripts/audit_matview_dependents.py
