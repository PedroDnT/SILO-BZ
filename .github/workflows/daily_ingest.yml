name: Daily CVM Ingest

on:
  schedule:
    # 06:00 UTC = 03:00 BRT (before Brazilian market open)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
      entity:
        description: "CVM entity to backfill: fi | fidc | fii | fip | fiagro | securit (leave blank for all)"
        required: false
        default: ""
      start_year:
        description: "Backfill start year (mode=backfill only)"
        required: false
        default: "2019"
      end_year:
        description: "Backfill end year inclusive (mode=backfill only, leave blank for current year)"
        required: false
        default: ""

jobs:
  ingest:
    name: Ingest CVM + BACEN data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      CVM_DNS_NAMESERVERS: "1.1.1.1,8.8.8.8,9.9.9.9"
      TZ: "America/Sao_Paulo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install PostgreSQL client
        if: ${{ (inputs.mode || '') == 'backfill' }}
        run: |
          sudo apt-get install -y postgresql-client

      - name: Run daily update
        if: ${{ github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily') }}
        run: python -m src.pipeline.run_daily

      - name: Run historical backfill
        if: ${{ (github.event.inputs && github.event.inputs.mode == 'backfill') || github.event_name == 'schedule' }}
        run: |
          ENTITY_FLAG=""
          if [ -n "${{ inputs.entity }}" ]; then
            ENTITY_FLAG="--entity ${{ inputs.entity }}"
          fi
          END_YEAR_FLAG=""
          if [ -n "${{ inputs.end_year }}" ]; then
            END_YEAR_FLAG="--end-year ${{ inputs.end_year }}"
          python -m src.pipeline.run_backfill \
            --start-year ${{ inputs.start_year }} \
            $END_YEAR_FLAG \
            $ENTITY_FLAG \
            --cvm-only

      - name: Analyze tables post-ingest
        if: ${{ inputs.mode == 'backfill' || github.event_name == 'schedule' }}
        run: |
          psql "$POSTGRES_URL" -c "
            ANALYZE cvm_fi_diario;
            ANALYZE cvm_fidc_mensal;
            ANALYZE cvm_fidc_tranche;
            ANALYZE cvm_fii_mensal;
          "
