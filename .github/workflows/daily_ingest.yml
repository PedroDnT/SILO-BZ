name: Daily CVM Ingest

on:
  schedule:
    # 06:00 UTC = 03:00 BRT (before Brazilian market open)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - analytics-only
          - b3-backfill
          - b3-cash-dividends
          - b3-trade-consolidated
          - balancete-summary
          - cda-fund-name
          - cda-vacuum-full
      start_year:
        description: "First year of B3 COTAHIST yearly zips (mode=b3-backfill). Try 2025 first — yearly zips are large. With mode=b3-cash-dividends: the issuer universe is every code that printed since this year (use 2019); each issuer's full history is fetched. With mode=b3-trade-consolidated: every weekday from January 1 of this year (B3 kept sessions from 2025-06-10 when checked on 2026-09-30; earlier ones are logged skipped)."
        required: false
        default: "2025"
      end_year:
        description: "Last year of B3 COTAHIST yearly zips (mode=b3-backfill)."
        required: false
        default: "2026"
      rebuild_dashboard:
        description: "Also fire the Vercel deploy hook after this manual run (every scheduled run whose analytical apply succeeded fires it on its own). Publishes a PRODUCTION deployment of the dashboard at silo-bz-deloslabs.vercel.app — a 25–45 min Evidence build of SELECTs against the same Postgres — so leave it off for re-runs and experiments."
        type: boolean
        default: false

# One writer at a time against the shared Supabase Postgres. This group is
# shared with backfill.yml on purpose: overlapping ingest runs contend for the
# same tables, and long AccessShareLock readers are exactly what blocked the
# 2026-08-26 schema apply's ALTER TABLE until the server killed it. A run that
# arrives while another holds the group QUEUES (cancel-in-progress stays
# false — never kill an ingest mid-upsert; idempotent or not, half the audit
# rows would say 'ok' for slices that then re-run for no reason). GitHub keeps
# one queued run per group, which is the right semantics here: a daily that
# fires during a multi-hour backfill runs right after it instead of on top
# of it.
concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest CVM data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      # Optional: enables the etfsbrasil ETF NAV/price/cotistas scrape in run_daily.
      # When the secret is unset this is empty and the scrape step self-skips.
      APIFY_TOKEN: "${{ secrets.APIFY_TOKEN }}"
      CVM_DNS_NAMESERVERS: "1.1.1.1,8.8.8.8,9.9.9.9"
      # Optional repository variable: re-points the BACEN SGS host (issue #537). Empty means the default.
      BACEN_SGS_BASE_URL: "${{ vars.BACEN_SGS_BASE_URL }}"
      # "all" → fi, fidc, fip, fiagro, fii, securit. fii/securit monthly tables
      # (and the FII registry) are only refreshed daily under "all"; under "core"
      # they go stale and rely solely on manual backfills. Yearly entities only
      # re-fetch the current year daily, so runtime stays within timeout-minutes.
      CVM_DAILY_SCOPE: "all"
      CVM_UPSERT_CHUNK_SIZE: "5000"
      CVM_INGEST_CONCURRENCY: "6"
      # FI monthly ZIPs are large; cap their concurrency explicitly so the
      # higher general knob above doesn't spike memory / risk timeouts.
      CVM_FI_CONCURRENCY: "3"
      CVM_DAILY_CONCURRENCY: "8"
      TZ: "America/Sao_Paulo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      # Ask once whether CVM will talk to this runner before installing deps
      # or writing 44 error rows. Measured 2026-08-29: the 06:00 ingest spent
      # ~40 minutes proving the same connect refusal, logged every slice as
      # error, then DB Health failed on those unhealed rows. A later
      # analytics-only dispatch went green without fetching, and the Saturday
      # watchdog no-op'd because fi/inf_diario still had Friday's ok. ANY HTTP
      # response (including 404) passes; only a connect-level failure fails.
      # analytics-only / b3-backfill / b3-cash-dividends / b3-trade-consolidated
      # never touch CVM, so they skip this.
      - name: Probe dados.cvm.gov.br
        if: ${{ github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily') }}
        run: python scripts/check_cvm_reachable.py

      - name: Cache apt packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Bootstrap the schema on every path (scheduled, daily dispatch, backfill)
      # via the shared composite action, so a fresh/empty DB heals itself and no
      # ingest ever runs against a DB missing a migration. One definition, reused
      # by daily / watchdog / backfill — they can no longer drift apart.
      - name: Apply schema + migrations
        id: schema
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

      # NOT continue-on-error: a red source must keep the run red (the tracking
      # issue below and DB Health depend on it). It is also no longer a gate:
      # ANALYZE, the analytical apply and the deploy hook read steps.daily.outcome
      # and still run after it fails (issue #473). Rows that landed are committed
      # per slice, so the warehouse they refresh is as fresh as the sources that
      # did land.
      - name: Run daily update
        id: daily
        if: ${{ github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily') }}
        run: python -m src.pipeline.run_daily

      - name: Run B3 COTAHIST yearly backfill
        if: ${{ github.event.inputs && github.event.inputs.mode == 'b3-backfill' }}
        run: |
          python -m src.pipeline.run_backfill \
            --b3-only \
            --b3-start-year ${{ inputs.start_year }} \
            --end-year ${{ inputs.end_year }}

      # B3's full cash-distribution history (migration 51) for every issuer
      # that printed since start_year. The daily run only upserts the last 400
      # days; this is the one-off history load. Here rather than on an
      # operator's laptop so it uses the POSTGRES_URL secret. B3 is paced at
      # ~2 s a call, so ~450 issuers take roughly 30-60 min.
      - name: Run B3 cash-dividend history backfill
        if: ${{ github.event.inputs && github.event.inputs.mode == 'b3-cash-dividends' }}
        run: |
          python -m src.pipeline.run_backfill \
            --b3-cash-dividends-only \
            --b3-start-year ${{ inputs.start_year }}

      # B3's consolidated trade file, segment FORWARD (migration 57): the fixed
      # income ETFs COTAHIST does not carry. One ~6-9 MB file per weekday from
      # January 1 of start_year; sessions before B3's retention edge answer an
      # empty file and are logged skipped. About 330 sessions from 2025-06-10.
      - name: Run B3 consolidated trades backfill
        if: ${{ github.event.inputs && github.event.inputs.mode == 'b3-trade-consolidated' }}
        run: |
          python -m src.pipeline.run_backfill \
            --b3-trade-consolidated-start ${{ inputs.start_year }}-01-01

      # cvm_fi_balancete_resumo (migration 59) from the stored balancete, one
      # month per statement, 2019 to this month. SQL only, nothing is fetched
      # from CVM; idempotent. Prints rows upserted and balance-identity breaks
      # per month. About 92 months.
      - name: Build balancete summary from stored months
        if: ${{ github.event.inputs && github.event.inputs.mode == 'balancete-summary' }}
        run: python scripts/backfill_balancete_summary.py
      # Moves DENOM_SOCIAL out of raw on the stored CDA rows into
      # cvm_fi_cda_fund_name (migration 60), in ctid batches with a VACUUM
      # between chunks. Fails if any row still carries the name. Dispatch it
      # only after the balancete account table is dropped (disk headroom); a
      # run cut by the job timeout resumes on the next dispatch. Returning the
      # space to the OS (VACUUM FULL) is a separate, later step.
      - name: Move the CDA fund name out of raw
        if: ${{ github.event.inputs && github.event.inputs.mode == 'cda-fund-name' }}
        run: python scripts/strip_cda_fund_name.py

      # Returns the CDA tables' dead space to the operating system with VACUUM
      # FULL, one table at a time, smallest first. Each rewrite holds an ACCESS
      # EXCLUSIVE lock on its table (the holdings matview, the API and any
      # dashboard build that reads it block meanwhile) and needs free disk about
      # the size of the compacted table. Dispatch it only when no ingest or
      # dashboard build is running, and not within an hour of the 06:00 UTC run.
      - name: Rewrite the CDA tables (VACUUM FULL)
        if: ${{ github.event.inputs && github.event.inputs.mode == 'cda-vacuum-full' }}
        run: python scripts/strip_cda_fund_name.py --vacuum-full-only

      # Statistics only — it makes later queries plan better, it never changes a
      # row. continue-on-error because on 2026-08-28 it was the ONE step that
      # could abort this job: 20 ANALYZEs in a single psql string is a single
      # backend held open for minutes, and on a loaded instance the server
      # terminated it ("server closed the connection unexpectedly"). That failure
      # then skipped "Build / refresh analytical layer" — which has
      # continue-on-error precisely so it can't block the run — and prod stayed on
      # the previous catalog version. A stats refresh must never outrank the
      # thing it exists to speed up.
      #
      # Gate (issue #473): it runs after a FAILED `Run daily update` too, so one
      # red source no longer skips ANALYZE, the analytical apply and the deploy
      # hook. `steps.schema.outcome == 'success'` keeps it off when the schema
      # apply failed (a CVM probe failure skips the schema step too).
      # `steps.daily.outcome == 'failure' || success()` lets exactly one earlier
      # failure through, the daily update; a failed backfill step (the other
      # modes) still skips it, as before.
      #
      # One psql per table for the same reason: a terminated backend loses only
      # its own table instead of the other 19, and no single statement runs long
      # enough to look like a hung connection.
      - name: Analyze tables post-ingest
        if: ${{ !cancelled() && steps.schema.outcome == 'success' && (steps.daily.outcome == 'failure' || success()) && (github.event_name == 'schedule' || (github.event.inputs && (github.event.inputs.mode == 'daily' || github.event.inputs.mode == 'analytics-only' || github.event.inputs.mode == 'b3-backfill' || github.event.inputs.mode == 'b3-cash-dividends' || github.event.inputs.mode == 'b3-trade-consolidated'))) }}
        continue-on-error: true  # a killed ANALYZE only skips a stats refresh; no row changes
        run: |
          set +e
          failed=0
          for t in cvm_fi_diario cvm_fi_cda cvm_fi_perfil cvm_fi_balancete_resumo cvm_fi_lamina cvm_fi_extrato \
                   cvm_fidc_mensal cvm_fidc_tranche cvm_fidc_tranche_flows \
                   cvm_fidc_aging cvm_fidc_setor cvm_fidc_scr cvm_fidc_sacado \
                   cvm_fidc_cedente cvm_fiagro_mensal cvm_fip_periodic \
                   cvm_fii_mensal cvm_fii_periodic cvm_securit_mensal \
                   cvm_securit_serie cvm_securit_fluxo cvm_securit_dfin \
                   cvm_fund_registry cvm_etf_registry cvm_ingest_log b3_cotahist \
                   b3_trade_consolidated; do
            if psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -q -c "ANALYZE $t;"; then
              echo "analyzed $t"
            else
              echo "::warning::ANALYZE $t failed (statistics only, continuing)"
              failed=$((failed + 1))
            fi
          done
          echo "ANALYZE: $failed of 20 tables failed"

      # Build/refresh the analytical layer (dims, fact matviews, rankings, fraud
      # screens) after the data lands. Its matview re-create doubles as the daily
      # refresh, so downstream dashboards see fresh aggregates without a separate
      # cron. continue-on-error: an analytical hiccup (e.g. a smoke-check on a
      # slice that has no data yet) stays visible in the run summary but never
      # fails the ingest critical path — psql/POSTGRES_URL come from the steps above.
      #
      # mode=analytics-only exists because this step (unlike schema+migrations)
      # only runs on the scheduled cron — a PR that changes only RPC/matview SQL
      # has no fast way to push it otherwise, short of waiting for 06:00 UTC.
      # CVM history is backfill.yml, not a mode on this workflow.
      #
      # It runs after a failed `Run daily update` (issue #473), gated like
      # ANALYZE above. The run stays red because the daily step failed, and an
      # apply failure here still turns it red on its own. Accepted risk: with a
      # red source the matviews and the dashboard reflect partially fresh data
      # (that source may be a day old); `landed_at` and api.coverage() say which.
      - name: Build / refresh analytical layer
        id: analytical
        if: ${{ !cancelled() && steps.schema.outcome == 'success' && (steps.daily.outcome == 'failure' || success()) && (github.event_name == 'schedule' || (github.event.inputs && (github.event.inputs.mode == 'daily' || github.event.inputs.mode == 'analytics-only'))) }}
        # NOT continue-on-error. It was, and that is the only reason
        # 04_fact_fund_monthly.sql could fail on every apply from 2026-08-30
        # onwards while the run reported green and the dashboard rebuild fired
        # off a fact table that had not been rebuilt. apply_analytical.sh already
        # applies each file independently and reports "Applied: N Failures: M",
        # so a non-zero exit means a file genuinely did not apply — exactly the
        # kind of failure this repo requires to be raised rather than swallowed.
        # Ingested rows are already committed by this point, so failing here
        # costs no data; it costs a red run, which is the correct signal.
        run: bash scripts/apply_analytical.sh

      # The dashboard is a STATIC SNAPSHOT: `evidence sources` extracts Supabase
      # into parquet at build time, and the site then serves that parquet through
      # DuckDB in the browser. Fresh rows in Supabase therefore reach the site
      # only when a build runs.
      #
      # Every SCHEDULED run whose analytical apply succeeded fires the hook, even
      # when a source was red (decision 2026-09-14: the published snapshot must
      # never be more than a day behind the warehouse; issue #473).
      # Firing it HERE is also the cheapest possible timing: ingest and the
      # analytical layer are done, ANALYZE has just refreshed the statistics the
      # source queries plan against, and no other build is competing for the
      # database — the 2026-08-26 damage (four overlapping 45-minute timeouts
      # and a killed schema apply) came from CONCURRENT builds, not from one
      # build a day. Manual dispatches stay opt-in via rebuild_dashboard: a
      # re-run or an experiment must not publish by accident.
      #
      # The hook must belong to the `silo` project's production branch;
      # scripts/vercel_should_build.sh never skips a production build, so a hook
      # on an unchanged commit still refreshes the data. The gate: a run whose
      # analytical apply failed or was skipped by a failed schema step must not
      # publish a snapshot of a warehouse whose matviews did not rebuild; a red
      # SOURCE does not block it, because every slice that landed is whole.
      # `steps.analytical.outcome == 'success' || success()` keeps the modes that
      # never run the apply (a dispatch with rebuild_dashboard=true) as before.
      # continue-on-error: a failed hook must not fail an ingest whose data
      # already landed.
      - name: Trigger dashboard rebuild (Vercel deploy hook)
        if: ${{ !cancelled() && (steps.analytical.outcome == 'success' || success()) && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.rebuild_dashboard == 'true')) }}
        continue-on-error: true  # a failed Vercel hook must not fail an ingest whose data landed
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -uo pipefail
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL unset — skipping dashboard rebuild."
            echo "Create one at Vercel → Project silo → Settings → Git → Deploy Hooks"
            echo "(public dashboard: https://silo-bz-deloslabs.vercel.app/)"
            echo "and store it as the repository secret VERCEL_DEPLOY_HOOK_URL."
            exit 0
          fi
          code=$(curl -sS -X POST -o /tmp/hook.out -w '%{http_code}' "$VERCEL_DEPLOY_HOOK_URL")
          echo "deploy hook responded $code"
          cat /tmp/hook.out || true
          case "$code" in
            2*) echo "Dashboard rebuild queued." ;;
            *)  echo "::warning::deploy hook returned $code; the dashboard will" \
                     "keep serving the previous build until the next trigger." ;;
          esac

      # B3 corporate events and cash distributions (src/pipeline/run_b3_events.py).
      # Their own step, right after the deploy hook, for the same reason as the
      # market data and FNET below: a few hundred calls to B3's listed-companies
      # proxy (about 10 minutes on 2026-09-30) must not be able to skip ANALYZE,
      # the analytical apply or the deploy hook. They ran inside run_daily until
      # 2026-09-30, and on 2026-08-29 a corporate-events SSL EOF turned that
      # process red for data that had all landed. The analytical apply reads
      # neither table; api.quote_history reads b3_corporate_event live, so a new
      # event counts from the moment it lands. A failed source writes its
      # `error` audit row and fails the job.
      # 75, not 45: the corporate-event sweep is one serial request per issuer and
      # B3's latency swings (0.2 s a request on 2026-09-30, 1.0 s on 2026-10-01,
      # when 2,597 requests took 44 minutes and timed out run 36842444079).
      # #482 made the sweep incremental; this is headroom for a slow B3 night.
      - name: Refresh B3 corporate events and cash dividends
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily')) }}
        timeout-minutes: 75
        run: python -m src.pipeline.run_b3_events

      # The FNET document register (fnet_document / fnet_document_filter) runs
      # LAST, on its own. FNET answers GitHub runners slowly and sometimes not at
      # all; when it lived inside run_daily, one fund's ReadTimeout (run
      # 36101156388, 2026-09-25) failed that step and so skipped ANALYZE, the
      # analytical layer and the deploy hook, for CVM/BACEN/B3 data that had all
      # landed. Here it runs even if an earlier step failed (!cancelled()), but a
      # failure still fails the job (no continue-on-error), writes its `error`
      # audit row, and files the tracking issue below. The dashboard does not
      # read FNET, and the api functions over it need no rebuild.
      # DI1 futures and B3's reference curves (pesquisapregao files), the U.S.
      # Treasury par curve, Cboe VIX and EIA Brent (src/pipeline/market_pipeline.py,
      # docs/reference/research/dustin_br_data_sources.md). Its own step, after the
      # analytical layer, for the same reason as FNET below: four foreign hosts
      # must not be able to skip ANALYZE, the analytical apply or the deploy
      # hook. Nothing the dashboard or schema api reads depends on it. A failed
      # slice writes its `error` audit row and fails the job.
      - name: Refresh rates and market data
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily')) }}
        timeout-minutes: 30
        env:
          # Optional. Without it the EIA fetch uses EIA's rate-limited DEMO_KEY.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Cboe VIX is fetched only when this repository variable is 1, which
          # needs a signed Cboe licence (docs/reference/research/dustin_br_data_sources.md §5).
          CBOE_VIX_LICENSED: ${{ vars.CBOE_VIX_LICENSED }}
        run: python -m src.pipeline.market_pipeline

      - name: Refresh FNET document register
        if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily')) }}
        timeout-minutes: 60
        run: python -m src.pipeline.fnet_pipeline

  # FNET restatement diffs (backlog B4, docs/planning/DOCUMENTS.md): for each
  # re-filed FIDC informe mensal, download it and its predecessor from FNET and
  # store what changed (src/pipeline/fnet_diff.py). Its own job, after the
  # ingest job and whatever became of it (!cancelled()), so its FNET latency
  # never eats the ingest job's 180 minutes. The run caps itself at 200
  # documents and a 30-minute budget and leaves the rest queued for tomorrow;
  # a failed download still fails this job and writes its `error` audit row.
  fnet-diff:
    name: FNET restatement diffs
    needs: ingest
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      TZ: "America/Sao_Paulo"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diff restated FIDC informes
        run: python -m src.pipeline.fnet_diff

  # Alerting: a scheduled-run failure files (or bumps) a single tracking issue,
  # so a broken credential or CVM outage emails the repo owner instead of
  # failing silently for weeks (the 2026-07/08 PAM-auth outage went a month
  # unnoticed). Issue-per-incident, comment-per-day — no new secrets needed.
  notify-failure:
    name: File failure issue
    needs: [ingest, fnet-diff]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update tracking issue
        run: |
          set -euo pipefail
          title="Daily ingest is failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Scheduled daily ingest failed again: $RUN_URL"
          else
            body=$(printf '%s\n\n%s' \
              "The scheduled daily ingest failed: $RUN_URL" \
              "Check the failing step's logs. Common causes: expired/rotated POSTGRES_URL secret (psql: PAM authentication failed), CVM blocking the runner IP, or a schema migration error. This issue gets one comment per failing day; close it once a scheduled run is green.")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
