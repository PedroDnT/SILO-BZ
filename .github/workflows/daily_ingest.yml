name: Daily CVM Ingest

on:
  schedule:
    # 06:00 UTC = 03:00 BRT (before Brazilian market open)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - backfill
          - analytics-only
      entity:
        description: "CVM entity to backfill: fi | fidc | fii | fip | fiagro | securit | cia_aberta | etf (leave blank for all)"
        required: false
        default: ""
      start_year:
        description: "Backfill start year (mode=backfill only)"
        required: false
        default: "2019"
      end_year:
        description: "Backfill end year inclusive (mode=backfill only, leave blank for current year)"
        required: false
        default: ""

jobs:
  ingest:
    name: Ingest CVM data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      # Optional: enables the etfsbrasil ETF NAV/price/cotistas scrape in run_daily.
      # When the secret is unset this is empty and the scrape step self-skips.
      APIFY_TOKEN: "${{ secrets.APIFY_TOKEN }}"
      CVM_DNS_NAMESERVERS: "1.1.1.1,8.8.8.8,9.9.9.9"
      # "all" → fi, fidc, fip, fiagro, fii, securit. fii/securit monthly tables
      # (and the FII registry) are only refreshed daily under "all"; under "core"
      # they go stale and rely solely on manual backfills. Yearly entities only
      # re-fetch the current year daily, so runtime stays within timeout-minutes.
      CVM_DAILY_SCOPE: "all"
      CVM_UPSERT_CHUNK_SIZE: "5000"
      CVM_INGEST_CONCURRENCY: "6"
      # FI monthly ZIPs are large; cap their concurrency explicitly so the
      # higher general knob above doesn't spike memory / risk timeouts.
      CVM_FI_CONCURRENCY: "3"
      CVM_DAILY_CONCURRENCY: "8"
      TZ: "America/Sao_Paulo"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Bootstrap the schema on every path (scheduled, daily dispatch, backfill)
      # via the shared composite action, so a fresh/empty DB heals itself and no
      # ingest ever runs against a DB missing a migration. One definition, reused
      # by daily / watchdog / backfill — they can no longer drift apart.
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

      - name: Run daily update
        if: ${{ github.event_name == 'schedule' || (github.event.inputs && github.event.inputs.mode == 'daily') }}
        run: python -m src.pipeline.run_daily

      - name: Run historical backfill
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs && github.event.inputs.mode == 'backfill' }}
        run: |
          ENTITY_FLAG=""
          if [ -n "${{ inputs.entity }}" ]; then
            ENTITY_FLAG="--entity ${{ inputs.entity }}"
          fi
          END_YEAR_FLAG=""
          if [ -n "${{ inputs.end_year }}" ]; then
            END_YEAR_FLAG="--end-year ${{ inputs.end_year }}"
          fi
          python -m src.pipeline.run_backfill \
            --start-year ${{ inputs.start_year }} \
            $END_YEAR_FLAG \
            $ENTITY_FLAG \
            --cvm-only

      - name: Analyze tables post-ingest
        if: ${{ github.event_name == 'schedule' || (github.event.inputs && (github.event.inputs.mode == 'backfill' || github.event.inputs.mode == 'analytics-only')) }}
        run: |
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -c "
            ANALYZE cvm_fi_diario;
            ANALYZE cvm_fi_cda;
            ANALYZE cvm_fi_perfil;
            ANALYZE cvm_fi_balancete;
            ANALYZE cvm_fidc_mensal;
            ANALYZE cvm_fidc_tranche;
            ANALYZE cvm_fidc_tranche_flows;
            ANALYZE cvm_fidc_aging;
            ANALYZE cvm_fiagro_mensal;
            ANALYZE cvm_fip_periodic;
            ANALYZE cvm_fii_mensal;
            ANALYZE cvm_fii_periodic;
            ANALYZE cvm_securit_mensal;
            ANALYZE cvm_securit_serie;
            ANALYZE cvm_securit_fluxo;
            ANALYZE cvm_securit_dfin;
            ANALYZE cvm_fund_registry;
            ANALYZE cvm_etf_registry;
            ANALYZE cvm_ingest_log;
            ANALYZE b3_cotahist;
          "

      # Build/refresh the analytical layer (dims, fact matviews, rankings, fraud
      # screens) after the data lands. Its matview re-create doubles as the daily
      # refresh, so downstream dashboards see fresh aggregates without a separate
      # cron. continue-on-error: an analytical hiccup (e.g. a smoke-check on a
      # slice that has no data yet) stays visible in the run summary but never
      # fails the ingest critical path — psql/POSTGRES_URL come from the steps above.
      #
      # mode=analytics-only exists because this step (unlike schema+migrations)
      # only runs on the scheduled cron or a full backfill — a PR that changes
      # only RPC/matview SQL (no new table/column) has no fast, targeted way to
      # push it to production otherwise, short of waiting for the next 06:00 UTC
      # cron or running the entire multi-hour CVM backfill matrix just to reach
      # this step.
      - name: Build / refresh analytical layer
        if: ${{ github.event_name == 'schedule' || (github.event.inputs && (github.event.inputs.mode == 'backfill' || github.event.inputs.mode == 'analytics-only')) }}
        continue-on-error: true
        run: bash scripts/apply_analytical.sh

  # Alerting: a scheduled-run failure files (or bumps) a single tracking issue,
  # so a broken credential or CVM outage emails the repo owner instead of
  # failing silently for weeks (the 2026-07/08 PAM-auth outage went a month
  # unnoticed). Issue-per-incident, comment-per-day — no new secrets needed.
  notify-failure:
    name: File failure issue
    needs: ingest
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update tracking issue
        run: |
          set -euo pipefail
          title="Daily ingest is failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Scheduled daily ingest failed again: $RUN_URL"
          else
            body=$(printf '%s\n\n%s' \
              "The scheduled daily ingest failed: $RUN_URL" \
              "Check the failing step's logs. Common causes: expired/rotated POSTGRES_URL secret (psql: PAM authentication failed), CVM blocking the runner IP, or a schema migration error. This issue gets one comment per failing day; close it once a scheduled run is green.")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
