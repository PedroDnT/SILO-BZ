name: Engine image

# Builds the portfolio-diagnosis engine image (deploy/cloudflare/engine/, map #510
# slice E step 1) and proves it with the container running: GET /health 200,
# POST /diagnose 401 without the token and with a wrong one, and the offline
# server tests run inside the image so the PDF renderer is exercised with the
# image's own native libraries, and so are the OCR tests: a synthetic statement
# PDF whose labels are pixels is read end to end with the image's tesseract
# (SILO_REQUIRE_OCR=1 turns a skip into a failure). Publishes nothing: no
# registry, no Cloudflare.
# Uses no repository secret: the access token is random per run.

on:
  pull_request:
    paths:
      - deploy/cloudflare/engine/**
      - src/portfolio/**
      - requirements-report.txt
      - tests/test_portfolio_server.py
      - tests/test_portfolio_statement_ocr.py
      - tests/portfolio_ocr_fixtures.py
      - tests/portfolio_extrato_fixtures.py
      - .github/workflows/engine_image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke the engine image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build
        run: docker build -f deploy/cloudflare/engine/Dockerfile -t silo-engine:ci .

      - name: Image size
        run: docker image ls silo-engine:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Smoke the running container
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          docker run -d --name engine -p 8080:8080 \
            -e DEMO_ACCESS_TOKEN="$token" -e SILO_LLM_PROVIDER=fake silo-engine:ci
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@" || true; }

          ok=""
          for attempt in $(seq 1 30); do
            c=$(code http://localhost:8080/health)
            echo "GET /health (attempt $attempt): $c"
            if [ "$c" = 200 ]; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { docker logs engine; echo "::error::/health never answered 200"; exit 1; }

          f=docs/reference/portfolio/statement-template.xlsx
          c=$(code -X POST --data-binary "@$f" http://localhost:8080/diagnose)
          echo "POST /diagnose without the token: $c"
          [ "$c" = 401 ] || { docker logs engine; echo "::error::expected 401 without the token"; exit 1; }

          c=$(code -X POST -H "Authorization: Bearer wrong" --data-binary "@$f" http://localhost:8080/diagnose)
          echo "POST /diagnose with a wrong token: $c"
          [ "$c" = 401 ] || { docker logs engine; echo "::error::expected 401 with a wrong token"; exit 1; }

          c=$(code -X POST -H "Authorization: Bearer $token" --data-binary "not a statement" http://localhost:8080/diagnose)
          echo "POST /diagnose with the token and an unknown format: $c"
          [ "$c" = 415 ] || { docker logs engine; echo "::error::expected 415 for an unknown format"; exit 1; }

          [ "$(docker exec engine id -u)" != 0 ] || { echo "::error::the server runs as root"; exit 1; }
          docker logs engine
          docker rm -f engine

      # The FakeClient and the fake LLM provider, with the real WeasyPrint and the
      # image's libraries; the OCR path with the image's poppler and tesseract.
      # pytest is installed for this step only, never baked in.
      - name: Server and OCR tests inside the image
        run: |
          docker run --rm -e SILO_REQUIRE_OCR=1 -v "$PWD:/repo:ro" -w /repo silo-engine:ci \
            sh -c 'tesseract --version | head -1 && pip install --user --quiet pytest && python -m pytest -p no:cacheprovider -q -rs --durations=5 tests/test_portfolio_server.py tests/test_portfolio_statement_ocr.py'
