name: Credit Implied Rate

# Implied rates of B3 traded debenture PUs into the b3_credit_implied_rate table
# (#1007, ADR 0004 amendment). One cvm_ingest_log row (credit/implied_rate); its
# note counts every reason a trade was not priced. The rows are calculated.
#
# Daily at 06:00 UTC-3 (09:00 UTC), after the 06:00 UTC daily ingest, over the
# last 10 calendar days (idempotent; it catches late B3 sessions and a method
# rerun). The schedule runs only while the repo variable B3_CREDIT_ENABLED is
# '1': without it the daily ingest lands no B3 credit and there is nothing
# new to price. A dispatch always runs, with its own dates.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      date_from:
        description: "First trade date, YYYY-MM-DD"
        required: true
      date_to:
        description: "Last trade date, YYYY-MM-DD"
        required: true
      codes:
        description: "Comma-separated ANBIMA codes, e.g. CLAG13,RADL14. Blank: every bond with a stored agenda."
        required: false
        default: ""
      refresh_holidays:
        description: "Re-read ANBIMA's holiday list first (it is read once when the table is empty)"
        type: boolean
        default: false

# Same writer group as daily_ingest.yml and backfill.yml: one writer at a time.
concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  apply-schema:
    name: "Apply schema"
    if: github.event_name != 'schedule' || vars.B3_CREDIT_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

  compute:
    name: "Compute implied rates"
    needs: [apply-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compute
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
          CODES: ${{ inputs.codes }}
          REFRESH: ${{ inputs.refresh_holidays }}
        run: |
          # A scheduled run has no inputs: the last 10 calendar days, Brasília.
          if [ -z "$DATE_FROM" ]; then
            DATE_FROM=$(TZ=America/Sao_Paulo date -d '10 days ago' +%F)
            DATE_TO=$(TZ=America/Sao_Paulo date +%F)
          fi
          args=(--from "$DATE_FROM" --to "$DATE_TO")
          if [ -n "$CODES" ]; then args+=(--codes "$CODES"); fi
          if [ "$REFRESH" = "true" ]; then args+=(--refresh-holidays); fi
          python -m src.pipeline.credit_implied_pipeline "${args[@]}"
