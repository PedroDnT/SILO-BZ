name: Oracle Crank (Hourly)

on:
  schedule:
    # Post BCB data every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — fetch BCB data but do not post to Solana'
        required: false
        default: 'false'
        type: boolean

jobs:
  crank:
    name: Fetch BCB data and post to Solana
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r delos-oracle/relayer/requirements.txt

      - name: Run relayer (post to Solana)
        if: ${{ inputs.dry_run != 'true' }}
        run: python delos-oracle/relayer/relayer.py
        env:
          ORACLE_KEYPAIR_JSON: ${{ secrets.ORACLE_KEYPAIR_JSON }}
          SOLANA_RPC_URL:      ${{ vars.SOLANA_RPC_URL }}
          ANCHOR_PROGRAM_ID:   ${{ vars.ANCHOR_PROGRAM_ID }}

      - name: Dry run — BCB fetch only
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          python -c "
          import asyncio, sys, json
          sys.path.insert(0, '.')
          sys.path.insert(0, 'delos-oracle/relayer')
          from relayer import fetch_bcb_snapshot
          snapshot = asyncio.run(fetch_bcb_snapshot())
          print('BCB snapshot:', json.dumps(snapshot, indent=2))
          "
