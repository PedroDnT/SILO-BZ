name: Dashboard Publish Check

# Confirms the dashboard build the deploy hook made is the one the public host
# actually serves, and promotes it when it is not.
#
# WHY IT EXISTS: on 2026-09-22 Pedro reported the inflation section missing from
# /macro. It had shipped four days earlier and built correctly every night; the
# public hostnames had simply stopped taking production deployments, so four
# READY builds published nothing. Nobody noticed because the only things checked
# were build-log row counts and deployment state — both true, neither the site.
# See docs/planning/OPEN_ITEMS.md item 8 for the measurements, including the
# part that is still undiagnosed: WHY auto-assignment stopped.
#
# TIMING: daily_ingest fires the deploy hook at the end of ingest (~06:56 UTC
# measured) and the Evidence build runs 17-45 min, so 08:00 UTC sits after the
# slowest observed finish. A long ingest that pushes the build past 08:00 makes
# this run red rather than falsely green — which is the point of it.
#
# Read-only against Postgres (it never touches it), so it may overlap anything.

# INTERIM (OPEN_ITEMS item 8): the workflow_run trigger below publishes a build
# made by a manual dispatch (rebuild_dashboard=true) without waiting for the
# next 08:00 UTC run. It is a stopgap for the undiagnosed auto-assignment
# failure, not the fix: the durable fix is whatever makes Vercel assign the
# project domains to a production build again, after which this trigger goes.
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC — after the 06:00 ingest's deploy-hook build
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily CVM Ingest"]
    types: [completed]

jobs:
  publish-check:
    name: Confirm the public host serves the newest build
    runs-on: ubuntu-latest
    # A red run can still have fired the hook (a red source does not block it),
    # so a failed run is let through and the gate step below decides.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # list the run's steps
    steps:
      - name: Did the failed run fire the deploy hook?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          proceed=true
          if [ "${CONCLUSION:-}" = failure ]; then
            fired=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" |
              jq '[.jobs[].steps[]? | select(.name == "Trigger dashboard rebuild (Vercel deploy hook)" and .conclusion == "success")] | length')
            if [ "$fired" -eq 0 ]; then
              proceed=false
              echo "The failed run did not fire the deploy hook; no build to check."
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: ${{ steps.gate.outputs.proceed == 'true' }}
      - name: Promote and verify
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # after a dispatch the build can still be running: wait for it
          WAIT_FOR_BUILD_MINUTES: ${{ github.event_name == 'workflow_run' && '45' || '0' }}
        run: bash scripts/promote_dashboard.sh
