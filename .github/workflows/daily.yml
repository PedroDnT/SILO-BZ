name: CVM Daily Update

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC = 05:00 BRT (after CVM publishes overnight data)
  workflow_dispatch:

jobs:
  daily-update:
    name: Daily incremental update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily update
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          LOG_LEVEL: INFO
        run: python -m src.pipeline.run_daily
