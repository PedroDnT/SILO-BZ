name: Market Data Backfill

# History for src/pipeline/market_pipeline.py: DI1 futures (B3 Price Report,
# from 2018-01-02), B3 reference curves (TaxaSwap, from 2008-01-02), the U.S.
# Treasury par curve, EIA Brent and the OFR Financial Stress Index (from
# 2000-01-03). The daily run keeps them fresh; this fills the past.
# docs/reference/research/dustin_br_data_sources.md §10. Cboe VIX runs only with a
# signed Cboe licence: repository variable CBOE_VIX_LICENSED=1 (§5).
#
# One YEAR per job, one job at a time by default: a Price Report is ~12 MB
# zipped and ~10 s to parse, so a year of sessions is roughly an hour, inside
# the 6-hour job cap with room (INSTRUMENTS.md: new deep backfills year-shard).
# max_parallel runs up to 4 years at once. The Price Report writes ~40 rows a
# session, so its 2018-2026 history can run 3 at a time and finish before the
# daily at 03:00 UTC-3 (06:00 UTC) instead of running into it.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated: b3_price_report, b3_reference_rate, us_treasury, eia_brent, ofr_fsi (cboe_vix only where licensed)"
        required: true
        default: "b3_reference_rate"
      start_year:
        description: "First year (b3_reference_rate starts 2008, b3_price_report 2018)"
        required: true
        default: "2008"
      end_year:
        description: "Last year (inclusive)"
        required: true
        default: "2026"
      max_parallel:
        description: "Year jobs at once, 1-4 (1 unless the history must finish before the next daily)"
        required: false
        default: "1"

# Same writer group as daily_ingest.yml and backfill.yml: one writer at a time
# against the shared Postgres. A running job is never cancelled, but GitHub
# keeps only ONE pending run per group: a newer dispatch (or the daily at
# 03:00 UTC-3 (06:00 UTC)) cancels an older pending one. Dispatch when nothing
# else is pending (run 36333939450 was cancelled this way on 2026-09-27).
concurrency:
  group: supabase-ingest
  cancel-in-progress: false

jobs:
  apply-schema:
    name: "Apply schema"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply schema + migrations
        uses: ./.github/actions/apply-schema
        with:
          postgres-url: ${{ secrets.POSTGRES_URL }}

  years:
    name: "Years"
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.range.outputs.years }}
    steps:
      - id: range
        env:
          START: ${{ inputs.start_year }}
          END: ${{ inputs.end_year }}
          PARALLEL: ${{ inputs.max_parallel || '1' }}
        run: |
          set -euo pipefail
          [[ "$START" =~ ^[0-9]{4}$ && "$END" =~ ^[0-9]{4}$ && "$START" -le "$END" ]] \
            || { echo "::error::start_year/end_year must be YYYY with start <= end"; exit 1; }
          [[ "$PARALLEL" =~ ^[1-4]$ ]] \
            || { echo "::error::max_parallel must be 1-4"; exit 1; }
          echo "years=$(seq "$START" "$END" | jq -cs .)" >> "$GITHUB_OUTPUT"

  backfill:
    name: "Backfill ${{ matrix.year }}"
    needs: [apply-schema, years]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: ${{ fromJSON(inputs.max_parallel || '1') }}
      fail-fast: false
      matrix:
        year: ${{ fromJSON(needs.years.outputs.years) }}
    env:
      POSTGRES_URL: "${{ secrets.POSTGRES_URL }}"
      EIA_API_KEY: "${{ secrets.EIA_API_KEY }}"
      # Set the repository variable to 1 only once a Cboe licence is signed.
      CBOE_VIX_LICENSED: "${{ vars.CBOE_VIX_LICENSED }}"
      TZ: "America/Sao_Paulo"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill ${{ matrix.year }}
        env:
          SOURCES: ${{ inputs.sources }}
          YEAR: ${{ matrix.year }}
        run: |
          python -m src.pipeline.market_pipeline --backfill \
            --sources "$SOURCES" --start "$YEAR-01-01" --end "$YEAR-12-31"
