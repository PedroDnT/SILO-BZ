# Tax rule file (#613). Every rate, article, URL and quote is copied from
# docs/reference/research/tax-rules-by-instrument.md (#611), never from memory.
# Schema: section 5 of that note (silo.tax_rule/0.1); read by src/portfolio/tax.py.
schema: silo.tax_rule/0.1
instrument: fii
label: FII
version: 1
valid_from: "2024-01-01"
valid_to: null
position_date_checked: "2026-09-30"
sources:
  - id: l8668_art18
    act: Lei 8.668/1993
    article: art. 18, I e II (redação da Lei 9.779/1999)
    url: https://www.planalto.gov.br/ccivil_03/LEIS/L8668.htm
    accessed: "2026-10-05"
    quote: "Os ganhos de capital e rendimentos auferidos na alienação ou no resgate de quotas dos fundos de investimento imobiliário, por qualquer beneficiário ... sujeitam-se à incidência do imposto de renda à alíquota de vinte por cento: I - na fonte, no caso de resgate; II - às mesmas normas aplicáveis aos ganhos de capital ou ganhos líquidos auferidos em operações de renda variável, nos demais casos."
  - id: l8668_art17
    act: Lei 8.668/1993
    article: art. 17
    url: https://www.planalto.gov.br/ccivil_03/LEIS/L8668.htm
    accessed: "2026-10-05"
    quote: "sujeitam-se à incidência do imposto de renda na fonte, à alíquota de vinte por cento"
  - id: l11033_art3_iii
    act: Lei 11.033/2004
    article: art. 3º, III (redação da Lei 14.130/2021)
    url: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/lei/l11033.htm
    accessed: "2026-10-05"
    quote: "os rendimentos distribuídos pelos Fundos de Investimento Imobiliário e pelos Fundos de Investimento nas Cadeias Produtivas Agroindustriais (Fiagro) cujas cotas sejam admitidas à negociação exclusivamente em bolsas de valores ou no mercado de balcão organizado"
  - id: l11033_art3_p1
    act: Lei 11.033/2004
    article: art. 3º §1º, I a III
    url: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/lei/l11033.htm
    accessed: "2026-10-05"
    quote: "será concedido somente nos casos em que os Fundos de Investimento Imobiliário ou os Fiagro possuam, no mínimo, 100 (cem) cotistas"
  - id: l14754_art39
    act: Lei 14.754/2023
    article: art. 39
    url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14754.htm
    accessed: "2026-10-05"
    quote: "Ficam ressalvadas do disposto nesta Lei as regras aplicáveis aos seguintes fundos ... I - os Fundos de Investimento Imobiliário (FII) ... V - os fundos de investimento de que trata a Lei nº 12.431 ... VII - os ETFs de Renda Fixa"
ir:
  events:
    - event: sale
      primary: true
      withheld_at_source: false
      definitive: true
      base: net_gain_month
      rate: { table: fixed, rate: 0.20 }
      source: l8668_art18
    - event: distribution
      withheld_at_source: true
      definitive: true
      base: income
      rate: { table: fixed, rate: 0.20 }
      source: l8668_art17
  periodic: null
  periodic_source: l14754_art39
  exemptions:
    - applies_to: distribution
      label: "rendimentos distribuídos isentos se as cotas são negociadas só em bolsa ou balcão organizado, o fundo tem ao menos 100 cotistas, a pessoa tem menos de 10% e as pessoas ligadas menos de 30%"
      all_of:
        - {
            condition: traded_exclusively_on_exchange_or_otc,
            source: l11033_art3_iii,
          }
        - { condition: fund_holders_ge, value: 100, source: l11033_art3_p1 }
        - { condition: holder_share_lt, value: 0.10, source: l11033_art3_p1 }
        - {
            condition: linked_holders_share_lt,
            value: 0.30,
            source: l11033_art3_p1,
          }
iof:
  applies: false
  rule: zero_rate
engine_cannot_observe:
  - id: fii_isencao_rendimentos
    text: "isenção dos rendimentos distribuídos: cotas negociadas só em bolsa ou balcão organizado, ao menos 100 cotistas, participação da pessoa abaixo de 10% e das pessoas ligadas abaixo de 30% (Lei 11.033, art. 3º, III e §1º)"
    decides_rate: false
not_verified: []
