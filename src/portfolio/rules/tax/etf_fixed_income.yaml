schema: silo.tax_rule/0.1
instrument: etf_fixed_income
label: ETF de renda fixa
version: 1
valid_from: "2014"
valid_to: null
position_date_checked: "2026-09-30"
sources:
  - id: l13043_art2
    act: Lei 13.043/2014
    article: art. 2º, I a III, §1º e §4º
    url: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/l13043.htm
    accessed: "2026-10-05"
    quote: "I - 25% ... prazo médio de repactuação igual ou inferior a 180 (cento e oitenta) dias; II - 20% ... superior a cento e oitenta dias e igual ou inferior a 720 ... III - 15% ... superior a 720 (setecentos e vinte) dias."
  - id: l13043_art2_p1
    act: Lei 13.043/2014
    article: art. 2º §1º
    url: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/l13043.htm
    accessed: "2026-10-05"
    quote: "à alíquota de 30% (trinta por cento) durante o prazo do descumprimento"
  - id: l13043_art2_p4
    act: Lei 13.043/2014
    article: art. 2º §4º
    url: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/l13043.htm
    accessed: "2026-10-05"
    quote: "incidirá na fonte e exclusivamente por ocasião do resgate ou da alienação das cotas ou da distribuição de rendimentos"
