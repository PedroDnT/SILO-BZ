# Tax rule file (#613). Every rate, article, URL and quote is copied from
# docs/reference/research/tax-rules-by-instrument.md (#611), never from memory.
# Schema: section 5 of that note (silo.tax_rule/0.1); read by src/portfolio/tax.py.
schema: silo.tax_rule/0.1
instrument: fund_short
label: fundo com come-cotas, curto prazo
version: 1
valid_from: "2024-01-01"
valid_to: null
position_date_checked: "2026-09-30"
sources:
  - id: l14754_art17
    act: Lei 14.754/2023
    article: art. 17, I e II
    url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14754.htm
    accessed: "2026-10-05"
    quote: "I - no último dia útil dos meses de maio e novembro; ou II - na data da distribuição de rendimentos, da amortização ou do resgate de cotas, caso ocorra antes."
  - id: l14754_art17_p1_ii
    act: Lei 14.754/2023
    article: art. 17 §1º, II
    url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14754.htm
    accessed: "2026-10-05"
    quote: "II - nos fundos de que trata o art. 6º da Lei nº 11.053 ... a) 20% (vinte por cento), na data da tributação periódica"
  - id: l11053_art6
    act: Lei 11.053/2004
    article: art. 6º caput e §2º
    url: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/lei/l11053.htm
    accessed: "2026-10-05"
    quote: "I - 22,5% ... em aplicações com prazo de até 6 (seis) meses; II - 20% (vinte por cento), em aplicações com prazo acima de 6 (seis) meses."
  - id: l11053_art6_caput
    act: Lei 11.053/2004
    article: art. 6º caput
    url: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/lei/l11053.htm
    accessed: "2026-10-05"
    quote: "Os fundos de investimento cuja carteira de títulos tenha prazo médio igual ou inferior a 365 (trezentos e sessenta e cinco) dias"
ir:
  events:
    - event: redemption
      primary: true
      withheld_at_source: true
      definitive: true
      base: income
      rate:
        table: holding
        unit: months
        rows:
          - { min: 0, max: 6, rate: 0.225 }
          - { min: 6, max: null, rate: 0.20 }
      source: l11053_art6
  periodic:
    dates: [last_business_day_may, last_business_day_nov]
    rate: 0.20
    complement_to: holding table of the redemption event
    source: l14754_art17_p1_ii
    dates_source: l14754_art17
  exemptions: []
iof:
  applies: true
  rule: iof_30_day_table
engine_cannot_observe:
  - id: fundo_longo_ou_curto
    text: "se o fundo é de longo prazo ou de curto prazo (carteira com prazo médio de até 365 dias): a classificação tributária do fundo não está no extrato"
    decides_rate: true
  - id: carencia_fundo
    text: "carência do fundo: resgate antes da carência paga IOF de 0,5% ao dia (Decreto 6.306, art. 31)"
    decides_rate: false
not_verified:
  - "contagem do prazo de cada parcela tributada pelo come-cotas: matéria de IN RFB, não lida (nota #611, seção 6)"
