services:
  postgres:
    image: postgres:16
    container_name: iliquid_postgres
    environment:
      POSTGRES_DB: iliquid
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/store/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d iliquid"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
