version: "3.9"

services:

  db:
    image: postgres:16
    container_name: iliquid_db
    command: postgres -N 200
    environment:
      POSTGRES_DB: iliquid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iliquid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - br_finance

  db_migrate:
    build:
      context: .
      dockerfile: src/db/Dockerfile
    container_name: iliquid_db_migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:changeme_in_production@db:5432/iliquid}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - br_finance
    # No restart — this is a one-shot job; service_completed_successfully requires exit 0

  cvm_api:
    build:
      context: .
      dockerfile: src/cvm_api/Dockerfile
    image: cvm-api:latest
    container_name: cvm_api
    # Internal only — traffic routed via gateway on port 8080
    expose:
      - "8000"
    environment:
      - LOG_LEVEL=info
      - CVM_DATABASE_URL=${CVM_DATABASE_URL:-postgresql+asyncpg://cvm_user:cvm_secret@db:5432/iliquid}
    volumes:
      - ./cache:/app/cache
      - ./temp:/app/temp
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - br_finance

  b3_calc_api:
    build:
      context: .
      dockerfile: src/b3_calc_api/Dockerfile
    image: b3-calc-api:latest
    container_name: b3_calc_api
    expose:
      - "8001"
    environment:
      - LOG_LEVEL=info
      - B3_CALC_DATABASE_URL=${B3_CALC_DATABASE_URL:-postgresql+asyncpg://b3_calc_user:b3_secret@db:5432/iliquid}
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - br_finance

  bacen_api:
    build:
      context: .
      dockerfile: src/bacen_api/Dockerfile
    image: bacen-api:latest
    container_name: bacen_api
    expose:
      - "8002"
    environment:
      - BACEN_API_PORT=8002
      - LOG_LEVEL=info
      - BACEN_DATABASE_URL=${BACEN_DATABASE_URL:-postgresql+asyncpg://bacen_user:bacen_secret@db:5432/iliquid}
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - br_finance

  gateway:
    build:
      context: .
      dockerfile: src/gateway/Dockerfile
    image: br-finance-gateway:latest
    container_name: br_finance_gateway
    ports:
      - "8080:8080"
    environment:
      - CVM_API_URL=http://cvm_api:8000
      - B3_CALC_API_URL=http://b3_calc_api:8001
      - BACEN_API_URL=http://bacen_api:8002
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
    depends_on:
      cvm_api:
        condition: service_healthy
      b3_calc_api:
        condition: service_healthy
      bacen_api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - br_finance

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
    image: br-finance-docs:latest
    container_name: br_finance_docs
    ports:
      - "8090:8080"
    environment:
      - PORT=8080
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - br_finance

networks:
  br_finance:
    driver: bridge

volumes:
  postgres_data:
